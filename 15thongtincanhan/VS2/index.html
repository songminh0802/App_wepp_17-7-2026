<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Lưu Trữ Thông Tin</title>
    <!-- Tích hợp Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tích hợp Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Quicksand', sans-serif; 
            background-color: #f4f4f9; 
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        .credit-text { font-family: 'Dancing Script', cursive; font-size: 2.2rem; }
        
        .pastel-0 { background-color: #ffdde1; color: #5a2e34; } 
        .pastel-1 { background-color: #d4fc79; color: #3a4a15; } 
        .pastel-2 { background-color: #c2e9fb; color: #1e4b61; } 
        .pastel-3 { background-color: #e0c3fc; color: #3a1c5e; } 
        .pastel-4 { background-color: #ffecd2; color: #5c411c; } 
        .pastel-5 { background-color: #d1f2eb; color: #1a4a3e; } 
        
        .card-hover { transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .card-hover:hover {
            transform: scale(1.03) translateY(-6px);
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.1), 0 10px 15px -6px rgba(0, 0, 0, 0.05);
        }
        
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track { background: transparent; }
        textarea::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="text-gray-800">
    
    <!-- KHU VỰC NỘI DUNG APP -->
    <div id="app-content" class="flex flex-col min-h-screen w-full transition-opacity duration-700">
        
        <!-- Toast Notification -->
        <div id="toast" class="fixed top-5 right-5 bg-gradient-to-r from-green-400 to-green-500 text-white px-6 py-3 rounded-2xl shadow-lg transform transition-all duration-500 translate-y-[-100px] opacity-0 z-50 flex items-center gap-2 font-semibold">
            <span id="toast-msg">🎉 Đã lưu thành công!</span>
        </div>

        <!-- Main Content -->
        <main class="flex-grow container mx-auto px-4 py-10 max-w-6xl">
            <!-- Giao diện Form -->
            <div class="max-w-2xl mx-auto bg-white/90 backdrop-blur-sm rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.06)] p-8 border border-white mb-12 relative overflow-hidden">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-yellow-200 rounded-full mix-blend-multiply filter blur-xl opacity-70"></div>
                <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-pink-200 rounded-full mix-blend-multiply filter blur-xl opacity-70"></div>
                
                <h1 class="text-3xl font-bold text-center mb-8 text-indigo-600 flex justify-center items-center gap-3 relative z-10">
                    <span>✨</span> Kho Lưu Trữ Thông Tin <span>🚀</span>
                </h1>
                
                <form id="note-form" class="space-y-5 relative z-10">
                    <div class="flex gap-2 mb-2 flex-wrap sm:flex-nowrap">
                        <label class="flex-1 cursor-pointer w-[48%] sm:w-auto">
                            <input type="radio" name="note-type" value="info" class="peer sr-only" checked>
                            <div class="text-center px-1 py-3 rounded-2xl border-2 border-transparent bg-gray-50 peer-checked:border-purple-400 peer-checked:bg-purple-50 text-gray-500 peer-checked:text-purple-600 font-bold transition-all shadow-sm text-sm sm:text-base">
                                📄 Thành tích
                            </div>
                        </label>
                        <label class="flex-1 cursor-pointer w-[48%] sm:w-auto">
                            <input type="radio" name="note-type" value="salary" class="peer sr-only">
                            <div class="text-center px-1 py-3 rounded-2xl border-2 border-transparent bg-gray-50 peer-checked:border-emerald-400 peer-checked:bg-emerald-50 text-gray-500 peer-checked:text-emerald-600 font-bold transition-all shadow-sm text-sm sm:text-base">
                                💰 Lương
                            </div>
                        </label>
                        <label class="flex-1 cursor-pointer w-[48%] sm:w-auto">
                            <input type="radio" name="note-type" value="document" class="peer sr-only">
                            <div class="text-center px-1 py-3 rounded-2xl border-2 border-transparent bg-gray-50 peer-checked:border-orange-400 peer-checked:bg-orange-50 text-gray-500 peer-checked:text-orange-600 font-bold transition-all shadow-sm text-sm sm:text-base">
                                📁 Giấy tờ
                            </div>
                        </label>
                        <label class="flex-1 cursor-pointer w-[48%] sm:w-auto">
                            <input type="radio" name="note-type" value="account" class="peer sr-only">
                            <div class="text-center px-1 py-3 rounded-2xl border-2 border-transparent bg-gray-50 peer-checked:border-indigo-400 peer-checked:bg-indigo-50 text-gray-500 peer-checked:text-indigo-600 font-bold transition-all shadow-sm text-sm sm:text-base">
                                🔑 Tài khoản
                            </div>
                        </label>
                    </div>

                    <div>
                        <input type="text" id="note-title" list="title-suggestions" placeholder="Nhập hoặc chọn tiêu đề từ gợi ý... 🏷️" class="w-full px-5 py-3.5 rounded-2xl bg-gray-50/80 border border-gray-200 focus:outline-none focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 focus:bg-white transition-all text-lg" required>
                        <datalist id="title-suggestions">
                            <option value="Chuyên môn"></option>
                            <option value="Chủ nhiệm"></option>
                            <option value="Tuyển sinh 10"></option>
                            <option value="Lương"></option>
                            <option value="Giấy tờ"></option>
                            <option value="Đảng"></option>
                            <option value="Khác"></option>
                        </datalist>
                    </div>

                    <!-- Khu vực dành riêng cho: Thành tích & Tài khoản -->
                    <div id="info-account-fields" class="space-y-5 block">
                        <div>
                            <input type="text" id="note-school-year" list="school-years" placeholder="Nhập hoặc chọn năm học từ gợi ý... 🎓" class="w-full px-5 py-3.5 rounded-2xl bg-gray-50/80 border border-gray-200 focus:outline-none focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 focus:bg-white transition-all text-lg">
                            <datalist id="school-years">
                                <option value="2021 - 2022"></option>
                                <option value="2022 - 2023"></option>
                                <option value="2023 - 2024"></option>
                                <option value="2024 - 2025"></option>
                                <option value="2025 - 2026"></option>
                                <option value="2026 - 2027"></option>
                                <option value="2027 - 2028"></option>
                                <option value="2028 - 2029"></option>
                                <option value="2029 - 2030"></option>
                                <option value="2030 - 2031"></option>
                            </datalist>
                        </div>
                        <div>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none text-gray-400 font-bold">🗓️</span>
                                <input type="date" id="note-date-received" class="w-full pl-12 pr-5 py-3.5 rounded-2xl bg-gray-50/80 border border-gray-200 focus:outline-none focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 focus:bg-white transition-all text-lg text-gray-600" title="Ngày tháng nhận">
                            </div>
                        </div>
                    </div>

                    <!-- Khu vực dành riêng cho: Lương -->
                    <div id="salary-fields" class="space-y-5 hidden">
                        <div class="flex gap-4">
                            <input type="text" id="note-he-so" placeholder="Hệ số (VD: 3.33)" class="w-1/2 px-5 py-3.5 rounded-2xl bg-gray-50/80 border border-gray-200 focus:outline-none focus:ring-4 focus:ring-emerald-100 focus:border-emerald-400 focus:bg-white transition-all text-lg">
                            <input type="text" id="note-bac" placeholder="Bậc (VD: 3/9)" class="w-1/2 px-5 py-3.5 rounded-2xl bg-gray-50/80 border border-gray-200 focus:outline-none focus:ring-4 focus:ring-emerald-100 focus:border-emerald-400 focus:bg-white transition-all text-lg">
                        </div>
                        <div class="flex gap-4">
                            <div class="w-1/2 flex flex-col gap-1.5">
                                <label class="text-sm font-bold text-gray-500 pl-2">Ngày hưởng</label>
                                <input type="date" id="note-ngay-huong" class="w-full px-5 py-3.5 rounded-2xl bg-gray-50/80 border border-gray-200 focus:outline-none focus:ring-4 focus:ring-emerald-100 focus:border-emerald-400 focus:bg-white transition-all text-lg text-gray-600">
                            </div>
                            <div class="w-1/2 flex flex-col gap-1.5">
                                <label class="text-sm font-bold text-gray-500 pl-2">Nâng bậc sau</label>
                                <input type="date" id="note-lan-nang-sau" class="w-full px-5 py-3.5 rounded-2xl bg-gray-50/80 border border-gray-200 focus:outline-none focus:ring-4 focus:ring-emerald-100 focus:border-emerald-400 focus:bg-white transition-all text-lg text-gray-600">
                            </div>
                        </div>
                    </div>

                    <!-- Khu vực dành riêng cho: Giấy tờ -->
                    <div id="document-fields" class="space-y-5 hidden">
                        <div>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none text-gray-400 font-bold">🗓️</span>
                                <input type="date" id="note-document-date" class="w-full pl-12 pr-5 py-3.5 rounded-2xl bg-gray-50/80 border border-gray-200 focus:outline-none focus:ring-4 focus:ring-orange-100 focus:border-orange-400 focus:bg-white transition-all text-lg text-gray-600" title="Ngày tháng giấy tờ">
                            </div>
                        </div>
                    </div>

                    <div>
                        <textarea id="note-content" rows="4" placeholder="Nhập nội dung chi tiết cần lưu... ✍️" class="w-full px-5 py-4 rounded-2xl bg-gray-50/80 border border-gray-200 focus:outline-none focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 focus:bg-white transition-all text-lg resize-none" required></textarea>
                    </div>
                    
                    <!-- Vùng Thêm Ảnh -->
                    <div class="border-2 border-dashed border-gray-300 rounded-2xl p-4 text-center relative hover:bg-gray-50 transition-colors" id="image-upload-zone">
                        <input type="file" id="image-input" accept="image/*" class="hidden">
                        
                        <!-- Khu vực hiển thị khi có ảnh -->
                        <div id="image-preview-container" class="hidden relative inline-block">
                            <img id="image-preview" src="" alt="Preview" class="max-h-48 rounded-xl mx-auto shadow-sm object-contain">
                            <button type="button" id="remove-image-btn" class="absolute -top-3 -right-3 bg-red-500 text-white rounded-full p-1.5 hover:bg-red-600 shadow-md transition-transform active:scale-95" title="Xóa ảnh">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </div>
                        
                        <!-- Khu vực nút thêm ảnh -->
                        <div id="image-placeholder" class="py-2">
                            <button type="button" id="trigger-upload-btn" class="text-indigo-500 font-semibold hover:text-indigo-600 flex items-center justify-center gap-2 mx-auto transition-colors">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                                Bấm để chọn ảnh hoặc <kbd class="px-2 py-1 bg-gray-200 text-gray-700 rounded-md text-sm shadow-sm border border-gray-300">Ctrl + V</kbd> dán trực tiếp
                            </button>
                        </div>
                    </div>

                    <div class="flex gap-3 mt-2">
                        <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 text-white font-bold py-4 px-6 rounded-2xl shadow-lg hover:shadow-xl transform transition-all active:scale-95 flex justify-center items-center gap-2 text-lg">
                            Lưu Thông Tin <span>💾</span>
                        </button>
                        <button type="button" id="cancel-edit-btn" class="hidden w-1/3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-4 px-6 rounded-2xl shadow-lg transform transition-all active:scale-95 flex justify-center items-center gap-2 text-lg">
                            Hủy <span>❌</span>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Thanh Tìm kiếm thông minh -->
            <div class="max-w-2xl mx-auto mb-6 relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <input type="text" id="search-input" placeholder="Tìm kiếm theo tiêu đề hoặc nội dung..." class="w-full pl-12 pr-4 py-3.5 rounded-2xl bg-white border border-gray-200 focus:outline-none focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 transition-all text-gray-700 shadow-sm text-lg font-medium">
            </div>

            <!-- Bộ lọc (Tabs) -->
            <div class="flex justify-center gap-3 mb-8 flex-wrap">
                <button class="filter-btn active px-6 py-2.5 rounded-full font-bold text-white bg-indigo-500 shadow-md transition-all transform hover:scale-105" data-filter="all">🌟 Tất cả</button>
                <button class="filter-btn px-6 py-2.5 rounded-full font-bold text-gray-600 bg-white hover:bg-purple-50 shadow-sm transition-all transform hover:scale-105" data-filter="info">📄 Thành tích</button>
                <button class="filter-btn px-6 py-2.5 rounded-full font-bold text-gray-600 bg-white hover:bg-emerald-50 shadow-sm transition-all transform hover:scale-105" data-filter="salary">💰 Lương</button>
                <button class="filter-btn px-6 py-2.5 rounded-full font-bold text-gray-600 bg-white hover:bg-orange-50 shadow-sm transition-all transform hover:scale-105" data-filter="document">📁 Giấy tờ</button>
                <button class="filter-btn px-6 py-2.5 rounded-full font-bold text-gray-600 bg-white hover:bg-indigo-50 shadow-sm transition-all transform hover:scale-105" data-filter="account">🔑 Tài khoản</button>
            </div>

            <!-- Khu vực Lưới thẻ (Thay đổi cấu trúc lưới: 4 cột trên tablet, 6 cột trên desktop) -->
            <div id="cards-container" class="grid grid-cols-1 sm:grid-cols-4 lg:grid-cols-6 gap-6">
                <div class="col-span-full text-center text-gray-500 py-12 flex flex-col items-center justify-center">
                    <svg class="animate-spin mb-4 h-10 w-10 text-indigo-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <p class="font-medium text-lg text-indigo-400">Đang đồng bộ dữ liệu...</p>
                </div>
            </div>
        </main>

        <!-- Credit Footer -->
        <footer class="py-8 mt-auto w-full flex justify-center items-center bg-gradient-to-t from-gray-100 to-transparent">
            <div class="text-center flex flex-col items-center">
                <span class="text-gray-400 text-sm tracking-widest uppercase block mb-1">Thiết kế bởi</span>
                <p class="credit-text text-gray-600 hover:text-indigo-500 transition-colors duration-300 drop-shadow-sm cursor-default">
                    Thầy Nguyễn Cường
                </p>
            </div>
        </footer>
    </div>

    <!-- Modal Xem Chi Tiết -->
    <div id="view-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center bg-gray-900/60 backdrop-blur-sm transition-opacity duration-300 opacity-0 p-4">
        <div class="bg-white w-full max-w-3xl max-h-[90vh] rounded-3xl shadow-2xl overflow-hidden flex flex-col transform scale-95 transition-transform duration-300">
            <div class="p-6 border-b border-gray-100 flex justify-between items-start bg-gray-50/50">
                <div>
                    <h2 id="modal-title" class="text-2xl font-bold text-gray-800 pr-8">Tiêu đề</h2>
                    <div id="modal-badge" class="mt-3 flex flex-wrap gap-2"></div>
                </div>
                <button id="close-modal-btn" class="p-2 bg-gray-200 hover:bg-red-100 hover:text-red-600 rounded-full transition-all active:scale-95">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-grow">
                <!-- Khu vực thông số Lương (chỉ hiện khi type là salary) -->
                <div id="modal-salary-info" class="hidden mb-6 bg-emerald-50 rounded-2xl p-4 border border-emerald-100 shadow-inner">
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 text-center">
                        <div><p class="text-sm text-emerald-600 font-bold mb-1">Hệ số</p><p id="modal-he-so" class="text-lg font-extrabold text-emerald-800">-</p></div>
                        <div><p class="text-sm text-emerald-600 font-bold mb-1">Bậc</p><p id="modal-bac" class="text-lg font-extrabold text-emerald-800">-</p></div>
                        <div><p class="text-sm text-emerald-600 font-bold mb-1">Ngày hưởng</p><p id="modal-ngay-huong" class="text-lg font-extrabold text-emerald-800">-</p></div>
                        <div><p class="text-sm text-emerald-600 font-bold mb-1">Lần nâng sau</p><p id="modal-lan-nang-sau" class="text-lg font-extrabold text-emerald-800">-</p></div>
                    </div>
                </div>

                <!-- Khu vực chứa ảnh nếu có -->
                <img id="modal-image" src="" alt="Attached Image" class="w-full max-h-96 object-contain rounded-2xl mb-6 hidden shadow-sm border border-gray-100">
                <p id="modal-content-text" class="text-lg text-gray-700 whitespace-pre-wrap leading-relaxed font-medium"></p>
            </div>
            <div class="p-4 border-t border-gray-100 bg-gray-50/50 flex justify-between items-center">
                <span id="modal-time" class="text-sm font-bold text-gray-500 uppercase tracking-wide">Thời gian</span>
                <button id="copy-btn" class="flex items-center gap-2 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-4 py-2 rounded-xl font-bold transition-all active:scale-95">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    Copy Nội Dung
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Xem Ảnh To (Lightbox) -->
    <div id="lightbox-modal" class="fixed inset-0 z-[200] hidden flex items-center justify-center bg-black/90 backdrop-blur-sm transition-opacity duration-300 opacity-0 p-4">
        <button id="close-lightbox-btn" class="absolute top-5 right-5 p-3 bg-white/10 hover:bg-white/20 text-white rounded-full transition-all active:scale-95 z-[210]">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <img id="lightbox-image" src="" alt="Zoomed Image" class="max-w-full max-h-[95vh] object-contain rounded-lg shadow-2xl transform scale-95 transition-transform duration-300">
    </div>

    <!-- KHỞI TẠO FIREBASE & LOGIC ỨNG DỤNG -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, query, orderBy, doc, updateDoc, increment, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Cấu hình Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyC-8kCyIv8n7jB-GiKXGeWllpXtoBNPKzA",
            authDomain: "cuongcsdl.firebaseapp.com",
            databaseURL: "https://cuongcsdl-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "cuongcsdl",
            storageBucket: "cuongcsdl.firebasestorage.app",
            messagingSenderId: "510371041821",
            appId: "1:510371041821:web:b37e8534f4f1132df62cf4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const notesCollection = collection(db, 'thongtin');

        signInAnonymously(auth).catch(err => console.log("Không sử dụng Auth ẩn danh:", err));

        // Hàm tiện ích Escape Regex và Highlight
        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function highlightText(text, query) {
            const safeText = escapeHtml(text || "");
            if (!query) return safeText;
            const safeQuery = escapeHtml(query);
            const regex = new RegExp(`(${escapeRegExp(safeQuery)})`, 'gi');
            return safeText.replace(regex, '<mark class="bg-yellow-300 text-gray-900 rounded-sm px-0.5">$1</mark>');
        }
        
        function formatDateVN(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : escapeHtml(dateStr);
        }

        // ==========================================
        // LOGIC CHÍNH CỦA ỨNG DỤNG
        // ==========================================
        const form = document.getElementById('note-form');
        const titleInput = document.getElementById('note-title');
        const schoolYearInput = document.getElementById('note-school-year');
        const dateReceivedInput = document.getElementById('note-date-received');
        const contentInput = document.getElementById('note-content');
        
        // Các trường của form Lương
        const heSoInput = document.getElementById('note-he-so');
        const bacInput = document.getElementById('note-bac');
        const ngayHuongInput = document.getElementById('note-ngay-huong');

        // ==========================================
        // XỬ LÝ DÁN (PASTE) NGÀY THÁNG THÔNG MINH
        // ==========================================
        function handleDatePaste(e) {
            const pasteData = (e.clipboardData || window.clipboardData).getData('text').trim();
            if (!pasteData) return;
            
            // Hỗ trợ định dạng phổ biến ở VN: dd/mm/yyyy hoặc dd-mm-yyyy hoặc dd.mm.yyyy
            const vnDateRegex = /^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/;
            const vnMatch = pasteData.match(vnDateRegex);
            
            if (vnMatch) {
                e.preventDefault();
                const day = vnMatch[1].padStart(2, '0');
                const month = vnMatch[2].padStart(2, '0');
                const year = vnMatch[3];
                e.target.value = `${year}-${month}-${day}`;
                return;
            }

            // Hỗ trợ định dạng ISO: yyyy-mm-dd hoặc yyyy/mm/dd
            const isoRegex = /^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})$/;
            const isoMatch = pasteData.match(isoRegex);
            if (isoMatch) {
                e.preventDefault();
                const year = isoMatch[1];
                const month = isoMatch[2].padStart(2, '0');
                const day = isoMatch[3].padStart(2, '0');
                e.target.value = `${year}-${month}-${day}`;
            }
        }

        document.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    const blob = item.getAsFile();
                    handleImageSelection(blob);
                }
            }
        });

        function handleImageSelection(file) {
            selectedImageFile = file;
            existingImageUrl = null; // Ghi đè ảnh cũ nếu có
            const reader = new FileReader();
            reader.onload = (e) => {
                showImagePreview(e.target.result);
            };
            reader.readAsDataURL(file);
        }

        function showImagePreview(src) {
            imagePreview.src = src;

            imagePlaceholder.classList.add('hidden');
        }

        async function uploadToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', 'thongtincanhan'); 
            
            try {
                // Cloud name của bạn: damxt8noh
                const response = await fetch('https://api.cloudinary.com/v1_1/damxt8noh/image/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                return data.secure_url;

                console.error("Lỗi khi tải ảnh lên Cloudinary:", error);
                throw error;

                            badgeData = typeBadge + schoolYearBadge + dateReceivedBadge;
                        }

                        openModal(noteToView, date.toLocaleDateString('vi-VN') + ' • ' + date.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'}), badgeData);
                    }
                });
            });

            document.querySelectorAll('.pin-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const isPinned = e.currentTarget.getAttribute('data-pinned') === 'true';
                    const svg = e.currentTarget.querySelector('svg');
                    svg.classList.add('scale-125');
                    setTimeout(() => svg.classList.remove('scale-125'), 200);
                    await updateDoc(doc(db, 'thongtin', e.currentTarget.getAttribute('data-id')), { pinned: !isPinned });
                });
            });

            document.querySelectorAll('.like-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const svg = e.currentTarget.querySelector('svg');
                    svg.classList.add('scale-150', 'fill-current');
                    setTimeout(() => svg.classList.remove('scale-150'), 200);
                    await updateDoc(doc(db, 'thongtin', e.currentTarget.getAttribute('data-id')), { likes: increment(1) });
                });
            });

            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const noteToEdit = allData.find(item => item.id === e.currentTarget.getAttribute('data-id'));
                    if (noteToEdit) {
                        editingId = noteToEdit.id; 
                        
                        const typeVal = noteToEdit.type || 'info';
                        document.querySelector(`input[name="note-type"][value="${typeVal}"]`).checked = true;
                        toggleSpecificFields(typeVal);

                        titleInput.value = noteToEdit.title || '';
                        contentInput.value = noteToEdit.text || '';
                        
                        // Load common info fields
                        schoolYearInput.value = noteToEdit.schoolYear || '';
                        dateReceivedInput.value = noteToEdit.dateReceived || '';

                        // Load salary specific fields
                        heSoInput.value = noteToEdit.heSo || '';
                        bacInput.value = noteToEdit.bac || '';
                        ngayHuongInput.value = noteToEdit.ngayHuong || '';
                        lanNangSauInput.value = noteToEdit.lanNangSau || '';

                        // Load document specific fields
                        documentDateInput.value = noteToEdit.documentDate || '';

                        // Hiển thị ảnh cũ nếu có
                        if (noteToEdit.imageUrl) {
                            existingImageUrl = noteToEdit.imageUrl;
                            showImagePreview(noteToEdit.imageUrl);
                        } else {
                            clearImagePreview();
                        }

                        submitBtn.innerHTML = 'Cập nhật <span>🔄</span>';
                        cancelEditBtn.classList.remove('hidden');
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                        titleInput.focus();
                    }
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    if (confirm("Bạn có chắc chắn muốn xóa dữ liệu này không?")) {
                        await deleteDoc(doc(db, 'thongtin', e.currentTarget.getAttribute('data-id'))); 
                        showToast("🗑️ Đã xóa thành công!");
                    }
                });
            });

            // Lắng nghe sự kiện click mở ảnh phóng to
            document.querySelectorAll('.image-lightbox-trigger').forEach(el => {
                el.addEventListener('click', (e) => {
                    openLightbox(e.currentTarget.getAttribute('data-src'));
                });
            });
        }

        function initFirebaseData() {
            const q = query(notesCollection, orderBy('createdAt', 'desc'));
            onSnapshot(q, (snapshot) => {
                allData = [];
                snapshot.forEach((docSnap) => allData.push({ id: docSnap.id, ...docSnap.data() }));
                renderCards(); 
            }, (error) => {
                cardsContainer.innerHTML = '<div class="col-span-full text-center text-red-500 mt-10">❌ Lỗi kết nối Firestore.</div>';
            });
        }

        // Khởi tạo dữ liệu ngay khi tải trang
        initFirebaseData();

        cancelEditBtn.addEventListener('click', () => {
            editingId = null;
            form.reset();
            clearImagePreview();
            document.querySelector('input[name="note-type"][value="info"]').checked = true;
            toggleSpecificFields('info');
            submitBtn.innerHTML = 'Lưu Thông Tin <span>💾</span>';
            cancelEditBtn.classList.add('hidden');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const titleVal = titleInput.value.trim();
            const contentVal = contentInput.value.trim();
            const typeVal = document.querySelector('input[name="note-type"]:checked').value;
            
            if (!titleVal || !contentVal) return;

            const originalContent = submitBtn.innerHTML;
            submitBtn.innerHTML = editingId ? 'Đang cập nhật... ⏳' : 'Đang xử lý ảnh & lưu... ⏳';
            submitBtn.disabled = true;

            try {
                let finalImageUrl = existingImageUrl;

                // Nếu có chọn ảnh mới, thực hiện upload lên Cloudinary
                if (selectedImageFile) {
                    finalImageUrl = await uploadToCloudinary(selectedImageFile);
                }

                const docData = {
                    title: titleVal, 
                    text: contentVal, 
                    type: typeVal,
                    imageUrl: finalImageUrl,
                };

                // Lưu các trường đặc thù tùy loại
                if (typeVal === 'salary') {
                    docData.heSo = heSoInput.value.trim();
                    docData.bac = bacInput.value.trim();
                    docData.ngayHuong = ngayHuongInput.value;
                    docData.lanNangSau = lanNangSauInput.value;
                    docData.schoolYear = ''; // Xóa dữ liệu chéo nếu có
                    docData.dateReceived = '';
                    docData.documentDate = '';
                } else if (typeVal === 'document') {
                    docData.documentDate = documentDateInput.value;
                    docData.schoolYear = '';
                    docData.dateReceived = '';
                    docData.heSo = '';
                    docData.bac = '';
                    docData.ngayHuong = '';
                    docData.lanNangSau = '';
                } else {
                    docData.schoolYear = schoolYearInput.value.trim();
                    docData.dateReceived = dateReceivedInput.value;
                    docData.heSo = '';
                    docData.bac = '';
                    docData.ngayHuong = '';
                    docData.lanNangSau = '';
                    docData.documentDate = '';
                }

                if (editingId) {
                    await updateDoc(doc(db, 'thongtin', editingId), docData);
                    showToast("🎉 Đã cập nhật thành công!");
                    cancelEditBtn.click(); 
                } else {
                    docData.createdAt = serverTimestamp();
                    docData.likes = 0;
                    docData.pinned = false;
                    await addDoc(notesCollection, docData);
                    showToast("🎉 Đã lưu thành công!");
                    
                    form.reset();
                    clearImagePreview();
                    document.querySelector('input[name="note-type"][value="info"]').checked = true;
                    toggleSpecificFields('info');
                }
            } catch (error) {
                console.error(error);
                alert("Đã xảy ra lỗi khi lưu thông tin. Vui lòng thử lại.");
            } finally {
                submitBtn.innerHTML = originalContent;
                submitBtn.disabled = false;
            }
        });

        function escapeHtml(unsafe) {
            return (unsafe || "").toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
