<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Tool AI</title>
    
    <!-- Tích hợp Tailwind CSS qua CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tích hợp Google Fonts: Quicksand (nội dung) & Pacifico (footer) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Font chữ tổng thể */
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f0fdfa; /* Màu nền teal nhạt */
            background-image: radial-gradient(#ccfbf1 1px, transparent 1px); /* Họa tiết chấm bi màu teal */
            background-size: 20px 20px; /* Họa tiết chấm bi mờ tạo sự vui tươi */
        }
        
        /* Font chữ viết tay cho Footer */
        .font-handwriting {
            font-family: 'Pacifico', cursive;
        }

        /* Hiệu ứng mượt mà cho Toast Notification */
        #toast {
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        /* Animation cho trái tim bay lên khi nhấn Like */
        @keyframes floatHeart {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-30px) scale(1.5); opacity: 0; }
        }
        .animate-float-heart {
            animation: floatHeart 0.8s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 sm:p-8 text-gray-800">

    <!-- Thông báo nổi (Toast) -->
    <div id="toast" class="fixed top-6 right-6 bg-emerald-500 text-white px-6 py-3 rounded-2xl shadow-lg opacity-0 transform translate-y-[-20px] pointer-events-none z-50 flex items-center gap-2 font-semibold">
        <span id="toast-icon">🎉</span> <span id="toast-msg">Thêm tool thành công!</span>
    </div>

    <!-- Container chính -->
    <div class="w-full max-w-6xl flex-grow flex flex-col items-center">
        
        <!-- Tiêu đề -->
        <h1 class="text-4xl sm:text-5xl font-bold text-center text-gray-800 mb-10 mt-6 tracking-tight drop-shadow-sm">
            📚 Kho Tool AI
        </h1>

        <!-- Form nhập liệu -->
        <div class="bg-white rounded-3xl shadow-lg p-6 sm:p-8 mb-12 w-full max-w-3xl mx-auto border-2 border-teal-50 relative overflow-hidden">
            <!-- Decal trang trí form -->
            <div class="absolute -top-10 -right-10 text-9xl opacity-5 pointer-events-none">✨</div>
            
            <form id="add-tool-form" class="flex flex-col gap-4 relative z-10">
                <label id="form-title" class="text-gray-700 font-bold text-lg flex items-center gap-2">
                    💡 Chia sẻ tool AI mới:
                </label>
                <textarea 
                    id="tool-desc" 
                    rows="2" 
                    class="w-full rounded-2xl border-2 border-gray-200 p-4 focus:outline-none focus:border-teal-400 focus:ring-4 focus:ring-teal-100 transition-all text-gray-700 resize-none text-lg font-medium bg-gray-50 focus:bg-white" 
                    placeholder="Mô tả (Ví dụ: ChatGPT - Tạo đề Toán nhanh...)"
                    required
                ></textarea>
                <input 
                    type="url"
                    id="tool-url" 
                    class="w-full rounded-2xl border-2 border-gray-200 p-4 focus:outline-none focus:border-teal-400 focus:ring-4 focus:ring-teal-100 transition-all text-gray-700 text-lg font-medium bg-gray-50 focus:bg-white" 
                    placeholder="Đường dẫn URL"
                    value="https://thaycuongtoanc2.byethost14.com/"
                    required
                />
                
                <div class="flex flex-col sm:flex-row justify-end gap-3 mt-2">
                    <button 
                        type="button" 
                        id="cancel-edit-btn"
                        class="hidden bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-700 font-bold py-3 px-6 rounded-2xl transition-all shadow-sm hover:shadow-md text-lg w-full sm:w-auto flex items-center justify-center gap-2"
                    >
                        Hủy
                    </button>
                    <button 
                        type="submit" 
                        id="submit-btn"
                        class="bg-teal-500 hover:bg-teal-600 active:bg-teal-700 text-white font-bold py-3 px-8 rounded-2xl transition-all shadow-md hover:shadow-lg text-lg w-full sm:w-auto flex items-center justify-center gap-2 hover:-translate-y-1"
                    >
                        <span>Gửi Lên Kho</span>
                        <span class="text-xl text-yellow-300">🚀</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Thanh tìm kiếm thông minh -->
        <div class="w-full max-w-3xl mx-auto mb-10 relative group">
            <div class="absolute inset-y-0 left-0 pl-6 flex items-center pointer-events-none">
                <span class="text-2xl drop-shadow-sm transform group-focus-within:scale-110 group-focus-within:rotate-12 transition-all duration-300">🔍</span>
            </div>
            <input 
                type="text" 
                id="search-input" 
                class="w-full pl-16 pr-20 py-4 rounded-full border-4 border-teal-50 focus:outline-none focus:border-teal-300 focus:ring-4 focus:ring-teal-100 transition-all text-gray-700 text-lg font-bold bg-white shadow-sm hover:shadow-md" 
                placeholder="Tìm kiếm tool AI (tên, chức năng...)"
            >
            <div class="absolute inset-y-0 right-0 pr-6 flex items-center pointer-events-none">
                <span class="text-xs font-bold text-gray-400 bg-gray-100 px-2 py-1 rounded-lg border border-gray-200 shadow-sm hidden sm:block">Ctrl K</span>
            </div>
        </div>

        <!-- Trạng thái Loading đang lấy dữ liệu -->
        <div id="loading" class="text-center text-gray-500 my-10 flex flex-col items-center gap-3">
            <svg class="animate-spin h-10 w-10 text-teal-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="font-medium animate-pulse">Đang tải các Tool AI siêu xịn...</p>
        </div>

        <!-- Lưới hiển thị Card Tools -->
        <div id="tools-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 w-full">
            <!-- Nội dung các thẻ sẽ được render bằng JS vào đây -->
        </div>
        
    </div>

    <!-- Footer Bản quyền -->
    <footer class="mt-16 text-center w-full pb-8">
        <p class="font-handwriting text-2xl text-gray-600 hover:text-teal-500 transition-colors cursor-default">
            © 2026 Designed with 😍 Thầy Cường dạy Toán
        </p>
    </footer>

    <!-- ===== FIREBASE & LOGIC JAVASCRIPT ===== -->
    <script type="module">
        // 1. Import các module cần thiết từ Firebase Web SDK v9
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            onSnapshot, 
            serverTimestamp, 
            doc, 
            updateDoc, 
            deleteDoc,
            increment 
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 2. Cấu hình Firebase theo yêu cầu
        const firebaseConfig = {
            apiKey: "AIzaSyC-8kCyIv8n7jB-GiKXGeWllpXtoBNPKzA",
            authDomain: "cuongcsdl.firebaseapp.com",
            databaseURL: "https://cuongcsdl-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "cuongcsdl",
            storageBucket: "cuongcsdl.firebasestorage.app",
            messagingSenderId: "510371041821",
            appId: "1:510371041821:web:b37e8534f4f1132df62cf4"
        };

        // Khởi tạo App và kết nối tới Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Danh sách các màu Pastel ngẫu nhiên cho Card
        const pastelColors = [
            'bg-red-100', 'bg-orange-100', 'bg-amber-100', 'bg-yellow-100', 
            'bg-lime-100', 'bg-green-100', 'bg-emerald-100', 'bg-teal-100', 
            'bg-cyan-100', 'bg-sky-100', 'bg-blue-100', 'bg-indigo-100', 
            'bg-violet-100', 'bg-purple-100', 'bg-fuchsia-100', 'bg-pink-100', 'bg-rose-100'
        ];

        // Danh sách Emoji ngẫu nhiên cho Card
        const randomEmojis = ['🤖', '✨', '🔥', '🚀', '💡', '🧠', '🎨', '📝', '⚡️', '🌟', '🛠️', '🎓', '🔮', '🪄', '💻', '🧩', '🎯'];

        // Lấy các element từ giao diện
        const form = document.getElementById('add-tool-form');
        const descInput = document.getElementById('tool-desc');
        const urlInput = document.getElementById('tool-url');
        const grid = document.getElementById('tools-grid');
        
        const toast = document.getElementById('toast');
        const toastIcon = document.getElementById('toast-icon');
        const toastMsg = document.getElementById('toast-msg');
        
        const loading = document.getElementById('loading');
        const searchInput = document.getElementById('search-input');
        
        const cancelEditBtn = document.getElementById('cancel-edit-btn');
        const submitBtn = document.getElementById('submit-btn');
        const formTitle = document.getElementById('form-title');

        let globalToolsList = []; // Biến toàn cục lưu danh sách tool
        let currentEditId = null; // Cờ lưu ID của tool đang được chỉnh sửa

        // Hàm loại bỏ dấu tiếng Việt để tìm kiếm thông minh hơn
        function removeAccents(str) {
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
        }

        // Hàm Reset Form về trạng thái Thêm mới
        function resetFormState() {
            currentEditId = null;
            descInput.value = '';
            urlInput.value = 'https://cuongdaytoan.byethost3.com/';
            
            formTitle.innerHTML = '💡 Chia sẻ tool AI mới:';
            submitBtn.innerHTML = '<span>Gửi Lên Kho</span><span class="text-xl text-yellow-300">🚀</span>';
            
            // Đổi lại màu nút về màu Teal mặc định
            submitBtn.classList.replace('bg-blue-500', 'bg-teal-500');
            submitBtn.classList.replace('hover:bg-blue-600', 'hover:bg-teal-600');
            submitBtn.classList.replace('active:bg-blue-700', 'active:bg-teal-700');
            
            cancelEditBtn.classList.add('hidden'); // Ẩn nút Hủy
        }

        // Sự kiện nút Hủy chỉnh sửa
        cancelEditBtn.addEventListener('click', () => {
            resetFormState();
        });

        // Hàm hiển thị thông báo thành công (Customizable)
        function showToast(message = "Thành công!", icon = "🎉", bgColor = "bg-emerald-500") {
            toastMsg.innerText = message;
            toastIcon.innerText = icon;
            
            // Xóa màu cũ, thêm màu mới
            toast.className = `fixed top-6 right-6 ${bgColor} text-white px-6 py-3 rounded-2xl shadow-lg opacity-0 transform translate-y-[-20px] pointer-events-none z-50 flex items-center gap-2 font-semibold`;
            
            // Ép trình duyệt render lại CSS
            void toast.offsetWidth; 

            toast.style.opacity = '1';
            toast.style.transform = 'translateY(0)';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-20px)';
            }, 3000);
        }

        // Hàm Render giao diện & Highlight kết quả
        function renderTools(toolsList, searchTerm = '') {
            grid.innerHTML = '';
            const normalizedSearch = removeAccents(searchTerm.toLowerCase()).trim();
            
            // Khởi tạo Regex để highlight
            let highlightRegex = null;
            if (normalizedSearch) {
                const vnMap = {
                    'a': '[aAáÁàÀảẢãÃạẠăĂắẮằẰẳẲẵẴặẶâÂấẤầẦẩẨẫẪậẬ]',
                    'd': '[dDđĐ]',
                    'e': '[eEéÉèÈẻẺẽẼẹẸêÊếẾềỀểỂễỄệỆ]',
                    'i': '[iIíÍìÌỉỈĩĨịỊ]',
                    'o': '[oOóÓòÒỏỎõÕọỌôÔốỐồỒổỔỗỖộỘơƠớỚờỜởỞỡỠợỢ]',
                    'u': '[uUúÚùÙủỦũŨụỤưƯứỨừỪửỬữỮựỰ]',
                    'y': '[yYýÝỳỲỷỶỹỸỵỴ]'
                };
                let pattern = normalizedSearch.split('').map(char => {
                    return vnMap[char] || char.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                }).join('');
                highlightRegex = new RegExp(`(${pattern})`, 'gi');
            }

            function highlightText(text) {
                if (!highlightRegex) return text;
                return text.replace(highlightRegex, '<mark class="bg-yellow-300 text-gray-900 rounded-[4px] px-1 py-0.5 shadow-sm">$1</mark>');
            }

            toolsList.forEach((tool, index) => {
                // Tính toán số thứ tự (STT) cố định (Thẻ cũ nhất là #1)
                const absoluteStt = toolsList.length - index;
                
                const textStr = tool.text || '';
                const cardTextForSearch = removeAccents(textStr.toLowerCase());
                
                if (normalizedSearch && !cardTextForSearch.includes(normalizedSearch)) return;

                const isLink = !!tool.url;
                const card = document.createElement(isLink ? 'a' : 'div');
                
                if (isLink) {
                    let validUrl = tool.url.startsWith('http') ? tool.url : 'https://' + tool.url;
                    card.href = validUrl;
                    card.target = '_blank';
                    card.rel = 'noopener noreferrer';
                }

                const bgColor = tool.colorClass || 'bg-blue-100';
                card.className = `${bgColor} p-6 rounded-3xl shadow-sm hover:shadow-xl transform transition-all duration-300 hover:-translate-y-2 hover:scale-[1.02] flex flex-col justify-between border border-white border-opacity-40 relative group block ${isLink ? 'cursor-pointer' : ''}`;
                
                const displayEmoji = tool.emoji || randomEmojis[tool.id.charCodeAt(0) % randomEmojis.length];

                let formattedText = '';
                const separatorIndex = textStr.indexOf('-');
                
                if(separatorIndex !== -1 && separatorIndex < textStr.length - 1) {
                     let toolName = textStr.substring(0, separatorIndex).trim();
                     let toolDesc = textStr.substring(separatorIndex + 1).trim();
                     
                     toolName = highlightText(toolName);
                     toolDesc = highlightText(toolDesc);

                     formattedText = `
                        <h3 class="font-bold text-xl mb-2 text-gray-900 group-hover:text-teal-700 transition-colors flex items-start">
                            <span class="text-3xl inline-block mr-2 transform group-hover:scale-125 transition-transform duration-300">${displayEmoji}</span>
                            <span class="mt-1">${toolName}</span>
                        </h3>
                        <p class="text-gray-800 leading-relaxed font-medium">${toolDesc}</p>
                     `;
                } else {
                     let fullText = highlightText(textStr);
                     formattedText = `
                        <p class="text-gray-900 leading-relaxed font-semibold text-lg flex items-start">
                            <span class="text-3xl inline-block mr-2 transform group-hover:scale-125 transition-transform duration-300">${displayEmoji}</span>
                            <span class="mt-1">${fullText}</span>
                        </p>
                     `;
                }

                const dateString = tool.createdAt 
                    ? new Date(tool.createdAt.toDate()).toLocaleDateString('vi-VN') 
                    : 'Mới đây';

                card.innerHTML = `
                    <!-- Số thứ tự (STT) dán ở góc trái trên -->
                    <div class="absolute top-0 left-0 z-20">
                        <span class="bg-teal-500/20 text-teal-900 font-black px-4 py-1.5 rounded-br-2xl rounded-tl-3xl text-sm backdrop-blur-sm inline-block shadow-sm">
                            #${absoluteStt}
                        </span>
                    </div>

                    <div class="mb-6 z-10 relative flex-grow pt-4">
                        ${formattedText}
                    </div>
                    
                    <div class="flex justify-between items-end border-t border-black border-opacity-5 pt-4 mt-auto z-10 relative">
                        <div class="flex flex-col gap-3">
                            <span class="text-sm font-semibold text-gray-500 opacity-80 flex items-center gap-1">
                                🕒 ${dateString}
                            </span>
                            
                            <!-- Các nút chức năng (Sửa / Xóa) dời xuống dưới -->
                            <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                                <button class="edit-btn bg-white hover:bg-blue-50 text-blue-500 w-9 h-9 rounded-full shadow-sm hover:shadow flex items-center justify-center transition-all transform hover:scale-110 border border-blue-50" data-id="${tool.id}" title="Chỉnh sửa">
                                    ✏️
                                </button>
                                <button class="delete-btn bg-white hover:bg-red-50 text-red-500 w-9 h-9 rounded-full shadow-sm hover:shadow flex items-center justify-center transition-all transform hover:scale-110 border border-red-50" data-id="${tool.id}" title="Xóa">
                                    🗑️
                                </button>
                            </div>
                        </div>
                        
                        <!-- Nút Like ❤️ -->
                        <button 
                            class="like-btn relative flex items-center gap-2 bg-white bg-opacity-70 hover:bg-opacity-100 text-red-500 px-4 py-2 rounded-2xl transition-all shadow-sm hover:shadow-md active:scale-95 border border-white mb-1 h-fit"
                            data-id="${tool.id}"
                        >
                            <span class="text-xl">❤️</span> 
                            <span class="font-bold text-gray-800 text-lg">${tool.likes || 0}</span>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });

            // GÁN SỰ KIỆN CHO NÚT LIKE
            const likeBtns = document.querySelectorAll('.like-btn');
            likeBtns.forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.preventDefault();  
                    e.stopPropagation(); 

                    const btnElement = e.currentTarget;
                    const docId = btnElement.getAttribute('data-id');
                    const docRef = doc(db, "aiTools", docId);
                    
                    try {
                        const floatingHeart = document.createElement('span');
                        floatingHeart.innerText = '❤️';
                        floatingHeart.className = 'absolute top-0 left-4 text-2xl pointer-events-none animate-float-heart';
                        btnElement.appendChild(floatingHeart);
                        
                        setTimeout(() => floatingHeart.remove(), 800);

                        await updateDoc(docRef, { likes: increment(1) });
                    } catch (error) {
                        console.error("Lỗi khi thả tim:", error);
                    }
                });
            });

            // GÁN SỰ KIỆN CHO NÚT XÓA
            const deleteBtns = document.querySelectorAll('.delete-btn');
            deleteBtns.forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.preventDefault();
                    e.stopPropagation();

                    const docId = btn.getAttribute('data-id');
                    if (confirm('⚠️ Bạn có chắc chắn muốn xóa tool này khỏi kho không?')) {
                        try {
                            await deleteDoc(doc(db, "aiTools", docId));
                            showToast('Đã xóa tool', '🗑️', 'bg-red-500');
                        } catch (error) {
                            console.error("Lỗi khi xóa:", error);
                            alert("Không thể xóa. Vui lòng kiểm tra quyền truy cập.");
                        }
                    }
                });
            });

            // GÁN SỰ KIỆN CHO NÚT CHỈNH SỬA
            const editBtns = document.querySelectorAll('.edit-btn');
            editBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();

                    const docId = btn.getAttribute('data-id');
                    const toolData = globalToolsList.find(t => t.id === docId);
                    
                    if (toolData) {
                        // Đưa dữ liệu lên form
                        currentEditId = docId;
                        descInput.value = toolData.text || '';
                        urlInput.value = toolData.url || '';

                        // Thay đổi UI Form sang chế độ Edit
                        formTitle.innerHTML = '✏️ Chỉnh sửa tool AI:';
                        submitBtn.innerHTML = '<span>Cập nhật Tool</span><span class="text-xl">🔄</span>';
                        
                        // Đổi màu nút thành Xanh dương để phân biệt
                        submitBtn.classList.replace('bg-teal-500', 'bg-blue-500');
                        submitBtn.classList.replace('hover:bg-teal-600', 'hover:bg-blue-600');
                        submitBtn.classList.replace('active:bg-teal-700', 'active:bg-blue-700');
                        
                        cancelEditBtn.classList.remove('hidden'); // Hiện nút Hủy

                        // Cuộn màn hình lên form
                        document.getElementById('add-tool-form').scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                });
            });
        }

        // Lọc dữ liệu Real-time khi người dùng gõ phím
        searchInput.addEventListener('input', (e) => {
            renderTools(globalToolsList, e.target.value);
        });

        // Hỗ trợ phím tắt Ctrl + K
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                searchInput.focus();
            }
        });

        // 3. XỬ LÝ SỰ KIỆN: THÊM MỚI / CẬP NHẬT (SUBMIT FORM)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const textContent = descInput.value.trim();
            const urlContent = urlInput.value.trim();
            if (!textContent || !urlContent) return;

            // Hiệu ứng đang tải cho nút bấm
            const originalHTML = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span>Đang lưu...</span> ⏳';
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-70', 'cursor-not-allowed');

            try {
                if (currentEditId) {
                    // CẬP NHẬT DỮ LIỆU ĐÃ CÓ
                    const docRef = doc(db, "aiTools", currentEditId);
                    await updateDoc(docRef, {
                        text: textContent,
                        url: urlContent
                        // Các trường createdAt, likes, emoji, colorClass được giữ nguyên
                    });
                    
                    resetFormState();
                    showToast('Cập nhật tool thành công!', '🔄', 'bg-blue-500');
                } else {
                    // THÊM MỚI DỮ LIỆU
                    const randomColor = pastelColors[Math.floor(Math.random() * pastelColors.length)];
                    const randomEmoji = randomEmojis[Math.floor(Math.random() * randomEmojis.length)];

                    await addDoc(collection(db, "aiTools"), {
                        text: textContent,
                        url: urlContent,              
                        createdAt: serverTimestamp(), 
                        likes: 0,                     
                        colorClass: randomColor,      
                        emoji: randomEmoji            
                    });
                    
                    resetFormState();
                    showToast('Thêm tool thành công!', '🎉', 'bg-emerald-500');
                }
            } catch (error) {
                console.error("Lỗi khi gửi form:", error);
                alert("Xin lỗi, có lỗi xảy ra. Vui lòng kiểm tra kết nối mạng hoặc Database Rules.");
            } finally {
                // Phục hồi lại nút bấm
                submitBtn.innerHTML = originalHTML;
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
            }
        });

        // 4. XỬ LÝ LẮNG NGHE & HIỂN THỊ DỮ LIỆU REAL-TIME
        onSnapshot(collection(db, "aiTools"), (snapshot) => {
            loading.style.display = 'none';
            
            globalToolsList = [];
            snapshot.forEach((doc) => {
                globalToolsList.push({ id: doc.id, ...doc.data() });
            });

            globalToolsList.sort((a, b) => {
                const timeA = a.createdAt ? a.createdAt.toMillis() : Date.now() + 1000;
                const timeB = b.createdAt ? b.createdAt.toMillis() : Date.now() + 1000;
                return timeB - timeA;
            });

            renderTools(globalToolsList, searchInput.value);

        }, (error) => {
            console.error("Lỗi lắng nghe Firebase:", error);
            loading.innerHTML = '<p class="text-red-500 font-bold bg-red-100 px-6 py-3 rounded-xl shadow-sm">⚠️ Không thể kết nối Dữ liệu. Vui lòng kiểm tra quyền Firestore Rules (yêu cầu quyền read/write).</p>';
        });
    </script>
</body>
</html>
