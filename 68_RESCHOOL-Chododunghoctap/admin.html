<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReSchool – Cổng Quản trị Nội bộ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Firebase SDK 8.10.1 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <style>
  :root{--g:#2E7D32;--g2:#1B5E20;--gl:#E8F5E9;--cream:#FFF8E7;--cream2:#FDF0CF;--or:#F57C00;--or2:#E65100;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--rd:#c62828;--bl:#1565c0;--w:#fff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:#F8FAF8;color:var(--tx);font-size:14.5px;line-height:1.5}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.25;color:var(--g2)}
h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
a{color:var(--g)}
p{margin:.4em 0}
.hide{display:none!important}
.center{text-align:center}.pad{padding:28px 16px}
.mu{color:var(--mu)}.sm{font-size:.85rem}.b{font-weight:700}
.wrap{max-width:1060px;margin:0 auto;padding:14px 16px}
#banner .demo{background:var(--or);color:#fff;text-align:center;padding:7px 10px;font-weight:600;font-size:.85rem;letter-spacing:0.01em}
#banner .that{background:var(--g2);color:#fff;text-align:center;padding:6px 10px;font-size:.82rem;font-weight:500}
#hdr{background:linear-gradient(135deg,#1b5e20 0%,#2e7d32 100%);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#hdr .in{max-width:1060px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px}
#hdr .brand{cursor:pointer}
#hdr .brand b{font-size:1.15rem;display:block;font-weight:700}
#hdr .brand span{font-size:.72rem;opacity:.9}
.badge-role{font-size:.68rem;font-weight:700;background:rgba(255,255,255,.22);color:#fff;padding:2px 8px;border-radius:12px;text-transform:uppercase;letter-spacing:.04em}
.hdr-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);color:#fff!important;border:1px solid rgba(255,255,255,.35);padding:6px 14px;border-radius:20px;font-size:.84rem;font-weight:600;text-decoration:none;transition:all .2s;white-space:nowrap}
.hdr-btn:hover{background:rgba(255,255,255,.28);border-color:#fff;transform:translateY(-1px)}
.btn{border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--g);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:38px;transition:background .15s}
.btn:hover{background:var(--g2)}
.btn.or{background:var(--or)}.btn.or:hover{background:var(--or2)}
.btn.out{background:#fff;color:var(--g);border:1.5px solid var(--g)}
.btn.out:hover{background:var(--gl)}
.btn.red{background:var(--rd)}
.btn.gray{background:#8a928a}
.btn.sm{padding:5px 10px;min-height:30px;font-size:.82rem}
.btn:disabled{opacity:.55;cursor:not-allowed}
.cartb{background:#fff;color:var(--g);border-radius:20px;padding:6px 12px;font-weight:700;cursor:pointer;border:0;font:inherit;font-weight:700}
.cartb i{background:var(--or);color:#fff;border-radius:10px;padding:0 7px;font-style:normal;margin-left:4px}
#nav{background:var(--g2);overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
#nav a{display:inline-block;color:#dff2e0;padding:10px 14px;font-weight:500;cursor:pointer;text-decoration:none;font-size:.92rem;border-bottom:3px solid transparent}
#nav a.on{color:#fff;border-color:var(--or);font-weight:700}
.hero{background:linear-gradient(135deg,var(--g) 0%,#66BB6A 100%);color:#fff;border-radius:16px;padding:24px 18px;margin:12px 0}
.hero h1{color:#fff;font-size:1.7rem}
.hero .sl{font-size:1.05rem;opacity:.95;font-style:italic}
.row{display:flex;flex-wrap:wrap;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:var(--w);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card.cat{text-align:center;cursor:pointer;transition:.15s}
.card.cat:hover{transform:translateY(-2px);border-color:var(--g)}
.card.cat .ic{font-size:2.2rem}
.pc{padding:0;overflow:hidden;cursor:pointer;position:relative}
.pc .im{height:120px;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:2.8rem;position:relative}
.pc .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc .bd{padding:10px}
.pc .nm{font-weight:600;font-size:.92rem;min-height:2.6em}
.price{color:var(--or2);font-weight:700;font-size:1.05rem}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:10px;background:var(--gl);color:var(--g2);font-weight:600;margin:1px 2px 1px 0}
.tag.or{background:#FFE0B2;color:#8a4b00}.tag.rd{background:#FFCDD2;color:#8e1a1a}.tag.bl{background:#BBDEFB;color:#0d47a1}.tag.gr{background:#e0e0e0;color:#444}
.demo-tag{position:absolute;top:6px;left:6px;background:var(--or);color:#fff;font-size:.65rem;padding:2px 6px;border-radius:8px;font-weight:700;z-index:2}
.steps{counter-reset:s;display:grid;gap:8px}
.step{background:#fff;border-left:5px solid var(--or);padding:10px 12px;border-radius:10px;border:1px solid var(--bd);border-left:5px solid var(--or)}
.step:before{counter-increment:s;content:counter(s);background:var(--or);color:#fff;border-radius:50%;display:inline-block;width:24px;height:24px;text-align:center;margin-right:8px;font-weight:700}
.stat{text-align:center;padding:16px 10px;transition:transform .15s,box-shadow .15s}
.stat:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.06);border-color:var(--g)}
.stat .n{font-size:1.7rem;font-weight:700;color:var(--g)}
label{display:block;font-weight:600;margin:10px 0 3px;font-size:.9rem}
input,select,textarea{width:100%;font:inherit;padding:9px 12px;border:1.5px solid var(--bd);border-radius:10px;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g)}
input[type=checkbox],input[type=radio]{width:auto;margin-right:6px}
.chk{display:flex;align-items:flex-start;gap:6px;font-weight:500;margin:8px 0}
.chk input{margin-top:4px}
textarea{min-height:80px;resize:vertical}
.alert{padding:10px 14px;border-radius:10px;margin:10px 0;font-size:.88rem;line-height:1.45}
.alert.or{background:#FFF3E0;border:1px solid #FFB74D;color:#7a4300}
.alert.rd{background:#FFEBEE;border:1px solid #EF9A9A;color:#8e1a1a}
.alert.gr{background:var(--gl);border:1px solid #A5D6A7;color:var(--g2)}
.alert.bl{background:#E3F2FD;border:1px solid #90CAF9;color:#0d47a1}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.spin.big{width:34px;height:34px;border:4px solid var(--gl);border-top-color:var(--g)}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--mu);padding:36px 16px;background:#fff;border:2px dashed #cbd5e1;border-radius:14px;margin:12px 0}
#toasts{position:fixed;left:0;right:0;bottom:14px;z-index:99;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:#333;color:#fff;padding:10px 16px;border-radius:10px;max-width:92vw;box-shadow:0 4px 12px rgba(0,0,0,.3);pointer-events:auto}
.toast.ok{background:var(--g2)}.toast.err{background:var(--rd)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:12px}
.modal .box{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:16px;margin:auto;position:relative}
.modal .x{position:absolute;right:10px;top:8px;background:none;border:0;font-size:1.6rem;cursor:pointer;color:var(--mu)}
.qr{display:inline-block;padding:8px;background:#fff;border:1px solid var(--bd);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{border-bottom:1px solid var(--bd);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--mu);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.02em}

/* Menu điều hướng chính quản trị */
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:#fff;border-radius:12px;border:1px solid var(--bd);box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:14px}
.tabs button{border:0;background:transparent;color:#475569;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:all .15s ease}
.tabs button:hover{background:#f1f5f9;color:var(--g2)}
.tabs button.on{background:var(--g);color:#fff;box-shadow:0 2px 5px rgba(46,125,50,.28)}

/* Bộ lọc phân loại trạng thái */
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips button{border:1px solid #cbd5e1;background:#fff;color:#475569;border-radius:20px;padding:5px 12px;font:inherit;font-size:.82rem;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .15s ease}
.chips button:hover{background:#f8fafc;border-color:#94a3b8}
.chips button.on{background:#e8f5e9;border-color:var(--g);color:var(--g2);font-weight:700;box-shadow:0 1px 3px rgba(46,125,50,.15)}

.item{border:1px solid var(--bd);background:#fff;border-radius:12px;padding:12px 14px;margin:8px 0;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:box-shadow .15s,border-color .15s}
.item:hover{box-shadow:0 3px 8px rgba(0,0,0,.06);border-color:#cbd5e1}
.item .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start}
.kv{display:grid;grid-template-columns:130px 1fr;gap:2px 8px;font-size:.88rem}
.kv span:nth-child(odd){color:var(--mu)}
.fl{display:flex;gap:8px;flex-wrap:wrap}.fl>*{flex:1;min-width:130px}
#ftr{text-align:center;color:var(--mu);font-size:.78rem;padding:18px 10px 40px}
#print-area{display:none}
@media print{
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important;font-family:'Times New Roman',serif;color:#000;background:#fff;padding:10mm}
  #print-area h2{color:#000;text-align:center}
  #print-area table td,#print-area table th{border:1px solid #000;padding:5px}
  .sig{display:flex;justify-content:space-around;margin-top:40px;text-align:center}
}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.pc .im{height:150px}h1{font-size:2rem}.hero h1{font-size:2.2rem}}
    .login-box{max-width:440px;margin:60px auto;background:#fff;border-radius:18px;padding:32px 24px;box-shadow:0 10px 30px rgba(0,0,0,.08);text-align:center;border:1px solid var(--bd)}
    .login-logo{font-size:3rem;margin-bottom:10px}
    .login-box h2{color:var(--g2);margin-bottom:8px}
    .login-box p{color:var(--mu);font-size:.92rem;margin-bottom:24px}
    .google-btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;background:#fff;color:#444;border:1.5px solid #ddd;border-radius:12px;padding:12px 24px;font-size:1rem;font-weight:600;cursor:pointer;width:100%;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.05)}
    .google-btn:hover{background:#f8f9fa;border-color:#ccc;box-shadow:0 4px 10px rgba(0,0,0,.1)}
    .google-btn svg{width:22px;height:22px}
    .user-badge{display:inline-flex;align-items:center;gap:10px;padding:4px 10px 4px 6px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.2);border-radius:24px;color:#fff}
    .user-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(255,255,255,.85)}
    .user-avatar-initial{width:32px;height:32px;border-radius:50%;background:#43a047;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.88rem;border:1.5px solid rgba(255,255,255,.85)}
    .user-meta{display:flex;flex-direction:column;text-align:left;line-height:1.2}
    .user-name{font-weight:600;font-size:.84rem;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .user-role{font-size:.7rem;opacity:.85;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .logout-btn{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:14px;padding:5px 10px;cursor:pointer;font-weight:600;font-size:.78rem;transition:background .2s;white-space:nowrap}
    .logout-btn:hover{background:#d32f2f}

    /* Thanh điều khiển trên cùng của trang quản trị */
    .admin-toolbar{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px 18px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
    .toolbar-title h2{margin:0;font-size:1.2rem;color:var(--g2);display:flex;align-items:center;gap:8px}
    .toolbar-desc{font-size:.82rem;color:var(--mu);margin-top:2px}
    .toolbar-filter{display:flex;align-items:center;gap:8px}
    .toolbar-filter label{margin:0;font-size:.85rem;color:var(--mu);font-weight:600;white-space:nowrap}
    .filter-select{padding:6px 12px;border-radius:18px;border:1.5px solid var(--bd);background:#fff;font-size:.85rem;font-weight:500;color:var(--tx);outline:none;cursor:pointer}
    .filter-select:focus{border-color:var(--g)}
  </style>
</head>
<body>
  <div id="banner"></div>
  <header id="hdr"></header>
  <nav id="nav" class="hide"></nav>
  <main id="app"><div class="center pad"><span class="spin big"></span><p>Đang kiểm tra đăng nhập...</p></div></main>
  <div id="modal" class="modal hide"></div>
  <div id="toasts"></div>
  <div id="print-area"></div>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    // ==================== CẤU HÌNH HỆ THỐNG ====================
    window.GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzzZVNJPaM_SMjEh5eyO7otcOMuFZkCzwIGx_MzAFvnoFG23H4j_yk9A2Dd_qQSGVVl/exec';
    const firebaseConfig = {
      apiKey: 'AIzaSyBVueYYokJdqm_uCMqBL24d6YCtMTamCM8',
      authDomain: 'csdlsongminh.firebaseapp.com',
      databaseURL: 'https://csdlsongminh-default-rtdb.asia-southeast1.firebasedatabase.app',
      projectId: 'csdlsongminh',
      storageBucket: 'csdlsongminh.firebasestorage.app',
      messagingSenderId: '319501136448',
      appId: '1:319501136448:web:1c2a9a1b5582d3a9f725a5',
      measurementId: 'G-VPPH1RXD7H'
    };
    const ADMIN_EMAIL = 'songminh138@gmail.com';
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    let currentUser = null;

    // Hằng số nghiệp vụ
    const TT_SP={CHO_TIEP_NHAN:'Chờ tiếp nhận',CHO_KIEM_TRA:'Chờ kiểm tra',KHONG_DAT:'Không đạt',CHO_DUYET_GIA:'Chờ duyệt giá',SAN_SANG:'Sẵn sàng đăng bán',GIU_CHO:'Giữ chỗ',DA_BAN:'Đã bán',TRA_LAI:'Trả lại',LOAI_BO:'Loại bỏ'};
    const TT_DON={CHO_XAC_NHAN:'Chờ xác nhận',DA_XAC_NHAN:'Đã xác nhận',CHO_NHAN:'Chờ nhận',HOAN_TAT:'Hoàn tất',HUY:'Hủy'};
    const TT_TT={CHUA_THU:'Chưa thu tiền',DA_THU:'Đã thu tiền'};
    const TT_KG={MOI:'Mới gửi',DA_TIEP_NHAN:'Đã tiếp nhận',DA_THOA_THUAN:'Đã thỏa thuận',TU_CHOI:'Từ chối',HET_HAN:'Hết hạn',KET_THUC:'Kết thúc'};
    const TT_YC={MOI:'Mới gửi (chưa tiếp nhận)',DA_TIEP_NHAN:'Đã tiếp nhận',TU_CHOI:'Từ chối'};
    const LOAI_TC={DOANH_THU_TANG:'Doanh thu hàng tặng',PHI_KY_GUI:'Phí ký gửi',THU_HO:'Tiền thu hộ (không phải doanh thu)',TRA_CHU_HANG:'Trả chủ hàng',CHI_PHI:'Chi phí',DIEU_CHINH:'Điều chỉnh',CHI_PHAN_BO:'Chi từ quỹ phân bổ'};
    const TT_TC={CHO_DUYET:'Chờ duyệt',DA_XAC_NHAN:'Đã xác nhận',TU_CHOI:'Từ chối'};
    const CHECK_LBL={ve_sinh:'Vệ sinh sạch sẽ',hu_hong:'Không hư hỏng nặng',an_toan:'An toàn khi sử dụng',noi_dung:'Nội dung phù hợp lứa tuổi',ban_quyen:'Không vi phạm bản quyền (không sao chép trái phép)'};
    const VAI_LBL={HOC_SINH:'Thành viên học sinh',GIAO_VIEN:'Giáo viên giám sát',QUAN_TRI:'Quản trị viên'};
    const S={cfg:null,sp:null,cart:[],view:'a_home',param:null,me:null,f:{},nhan:null,a:{cd:'',spf:'',donf:''},d:{}};
    const $=s=>document.querySelector(s);
    const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const vnd=n=>Number(n||0).toLocaleString('vi-VN')+' đ';
    const bo=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
    const dm=ma=>(S.cfg.danh_muc.find(x=>x.ma===ma)||{ten:ma,icon:'📦'});
    const isDemo=()=>S.cfg&&S.cfg.che_do!=='THAT';
    const fmtT=t=>String(t||'').replace('T',' ').slice(0,16);
    function toast(m,t){const d=document.createElement('div');d.className='toast '+(t||'');d.textContent=m;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),t==='err'?6000:3500)}
    async function busy(btn,fn){if(!btn||btn.disabled)return;const h=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span> Đang xử lý…';try{return await fn()}finally{btn.disabled=false;btn.innerHTML=h}}
    function openModal(title,html){const m=$('#modal');m.innerHTML='<div class="box"><button class="x" data-act="close" aria-label="Đóng">×</button><h2>'+esc(title)+'</h2>'+html+'</div>';m.classList.remove('hide')}
    function closeModal(){$('#modal').classList.add('hide');$('#modal').innerHTML=''}
    const loading=()=>'<div class="center pad"><span class="spin big"></span><p class="mu">Đang tải…</p></div>';
    const errBox=m=>'<div class="alert rd">⚠️ '+esc(m)+'</div>';
    function fd(form){const o={};form.querySelectorAll('[name]').forEach(e=>{if(e.type==='checkbox')o[e.name]=e.checked;else if(e.type==='radio'){if(e.checked)o[e.name]=e.value}else o[e.name]=e.value});return o}
    const opts=(arr,sel,ph)=>(ph!==undefined?'<option value="">'+esc(ph)+'</option>':'')+arr.map(x=>{const v=Array.isArray(x)?x[0]:x,l=Array.isArray(x)?x[1]:x;return '<option value="'+esc(v)+'"'+(String(v)===String(sel)?' selected':'')+'>'+esc(l)+'</option>'}).join('');

    // Hàm gọi API kèm thông tin xác thực Google Firebase Auth (Bảo mật bằng ID Token)
    async function api(fn, ...a) {
      const u = window.GAS_API_URL;
      try {
        let idToken = null;
        if (currentUser) {
          try {
            idToken = await currentUser.getIdToken();
          } catch (tokErr) {
            console.error('Lỗi lấy idToken Firebase:', tokErr);
          }
        }
        const res = await fetch(u, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            fn: fn,
            args: a,
            auth: {
              email: currentUser ? currentUser.email : '',
              idToken: idToken || ''
            }
          })
        });
        const r = await res.json();
        if (r && r.ok) return r.data;
        throw new Error((r && r.loi) || 'Lỗi không xác định từ máy chủ');
      } catch (e) {

function qrUrl(ma){const u=S.cfg.url_goc||'';return u+(u.indexOf('?')<0?'?':'&')+'sp='+encodeURIComponent(ma)}
function drawQR(el,text,size){el.innerHTML='';if(window.QRCode){try{new QRCode(el,{text:text,width:size||150,height:size||150});return}catch(e){}}el.innerHTML='<span class="sm">'+esc(text)+'</span>'}
function nenAnh(file,maxDim,quality){
  maxDim=maxDim||1920;quality=quality||0.82;
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('Không thể đọc tệp '+file.name));
    reader.onload=e=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('Hình ảnh '+file.name+' không hợp lệ hoặc bị lỗi.'));
      img.onload=()=>{
        try{
          let w=img.width,h=img.height;
          if(w>maxDim||h>maxDim){
            if(w>h){h=Math.round((h*maxDim)/w);w=maxDim}
            else{w=Math.round((w*maxDim)/h);h=maxDim}
          }
          const canvas=document.createElement('canvas');
          canvas.width=w;canvas.height=h;
          const ctx=canvas.getContext('2d');
          ctx.fillStyle='#ffffff';
          ctx.fillRect(0,0,w,h);
          ctx.drawImage(img,0,0,w,h);
          const dataUrl=canvas.toDataURL('image/jpeg',quality);
          const b64=dataUrl.split(',')[1];
          resolve({dataUrl:dataUrl,b64:b64,mime:'image/jpeg'});
        }catch(err){
          reject(new Error('Lỗi tối ưu ảnh: '+(err.message||err)));
        }
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function photoHandler(inp,admin){
  const form=inp.form||inp.closest('form');
  const st=form?form.querySelector('#photoSt'):$('#photoSt');
  const tk=form?form.querySelector('[name=anh_token]'):null;
  const btn=form?form.querySelector('button[type=submit], button:not([type=button])'):null;
  if(tk)tk.value='';
  const files=Array.from(inp.files||[]);
  if(!files.length){if(st)st.innerHTML='';return}
  if(files.length>5){
    if(st)st.innerHTML='<span style="color:var(--rd,#d32f2f);font-weight:600">❌ Chỉ được chọn tối đa 5 ảnh. Bạn đã chọn '+files.length+' ảnh. Vui lòng chọn lại!</span>';
    inp.value='';return;
  }
  const allowed=['image/jpeg','image/png','image/webp'];
  for(let i=0;i<files.length;i++){
    const f=files[i];
    if(!allowed.includes(f.type)){
      if(st)st.innerHTML='<span style="color:var(--rd,#d32f2f);font-weight:600">❌ Tệp "'+esc(f.name)+'" không đúng định dạng. Chỉ nhận JPG, PNG, WEBP.</span>';
      inp.value='';return;
    }
    if(f.size>10*1024*1024){
      if(st)st.innerHTML='<span style="color:var(--rd,#d32f2f);font-weight:600">❌ Tệp "'+esc(f.name)+'" vượt quá dung lượng cho phép (10 MB).</span>';
      inp.value='';return;
    }
  }
  if(btn)btn.disabled=true;
  if(st)st.innerHTML='<span class="spin"></span> Đang xử lý ảnh…';
  (async()=>{
    const tokens=[];
    const previews=[];
    try{
      for(let i=0;i<files.length;i++){
        const f=files[i];
        if(st)st.innerHTML='<span class="spin"></span> Đang tối ưu & nén nét ảnh '+(i+1)+'/'+files.length+'…';
        const opt=await nenAnh(f);
        if(st)st.innerHTML='<span class="spin"></span> Đang tải ảnh '+(i+1)+'/'+files.length+' lên Google Drive…';
        const res=await api(admin?'adm_taiAnh':'pub_taiAnh',{mime:opt.mime,b64:opt.b64});
        tokens.push(res.token);
        previews.push(opt.dataUrl);
      }
      if(tk)tk.value=tokens.join(',');
      if(st){
        st.innerHTML='<div style="color:#2e7d32;font-weight:600;margin-bottom:6px">✅ Đã tối ưu & tải lên '+tokens.length+' ảnh thành công!</div>'
          +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">'
          +previews.map((src,idx)=>'<div style="position:relative;border:1px solid #cbd5e1;border-radius:8px;overflow:hidden;width:68px;height:68px;background:#f8fafc"><img src="'+src+'" style="width:100%;height:100%;object-fit:cover">'+(idx===0?'<span style="position:absolute;bottom:0;left:0;right:0;background:rgba(46,125,50,0.85);color:#fff;font-size:9px;text-align:center;padding:1px 0;line-height:1.2;font-weight:600">Ảnh chính</span>':'')+'</div>').join('')
          +'</div>';
      }
    }catch(e){
      if(st)st.innerHTML='<div style="color:var(--rd,#d32f2f);font-weight:600">❌ '+esc(e.message)+'</div>';
      inp.value='';
      if(tk)tk.value='';
    }finally{
      if(btn)btn.disabled=false;
    }
  })();
}

       html+='<div style="text-align:center;border-bottom:1px solid #e2e8f0;padding-bottom:10px"><div class="sm mu" style="margin-bottom:4px;font-weight:600">Ảnh '+(idx+1)+'/'+list.length+(idx===0?' (Ảnh chính)':'')+'</div><img style="max-width:100%;max-height:400px;border-radius:8px;border:1px solid #cbd5e1;object-fit:contain" src="'+src+'"></div>';
     });
     html+='</div>';
     $('#modal .box').insertAdjacentHTML('beforeend',html);
     const spin=$('#modal .box .spin');

/* ---- Gửi biểu mẫu quản trị ---- */
window.onAdminSubmit=async(k,form,o,btn)=>{
  if(k==='a_ask'){const cb=S.askCb;if(cb)await cb(o,btn);return}
  if(k==='a_sp_save'){
    const isNew=!o.ma;
    const p=find('sp',o.ma);
    const hasImg=p&&(p.anh_rieng_id||p.anh_id);
    if(!o.anh_token&&(isNew||!hasImg)){
      toast('Vui lòng chọn và tải ảnh sản phẩm lên trước khi lưu (Bắt buộc)!','err');
      return;
    }
    const num=['gia_de_xuat'];num.forEach(x=>{if(o[x]==='')o[x]=''});
    return runAdm(btn,()=>api('adm_luuSanPham',o),'Đã lưu sản phẩm');
  }
  if(k==='a_kt_save'){return runAdm(btn,()=>api('adm_hanhDongSanPham',o.ma,'luu_kiem_tra',o),'Đã lưu phiếu kiểm tra')}
  if(k==='a_on'){return runAdm(btn,()=>api('adm_batVanHanh',Object.assign({},o,{xac_nhan:o.xac_nhan===true})),'Đã bật chế độ vận hành THẬT',async()=>{S.cfg=await api('pub_khoiTao');S.sp=null;render()})}
  if(k==='a_cfg'){return runAdm(btn,()=>api('adm_luuCauHinh',o),'Đã lưu cấu hình',async()=>{S.cfg=await api('pub_khoiTao');render()})}
};</script>
