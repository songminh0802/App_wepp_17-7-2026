<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReSchool – Chợ đồ dùng học tập tuần hoàn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root{--g:#2E7D32;--g2:#1B5E20;--gl:#E8F5E9;--cream:#FFF8E7;--cream2:#FDF0CF;--or:#F57C00;--or2:#E65100;--tx:#1f2a1f;--mu:#667066;--bd:#dfe6d6;--rd:#c62828;--bl:#1565c0;--w:#fff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--cream);color:var(--tx);font-size:15px;line-height:1.5}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.25;color:var(--g2)}
h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
a{color:var(--g)}
p{margin:.4em 0}
.hide{display:none!important}
.center{text-align:center}.pad{padding:28px 16px}
.mu{color:var(--mu)}.sm{font-size:.85rem}.b{font-weight:700}
.wrap{max-width:1040px;margin:0 auto;padding:12px}
#banner .demo{background:var(--or);color:#fff;text-align:center;padding:7px 10px;font-weight:600;font-size:.88rem}
#banner .that{background:var(--g2);color:#fff;text-align:center;padding:5px 10px;font-size:.8rem}
#hdr{background:var(--g);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.15)}
#hdr .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px}
#hdr .brand{flex:1;cursor:pointer}
#hdr .brand b{font-size:1.15rem;display:block}
#hdr .brand span{font-size:.72rem;opacity:.92}
.btn{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--g);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:42px}
.btn:hover{background:var(--g2)}
.btn.or{background:var(--or)}.btn.or:hover{background:var(--or2)}
.btn.out{background:#fff;color:var(--g);border:2px solid var(--g)}
.btn.out:hover{background:var(--gl)}
.btn.red{background:var(--rd)}
.btn.gray{background:#8a928a}
.btn.sm{padding:6px 10px;min-height:34px;font-size:.85rem}
.btn:disabled{opacity:.55;cursor:not-allowed}
.cartb{background:#fff;color:var(--g);border-radius:20px;padding:6px 12px;font-weight:700;cursor:pointer;border:0;font:inherit;font-weight:700}
.cartb i{background:var(--or);color:#fff;border-radius:10px;padding:0 7px;font-style:normal;margin-left:4px}
#nav{background:var(--g2);overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
#nav a{display:inline-block;color:#dff2e0;padding:10px 14px;font-weight:500;cursor:pointer;text-decoration:none;font-size:.92rem;border-bottom:3px solid transparent}
#nav a.on{color:#fff;border-color:var(--or);font-weight:700}
.hero{background:linear-gradient(135deg,var(--g) 0%,#66BB6A 100%);color:#fff;border-radius:16px;padding:24px 18px;margin:12px 0}
.hero h1{color:#fff;font-size:1.7rem}
.hero .sl{font-size:1.05rem;opacity:.95;font-style:italic}
.row{display:flex;flex-wrap:wrap;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:var(--w);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card.cat{text-align:center;cursor:pointer;transition:.15s}
.card.cat:hover{transform:translateY(-2px);border-color:var(--g)}
.card.cat .ic{font-size:2.2rem}
.pc{padding:0;overflow:hidden;cursor:pointer;position:relative}
.pc .im{height:120px;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:2.8rem;position:relative}
.pc .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc .bd{padding:10px}
.pc .nm{font-weight:600;font-size:.92rem;min-height:2.6em}
.price{color:var(--or2);font-weight:700;font-size:1.05rem}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:10px;background:var(--gl);color:var(--g2);font-weight:600;margin:1px 2px 1px 0}
.tag.or{background:#FFE0B2;color:#8a4b00}.tag.rd{background:#FFCDD2;color:#8e1a1a}.tag.bl{background:#BBDEFB;color:#0d47a1}.tag.gr{background:#e0e0e0;color:#444}
.demo-tag{position:absolute;top:6px;left:6px;background:var(--or);color:#fff;font-size:.65rem;padding:2px 6px;border-radius:8px;font-weight:700;z-index:2}
.steps{counter-reset:s;display:grid;gap:8px}
.step{background:#fff;border-left:5px solid var(--or);padding:10px 12px;border-radius:10px;border:1px solid var(--bd);border-left:5px solid var(--or)}
.step:before{counter-increment:s;content:counter(s);background:var(--or);color:#fff;border-radius:50%;display:inline-block;width:24px;height:24px;text-align:center;margin-right:8px;font-weight:700}
.stat{text-align:center}.stat .n{font-size:1.5rem;font-weight:700;color:var(--g)}
label{display:block;font-weight:600;margin:10px 0 3px;font-size:.9rem}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1.5px solid var(--bd);border-radius:10px;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g)}
input[type=checkbox],input[type=radio]{width:auto;margin-right:6px}
.chk{display:flex;align-items:flex-start;gap:6px;font-weight:500;margin:8px 0}
.chk input{margin-top:4px}
textarea{min-height:80px;resize:vertical}
.alert{padding:10px 12px;border-radius:10px;margin:10px 0;font-size:.9rem}
.alert.or{background:#FFF3E0;border:1px solid #FFB74D;color:#7a4300}
.alert.rd{background:#FFEBEE;border:1px solid #EF9A9A;color:#8e1a1a}
.alert.gr{background:var(--gl);border:1px solid #A5D6A7;color:var(--g2)}
.alert.bl{background:#E3F2FD;border:1px solid #90CAF9;color:#0d47a1}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.spin.big{width:34px;height:34px;border:4px solid var(--gl);border-top-color:var(--g)}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--mu);padding:30px 10px;background:#fff;border:2px dashed var(--bd);border-radius:14px}
#toasts{position:fixed;left:0;right:0;bottom:14px;z-index:99;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:#333;color:#fff;padding:10px 16px;border-radius:10px;max-width:92vw;box-shadow:0 4px 12px rgba(0,0,0,.3);pointer-events:auto}
.toast.ok{background:var(--g2)}.toast.err{background:var(--rd)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:12px}
.modal .box{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:16px;margin:auto;position:relative}
.modal .x{position:absolute;right:10px;top:8px;background:none;border:0;font-size:1.6rem;cursor:pointer;color:var(--mu)}
.qr{display:inline-block;padding:8px;background:#fff;border:1px solid var(--bd);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{border-bottom:1px solid var(--bd);padding:6px 4px;text-align:left;vertical-align:top}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.tabs button{border:1.5px solid var(--g);background:#fff;color:var(--g);border-radius:20px;padding:6px 12px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--g);color:#fff}
.item{border:1px solid var(--bd);background:#fff;border-radius:12px;padding:10px;margin:8px 0}
.item .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start}
.kv{display:grid;grid-template-columns:130px 1fr;gap:2px 8px;font-size:.88rem}
.kv span:nth-child(odd){color:var(--mu)}
.fl{display:flex;gap:8px;flex-wrap:wrap}.fl>*{flex:1;min-width:130px}
#ftr{text-align:center;color:var(--mu);font-size:.78rem;padding:18px 10px 40px}
#print-area{display:none}
@media print{
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important;font-family:'Times New Roman',serif;color:#000;background:#fff;padding:10mm}
  #print-area h2{color:#000;text-align:center}
  #print-area table td,#print-area table th{border:1px solid #000;padding:5px}
  .sig{display:flex;justify-content:space-around;margin-top:40px;text-align:center}
}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.pc .im{height:150px}h1{font-size:2rem}.hero h1{font-size:2.2rem}}
</style>
</head>
<body>
  <div id="banner"></div>
  <header id="hdr"></header>
  <nav id="nav"></nav>
  <main id="app"><div class="center pad"><span class="spin big"></span><p>Đang tải…</p></div></main>
  <footer id="ftr"></footer>
  <div id="modal" class="modal hide"></div>
  <div id="toasts"></div>
  <div id="print-area"></div>
  <script>
    // =========================================================================
    // CẤU HÌNH API BACKEND GOOGLE APPS SCRIPT (KHI TRIỂN KHAI TRÊN VERCEL)
    // Sau khi Triển khai Web App trên Google Apps Script (Quyền: Bất kỳ ai / Anyone),
    // hãy copy link Web App (kết thúc bằng /exec) và dán vào biến dưới đây:
    // =========================================================================
    window.GAS_API_URL = "https://script.google.com/macros/s/AKfycbzzZVNJPaM_SMjEh5eyO7otcOMuFZkCzwIGx_MzAFvnoFG23H4j_yk9A2Dd_qQSGVVl/exec";

    // Đọc mã sản phẩm từ tham số URL (?sp=RS123) nếu có
    window.__INIT = (function() {
      try {
        var sp = new URLSearchParams(window.location.search).get("sp");
        if (sp && /^RSd{3,6}$/i.test(sp)) return { sp: sp.toUpperCase() };
      } catch (e) {}
      return { sp: "" };
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
/* ===== RESCHOOL – CLIENT (công khai) ===== */
const TT_SP={CHO_TIEP_NHAN:'Chờ tiếp nhận',CHO_KIEM_TRA:'Chờ kiểm tra',KHONG_DAT:'Không đạt',CHO_DUYET_GIA:'Chờ duyệt giá',SAN_SANG:'Sẵn sàng đăng bán',GIU_CHO:'Giữ chỗ',DA_BAN:'Đã bán',TRA_LAI:'Trả lại',LOAI_BO:'Loại bỏ'};
const TT_DON={CHO_XAC_NHAN:'Chờ xác nhận',DA_XAC_NHAN:'Đã xác nhận',CHO_NHAN:'Chờ nhận',HOAN_TAT:'Hoàn tất',HUY:'Hủy'};
const TT_TT={CHUA_THU:'Chưa thu tiền',DA_THU:'Đã thu tiền'};
const TT_KG={MOI:'Mới gửi',DA_TIEP_NHAN:'Đã tiếp nhận',DA_THOA_THUAN:'Đã thỏa thuận',TU_CHOI:'Từ chối',HET_HAN:'Hết hạn',KET_THUC:'Kết thúc'};
const TT_YC={MOI:'Mới gửi (chưa tiếp nhận)',DA_TIEP_NHAN:'Đã tiếp nhận',TU_CHOI:'Từ chối'};
const LOAI_TC={DOANH_THU_TANG:'Doanh thu hàng tặng',PHI_KY_GUI:'Phí ký gửi',THU_HO:'Tiền thu hộ (không phải doanh thu)',TRA_CHU_HANG:'Trả chủ hàng',CHI_PHI:'Chi phí',DIEU_CHINH:'Điều chỉnh',CHI_PHAN_BO:'Chi từ quỹ phân bổ'};
const TT_TC={CHO_DUYET:'Chờ duyệt',DA_XAC_NHAN:'Đã xác nhận',TU_CHOI:'Từ chối'};
const CHECK_LBL={ve_sinh:'Vệ sinh sạch sẽ',hu_hong:'Không hư hỏng nặng',an_toan:'An toàn khi sử dụng',noi_dung:'Nội dung phù hợp lứa tuổi',ban_quyen:'Không vi phạm bản quyền (không sao chép trái phép)'};
const VAI_LBL={HOC_SINH:'Thành viên học sinh',GIAO_VIEN:'Giáo viên giám sát',QUAN_TRI:'Quản trị viên'};

const S={cfg:null,sp:null,cart:[],view:'home',param:null,me:null,f:{q:'',dm:'',min:'',max:'',tt:'',con:false,sort:'moi'},nhan:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vnd=n=>Number(n||0).toLocaleString('vi-VN')+' đ';
const bo=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
const dm=ma=>(S.cfg.danh_muc.find(x=>x.ma===ma)||{ten:ma,icon:'📦'});
const isDemo=()=>S.cfg&&S.cfg.che_do!=='THAT';
const fmtT=t=>String(t||'').replace('T',' ').slice(0,16);

let mem={};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return mem[k]}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}};

function api(fn,...a){
  if(typeof google!=='undefined'&&google.script&&google.script.run){
    return new Promise((ok,no)=>{google.script.run.withSuccessHandler(r=>{if(r&&r.ok)ok(r.data);else no(new Error((r&&r.loi)||'Lỗi không xác định'))}).withFailureHandler(e=>no(new Error((e&&e.message)||'Mất kết nối máy chủ')))[fn](...a)});
  }
  const u=window.GAS_API_URL||'';
  if(!u||u.includes('DAN_LINK_WEB_APP_VAO_DAY')){
    return Promise.reject(new Error('Chưa cấu hình liên kết Google Apps Script API (GAS_API_URL)!'));
  }
  return fetch(u,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({fn:fn,args:a})
  }).then(res=>res.json()).then(r=>{
    if(r&&r.ok)return r.data;
    throw new Error((r&&r.loi)||'Lỗi không xác định');
  }).catch(e=>{
    throw new Error(e.message||'Mất kết nối máy chủ');
  });
}
function toast(m,t){const d=document.createElement('div');d.className='toast '+(t||'');d.textContent=m;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),t==='err'?6000:3500)}
async function busy(btn,fn){if(!btn||btn.disabled)return;const h=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span> Đang xử lý…';try{return await fn()}finally{btn.disabled=false;btn.innerHTML=h}}
function openModal(title,html){const m=$('#modal');m.innerHTML='<div class="box"><button class="x" data-act="close" aria-label="Đóng">×</button><h2>'+esc(title)+'</h2>'+html+'</div>';m.classList.remove('hide')}
function closeModal(){$('#modal').classList.add('hide');$('#modal').innerHTML=''}
const loading=()=>'<div class="center pad"><span class="spin big"></span><p class="mu">Đang tải…</p></div>';
const errBox=m=>'<div class="alert rd">⚠️ '+esc(m)+'</div>';
function fd(form){const o={};form.querySelectorAll('[name]').forEach(e=>{if(e.type==='checkbox')o[e.name]=e.checked;else if(e.type==='radio'){if(e.checked)o[e.name]=e.value}else o[e.name]=e.value});return o}
const opts=(arr,sel,ph)=>(ph!==undefined?'<option value="">'+esc(ph)+'</option>':'')+arr.map(x=>{const v=Array.isArray(x)?x[0]:x,l=Array.isArray(x)?x[1]:x;return '<option value="'+esc(v)+'"'+(String(v)===String(sel)?' selected':'')+'>'+esc(l)+'</option>'}).join('');

/* ---------- Khung trang ---------- */
const NAV=[['home','Trang chủ'],['catalog','Sản phẩm'],['tang','Tặng đồ'],['kygui','Ký gửi'],['about','Giới thiệu & Phản hồi'],['track','Tra cứu đơn']];
function renderShell(){
  const c=S.cfg;
  $('#banner').innerHTML=isDemo()?'<div class="demo">🧪 Chế độ demo, chưa mở giao dịch thực tế · <b>Dữ liệu minh họa</b></div>':'<div class="that">Đang vận hành theo văn bản chấp thuận của nhà trường</div>';
  const n=S.cart.reduce((a,i)=>a+i.sl,0);
  $('#hdr').innerHTML='<div class="in"><div class="brand" data-act="go" data-v="home"><b>♻️ ReSchool</b><span>'+esc(c.slogan)+'</span></div><button class="cartb" data-act="go" data-v="cart" aria-label="Giỏ hàng">🛒<i>'+n+'</i></button></div>';
  let nav=NAV.map(x=>'<a data-act="go" data-v="'+x[0]+'" class="'+(S.view===x[0]?'on':'')+'">'+x[1]+'</a>').join('');
  if(S.me)nav+='<a data-act="go" data-v="a_home" class="'+(S.view.startsWith('a_')?'on':'')+'">⚙️ Quản trị</a>';
  else nav+='<a href="/admin.html" class="nav-admin">🔐 Đăng nhập quản trị</a>';
  $('#nav').innerHTML=nav;
  $('#ftr').innerHTML='ReSchool · Dự án khởi nghiệp học sinh · Phiên bản '+esc(c.phien_ban)+(isDemo()?'<br>Bản demo: mọi biểu mẫu và đơn hàng chỉ mô phỏng.':'');
}
function go(v,p){S.view=v;S.param=p||null;closeModal();window.scrollTo(0,0);render()}
function render(){
  renderShell();
  const v=S.view,app=$('#app');
  if(v.startsWith('a_')){if(!S.me){app.innerHTML=errBox('Bạn chưa đăng nhập quản trị.');return}return renderAdmin(v)}
  const V={home:vHome,catalog:vCatalog,product:vProduct,cart:vCart,track:vTrack,tang:()=>vForm('tang'),kygui:()=>vForm('kygui'),about:vAbout};
  (V[v]||vHome)();
}

/* ---------- Dữ liệu sản phẩm ---------- */
async function loadSp(force){if(S.sp&&!force)return S.sp;S.sp=await api('pub_danhSachSanPham');return S.sp}
const stLbl=p=>p.trang_thai==='SAN_SANG'?(p.dat_duoc?'Còn hàng':'Tạm hết'):TT_SP[p.trang_thai];
function stTag(p){const t=p.trang_thai;return '<span class="tag '+(t==='SAN_SANG'&&p.dat_duoc?'':t==='GIU_CHO'?'or':'gr')+'">'+esc(stLbl(p))+'</span>'}
function imgBox(p){const c=dm(p.danh_muc);return '<div class="im">'+(isDemo()?'<span class="demo-tag">Dữ liệu minh họa</span>':'')+'<span>'+c.icon+'</span>'+(p.anh_id?'<img loading="lazy" alt="" src="https://drive.google.com/thumbnail?id='+encodeURIComponent(p.anh_id)+'&sz=w600" onerror="this.remove()">':'')+'</div>'}
function pCard(p){return '<div class="card pc" data-act="go" data-v="product" data-p="'+esc(p.ma)+'">'+imgBox(p)+'<div class="bd"><div class="mu sm">'+esc(p.ma)+'</div><div class="nm">'+esc(p.ten)+'</div><div class="price">'+vnd(p.gia)+'</div><div>'+stTag(p)+'<span class="tag bl">'+esc(p.tinh_trang)+'</span></div></div></div>'}

/* ---------- Trang chủ ---------- */
async function vHome(){
  const c=S.cfg,t=c.tac_dong;
  const stat=(n,l)=>'<div class="card stat"><div class="n">'+(n>0?n:'—')+'</div><div class="sm">'+l+(n>0?'':'<br><b>Chưa phát sinh</b>')+'</div></div>';
  $('#app').innerHTML='<div class="wrap"><section class="hero"><h1>♻️ ReSchool</h1><p class="sl">“'+esc(c.slogan)+'”</p><p>Chợ đồ dùng học tập tuần hoàn của học sinh: nhận lại sách, dụng cụ, cặp ba lô còn dùng tốt từ các bạn, kiểm tra, định giá công khai rồi trao cho bạn khác cần dùng – tiết kiệm và nhân văn hơn.</p><div class="row" style="margin-top:12px"><button class="btn or" data-act="go" data-v="catalog">🔎 Khám phá sản phẩm</button><button class="btn out" data-act="go" data-v="tang">🎁 Tặng đồ dùng</button><button class="btn out" data-act="go" data-v="kygui">🤝 Đăng ký ký gửi</button></div></section>'
  +(isDemo()?'<div class="alert or"><b>Bản demo.</b> Sản phẩm, giá, đơn hàng đều là dữ liệu minh họa. Hệ thống chưa nhận hàng, tiền hay thông tin cá nhân thật.</div>':'')
  +'<h2>Danh mục</h2><div class="grid">'+c.danh_muc.map(d=>'<div class="card cat" data-act="cat" data-p="'+d.ma+'"><div class="ic">'+d.icon+'</div><b>'+esc(d.ten)+'</b></div>').join('')+'</div>'

function photoHandler(inp,admin){
  const st=$('#photoSt'),f=inp.files[0],tk=inp.form.querySelector('[name=anh_token]');tk.value='';
  if(!f){st.textContent='';return}
  if(!['image/jpeg','image/png','image/webp'].includes(f.type)){st.textContent='❌ Chỉ nhận JPG, PNG, WEBP.';inp.value='';return}
  if(f.size>2*1024*1024){st.textContent='❌ Ảnh vượt quá 2 MB.';inp.value='';return}
  st.textContent='Đang tải ảnh lên…';
  const r=new FileReader();r.onload=async()=>{try{const d=await api(admin?'adm_taiAnh':'pub_taiAnh',{mime:f.type,b64:String(r.result).split(',')[1]});tk.value=d.token;st.textContent='✅ Đã tải ảnh lên.'}catch(e){st.textContent='❌ '+e.message;inp.value=''}};r.readAsDataURL(f);
}

const A={
 go:el=>go(el.dataset.v,el.dataset.p),
 cat:el=>{S.f={q:'',dm:el.dataset.p,min:'',max:'',tt:'',con:false,sort:'moi'};go('catalog')},
 close:()=>closeModal(),
 policy:()=>policy(),
 addcart:el=>{const ma=el.dataset.p,sl=+($('#pq')||{value:1}).value,x=S.cart.find(i=>i.ma===ma);if(x)x.sl=Math.min(10,x.sl+sl);else S.cart.push({ma,sl});saveCart();toast('Đã thêm vào giỏ hàng','ok')},
 qty:el=>{const i=S.cart.find(x=>x.ma===el.dataset.p),p=S.sp.find(x=>x.ma===i.ma);i.sl=Math.max(1,Math.min(i.sl+(+el.dataset.d),p.ton_kho,10));saveCart();vCart()},
 rm:el=>{S.cart=S.cart.filter(i=>i.ma!==el.dataset.p);saveCart();vCart()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.tagName==='A'||el.tagName==='BUTTON')e.preventDefault();const f=A[el.dataset.act];if(f)f(el,e)});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-photo]'))photoHandler(e.target,e.target.dataset.photo==='admin');
  if(e.target.name==='la_hoc_sinh'){const p=$('#phh');if(p)p.classList.toggle('hide',!e.target.checked)}
  if(e.target.closest('#grid,#app')&&e.target.matches('#fdm,#ftt,#fso,#fcon'))applyFilters();
  if(window.onAdminChange)window.onAdminChange(e);
});
document.addEventListener('input',e=>{if(e.target.matches('#fq,#fmin,#fmax'))applyFilters()});
document.addEventListener('submit',async e=>{
  const form=e.target.closest('form[data-submit]');if(!form)return;e.preventDefault();
  const k=form.dataset.submit,btn=form.querySelector('button:not([type=button])'),o=fd(form);
  const H={
   order:async()=>{o.items=S.cart.map(i=>({ma:i.ma,sl:i.sl}));const r=await api('pub_datHang',o);S.nhan=r.nhan;showOrderResult(r);toast('Đơn đã được ghi vào hệ thống','ok')},
   track:async()=>{const d=await api('pub_traCuuDon',o.ma,o.code);$('#trk').innerHTML=trackView(d)},
   tang:async()=>{const r=await api('pub_guiTang',o);done(r,'Yêu cầu tặng đồ')},
   kygui:async()=>{const r=await api('pub_guiKyGui',o);done(r,'Yêu cầu ký gửi')},
   feedback:async()=>{const r=await api('pub_guiPhanHoi',o);form.reset();toast('Đã ghi phản hồi '+r.ma+(r.che_do!=='THAT'?' (mô phỏng)':''),'ok')}
  };
  function done(r,ten){$('#app').innerHTML='<div class="wrap"><div class="card"><h2>'+(r.che_do!=='THAT'?'🧪 ':'✅ ')+'Đã ghi '+ten.toLowerCase()+' '+esc(r.ma)+'</h2>'+(r.che_do!=='THAT'?'<div class="alert or">Chế độ demo: chỉ mô phỏng, không có hàng thật được nhận.</div>':'')+'<div class="alert bl"><b>Lưu ý:</b> gửi yêu cầu chưa có nghĩa là đã được tiếp nhận. Giáo viên sẽ kiểm tra và liên hệ nếu chấp nhận.</div><button class="btn" data-act="go" data-v="home">Về trang chủ</button></div></div>'}
  if(H[k]&&window[k+'Pre'])window[k+'Pre'](o);
  if(!H[k]){if(window.onAdminSubmit)return window.onAdminSubmit(k,form,o,btn);return}
  await busy(btn,async()=>{try{await H[k]()}catch(err){toast(err.message,'err')}});
});

  }
})();

async function aSp(){

   +(ds.length?ds.map(spItem).join(''):'<div class="empty">Chưa có sản phẩm.</div>'));

function spItem(p){
  const t=p.trang_thai,gv=isGV(),b=[];
  const B=(a,txt,cls)=>b.push('<button class="btn sm '+(cls||'')+'" data-act="a_sp_do" data-id="'+p.ma+'" data-h="'+a+'">'+txt+'</button>');
  if(t==='CHO_TIEP_NHAN'&&gv)B('tiep_nhan','Tiếp nhận');
  if(t==='CHO_KIEM_TRA')b.push('<button class="btn sm or" data-act="a_kt" data-id="'+p.ma+'">📋 Phiếu kiểm tra BM04</button>');
  if(t==='KHONG_DAT'&&gv)B('kiem_tra_lai','Kiểm tra lại','out');
  if((t==='CHO_DUYET_GIA'||t==='SAN_SANG'||t==='GIU_CHO')&&gv)B('duyet_gia',t==='CHO_DUYET_GIA'?'Duyệt giá':'Đổi giá','or');
  if(gv&&!['TRA_LAI','LOAI_BO'].includes(t)){B('tra_lai','Trả lại','gray');B('loai_bo','Loại bỏ','red')}
  if(gv||['CHO_TIEP_NHAN','CHO_KIEM_TRA'].includes(t))B('luu_tru',p.luu_tru===true||p.luu_tru==='TRUE'?'Bỏ lưu trữ':'Lưu trữ','out');
  b.push('<button class="btn sm out" data-act="a_sp_edit" data-id="'+p.ma+'">Sửa</button>');
  if(p.anh_rieng_id)b.push('<button class="btn sm out" data-act="a_img" data-id="'+esc(p.anh_rieng_id)+'">🖼 Ảnh</button>');
  if(['SAN_SANG','GIU_CHO','DA_BAN'].includes(t))b.push('<button class="btn sm out" data-act="a_qr" data-id="'+p.ma+'">QR</button>');
  if(p.kiem_tra)b.push('<button class="btn sm out" data-act="a_print" data-k="bm04" data-id="'+p.ma+'">In BM04</button>');
  return '<div class="item"><div class="hd"><div><b>'+esc(p.ma)+' · '+esc(p.ten)+'</b><div>'+ttSpTag(t)+cdTag(p.che_do)+'<span class="tag gr">'+(p.nguon==='KY_GUI'?'Ký gửi':'Tặng')+'</span>'+(p.luu_tru===true||p.luu_tru==='TRUE'?'<span class="tag gr">Lưu trữ</span>':'')+'</div></div><div class="sm">'+(p.gia?'<b class="price">'+vnd(p.gia)+'</b>':'Giá đề xuất: '+(p.gia_de_xuat!==''?vnd(p.gia_de_xuat):'—'))+'</div></div><div class="sm mu">Tồn '+p.ton_kho+' · Giữ '+p.dang_giu+' · Bán '+p.da_ban+' · Tổng nhập '+p.tong_nhap+(p.ly_do?' · Lý do: '+esc(p.ly_do):'')+'</div><div class="row" style="margin-top:6px">'+b.join('')+'</div></div>';

function inPhieu(maPhieu,ten,body){
  const hd='<div style="text-align:center"><b>TRƯỜNG THCS ……………………</b><br>DỰ ÁN KHỞI NGHIỆP RESCHOOL</div><h2>'+esc(ten)+'</h2><p style="text-align:center">Mẫu '+maPhieu+(S.cfg.che_do!=='THAT'?' – <b>BẢN MINH HỌA (DEMO)</b>':'')+'</p>';

  return {hd,sig};
}

 a_chipb:()=>ask('Ghi khoản chi từ quỹ phân bổ','<label>Mục</label><select name="muc">'+opts([['HO_TRO','Hỗ trợ'],['TAI_DAU_TU','Tái đầu tư'],['DU_PHONG','Dự phòng']],'')+'</select><label>Nội dung (KHÔNG ghi danh tính/hoàn cảnh người nhận)</label><input name="noi_dung" required maxlength="200"><label>Số tiền (đ)</label><input name="so_tien" type="number" min="1" required><label>Chứng từ</label><input name="chung_tu" required maxlength="300">',(o,b)=>runAdm(b,()=>api('adm_ghiChiPhanBo',o),'Đã ghi khoản chi')),
 a_hs:()=>ask('Học sinh tham gia (nhập tay)','<label>Số học sinh</label><input name="so_hs" type="number" min="0" max="500"><label>Nhiệm vụ</label><textarea name="nhiem_vu" maxlength="500"></textarea>',(o,b)=>runAdm(b,()=>api('adm_luuNhapTay',o),'Đã lưu')),
 a_ph_doc:el=>runAdm(el,()=>api('adm_docPhanHoi',el.dataset.id),'Đã đánh dấu'),
 a_bm1:()=>ask('Phiếu khảo sát nhu cầu BM01 (ẩn danh)','<label>Nhóm đối tượng</label><select name="nhom">'+opts(['Học sinh lớp 6','Học sinh lớp 7','Học sinh lớp 8','Học sinh lớp 9','Phụ huynh','Giáo viên'],'')+'</select><label>Loại đồ dùng cần</label><input name="nhu_cau" required maxlength="200"><label>Mức giá sẵn sàng chi (đ)</label><input name="muc_gia" type="number" min="0"><label>Ghi chú</label><input name="ghi_chu" maxlength="300">',(o,b)=>runAdm(b,()=>api('adm_luuPhieu',{loai:'BM01',tham_chieu:'',du_lieu:o}),'Đã lưu BM01')),
 a_on:()=>{},
 a_off:el=>runAdm(el,()=>api('adm_tatVanHanh'),'Đã quay lại DEMO',async()=>{S.cfg=await api('pub_khoiTao');render()}),
 a_us:el=>{const u=el.dataset.id?find('us',el.dataset.id,'email'):{};ask(u.email?'Sửa tài khoản':'Thêm tài khoản','<label>Email Google</label><input name="email" type="email" required value="'+esc(u.email||'')+'" '+(u.email?'readonly':'')+'><label>Họ tên</label><input name="ho_ten" required maxlength="60" value="'+esc(u.ho_ten||'')+'"><label>Vai trò</label><select name="vai_tro">'+opts(Object.keys(VAI_LBL).map(k=>[k,VAI_LBL[k]]),u.vai_tro||'HOC_SINH')+'</select><label class="chk"><input type="checkbox" name="hoat_dong" '+(u.email&&!(u.hoat_dong==true||u.hoat_dong==='TRUE')?'':'checked')+'> Đang hoạt động</label>',(o,b)=>runAdm(b,()=>api('adm_luuNguoiDung',o),'Đã lưu tài khoản'))},
 a_sync:el=>runAdm(el,async()=>{const r=await api('adm_dongBoQuyen');alert(r);return r},'Đã chạy đồng bộ',()=>{}),
 a_xoademo:()=>ask('Xóa dữ liệu DEMO','<div class="alert rd">Xóa toàn bộ bản ghi DEMO. Không thể hoàn tác.</div><label>Gõ XOA DEMO để xác nhận</label><input name="xac_nhan" required>',(o,b)=>runAdm(b,()=>api('adm_xoaDuLieuDemo',o),'Đã xóa dữ liệu DEMO'))
});

/* ---- Gửi biểu mẫu quản trị ---- */
window.onAdminSubmit=async(k,form,o,btn)=>{
  if(k==='a_ask'){const cb=S.askCb;if(cb)await cb(o,btn);return}
  if(k==='a_sp_save'){const num=['gia_de_xuat'];num.forEach(x=>{if(o[x]==='')o[x]=''});return runAdm(btn,()=>api('adm_luuSanPham',o),'Đã lưu sản phẩm')}
  if(k==='a_kt_save'){return runAdm(btn,()=>api('adm_hanhDongSanPham',o.ma,'luu_kiem_tra',o),'Đã lưu phiếu kiểm tra')}
  if(k==='a_on'){return runAdm(btn,()=>api('adm_batVanHanh',Object.assign({},o,{xac_nhan:o.xac_nhan===true})),'Đã bật chế độ vận hành THẬT',async()=>{S.cfg=await api('pub_khoiTao');S.sp=null;render()})}
  if(k==='a_cfg'){return runAdm(btn,()=>api('adm_luuCauHinh',o),'Đã lưu cấu hình',async()=>{S.cfg=await api('pub_khoiTao');render()})}
};
</script>
