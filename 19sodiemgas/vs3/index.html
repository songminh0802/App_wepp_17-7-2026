<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sổ Điểm - Thầy Nguyễn Cường dạy Toán</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Quicksand', 'sans-serif'] },
                    colors: { primary: '#4A90E2', secondary: '#50E3C2', dark: '#1e293b' }
                }
            }
        }
    </script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Thêm thư viện SheetJS để đọc file Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- MathJax -->
    <script>
        MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] } };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        .input-grade { transition: all 0.2s; width: 100%; text-align: center; background: transparent; padding: 6px; border-radius: 4px; border: 1px solid transparent; font-weight: 600; color: #334155; }
        .input-grade:focus:not([readonly]) { outline: none; border-color: #4A90E2; background: #fff; box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2); }
        .input-grade::placeholder { color: #cbd5e1; font-weight: 400; }
        .input-text { text-align: left; padding-left: 8px; font-weight: 500; }
        .unsaved { background-color: #fef3c7 !important; color: #b45309 !important; border: 1px solid #f59e0b; }
        .score-low { color: #ef4444 !important; background-color: #fef2f2 !important; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        th, td { border: 1px solid #e2e8f0; vertical-align: middle; }
        
        /* Cố định cột Họ tên khi cuộn ngang */
        .sticky-col { position: sticky; left: 0; background-color: white; z-index: 5; box-shadow: 2px 0 5px -2px rgba(0,0,0,0.1); }
        th.sticky-col { background-color: #f1f5f9; z-index: 15; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased h-screen flex flex-col">

    <div id="main-app" class="flex-1 flex flex-col h-full overflow-hidden">
        <!-- HEADER -->
        <header class="bg-white shadow-sm px-6 py-4 flex flex-col sm:flex-row justify-between items-center border-b-4 border-primary gap-4 shrink-0">
            <div class="text-center sm:text-left">
                <h1 class="text-xl font-bold text-primary"><i class="fa-solid fa-book-open mr-2"></i>Sổ Điểm Điện Tử</h1>
                <p class="text-sm text-slate-500 font-semibold mt-1">Thầy Nguyễn Cường dạy Toán</p>
            </div>
            <div class="flex flex-wrap gap-2 w-full sm:w-auto justify-center items-center">
                <!-- DROPDOWN MENU THỐNG KÊ -->
                <div class="relative">
                    <button id="btn-stat" onclick="toggleStatMenu()" class="bg-teal-100 text-teal-700 hover:bg-teal-200 px-3 py-2 rounded-lg font-semibold transition-colors shadow-sm flex items-center gap-2 text-sm">
                        <i class="fa-solid fa-chart-pie"></i> Thống kê <i class="fa-solid fa-caret-down ml-1"></i>
                    </button>
                    <div id="stat-menu" class="hidden absolute left-0 sm:left-auto sm:right-0 mt-2 w-48 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 divide-y divide-slate-100 z-50 text-left border border-slate-200">
                        <div class="py-1">
                            <p class="px-4 py-2 text-[11px] font-bold text-slate-400 uppercase tracking-wider">Lớp hiện tại</p>
                            <button onclick="toggleStatMenu(); generateStats('CURRENT', 'HK1')" class="w-full text-left block px-4 py-2 text-sm text-slate-700 hover:bg-teal-50 hover:text-teal-700">Học Kỳ 1</button>
                            <button onclick="toggleStatMenu(); generateStats('CURRENT', 'HK2')" class="w-full text-left block px-4 py-2 text-sm text-slate-700 hover:bg-teal-50 hover:text-teal-700">Học Kỳ 2</button>
                            <button onclick="toggleStatMenu(); generateStats('CURRENT', 'CN')" class="w-full text-left block px-4 py-2 text-sm text-slate-700 hover:bg-teal-50 hover:text-teal-700">Cả Năm</button>
                            <button onclick="toggleStatMenu(); generateStats('CURRENT', 'ALL_TERMS')" class="w-full text-left block px-4 py-2 text-sm font-bold text-teal-600 hover:bg-teal-50">Chi tiết cả 3</button>
                        </div>
                        <div class="py-1">
                            <p class="px-4 py-2 text-[11px] font-bold text-slate-400 uppercase tracking-wider">Toàn khối (Tất cả)</p>
                            <button onclick="toggleStatMenu(); generateStats('ALL', 'HK1')" class="w-full text-left block px-4 py-2 text-sm text-slate-700 hover:bg-teal-50 hover:text-teal-700">Học Kỳ 1</button>
                            <button onclick="toggleStatMenu(); generateStats('ALL', 'HK2')" class="w-full text-left block px-4 py-2 text-sm text-slate-700 hover:bg-teal-50 hover:text-teal-700">Học Kỳ 2</button>
                            <button onclick="toggleStatMenu(); generateStats('ALL', 'CN')" class="w-full text-left block px-4 py-2 text-sm text-slate-700 hover:bg-teal-50 hover:text-teal-700">Cả Năm</button>
                            <button onclick="toggleStatMenu(); generateStats('ALL', 'ALL_TERMS')" class="w-full text-left block px-4 py-2 text-sm font-bold text-teal-600 hover:bg-teal-50">Chi tiết cả 3</button>
                        </div>
                    </div>
                </div>

                <button onclick="callGeminiAI()" id="btn-ai" class="bg-purple-100 text-purple-700 hover:bg-purple-200 px-3 py-2 rounded-lg font-semibold transition-colors flex items-center gap-2 shadow-sm text-sm">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> <span class="hidden sm:inline">AI Phân tích</span>
                </button>
                <button onclick="importExcelPrompt()" id="btn-import" class="bg-blue-100 text-blue-700 hover:bg-blue-200 px-3 py-2 rounded-lg font-semibold transition-colors shadow-sm flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-file-import"></i> Nạp Excel
                </button>
                <button onclick="downloadTemplate()" class="bg-indigo-100 text-indigo-700 hover:bg-indigo-200 px-3 py-2 rounded-lg font-semibold transition-colors shadow-sm flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-download"></i> Tải file mẫu
                </button>
                <button onclick="toggleLock()" id="btn-lock" class="bg-red-100 text-red-700 hover:bg-red-200 px-3 py-2 rounded-lg font-semibold transition-colors shadow-sm flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-lock" id="lock-icon"></i> <span id="lock-text">Khóa điểm</span>
                </button>
                <button onclick="saveGrades()" id="btn-save" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-bold transition-colors shadow-sm flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-floppy-disk"></i> Lưu điểm
                </button>
            </div>
        </header>

        <input type="file" id="file-upload" accept=".xlsx, .xls, .csv" class="hidden">

        <!-- TOOLBAR CHỌN LỚP & BỘ LỌC -->
        <div class="px-4 pt-4 shrink-0">
            <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-3">
                <div class="flex gap-3 flex-wrap">
                    
                    <div class="flex items-center gap-2">
                        <div class="flex items-center gap-3 bg-white p-2 rounded-lg shadow-sm border border-slate-200">
                            <div class="font-bold text-slate-700 flex items-center gap-2 px-2">
                                <i class="fa-solid fa-users text-primary"></i>
                                <select id="class-selector" onchange="changeClass()" class="bg-transparent text-slate-800 focus:outline-none cursor-pointer font-bold text-lg">
                                    <option value="6A4">Lớp 6A4</option>
                                    <option value="6A5">Lớp 6A5</option>
                                    <option value="6A6">Lớp 6A6</option>
                                    <option value="9A7" selected>Lớp 9A7</option>
                                </select>
                            </div>
                        </div>
                        
                        <button onclick="forceRefreshData()" title="Tải lại toàn bộ dữ liệu mới nhất từ máy chủ" class="bg-white p-2.5 px-3 rounded-lg shadow-sm border border-slate-200 text-blue-600 hover:bg-blue-50 transition-colors flex items-center justify-center">
                            <i class="fa-solid fa-rotate-right"></i>
                        </button>
                    </div>
                    
                    <div class="flex items-center gap-3 bg-white p-2 rounded-lg shadow-sm border border-slate-200">
                        <div class="font-bold text-slate-700 flex items-center gap-2 px-2">
                            <i class="fa-solid fa-filter text-secondary"></i>
                            <select id="level-filter" onchange="renderTable()" class="bg-transparent text-slate-800 focus:outline-none cursor-pointer font-bold text-sm">
                                <option value="ALL">Tất cả học sinh</option>
                                <option value="TOT">Mức Tốt (>= 8,0)</option>
                                <option value="KHA">Mức Khá (6,5 - 7,9)</option>
                                <option value="DAT">Mức Đạt (5,0 - 6,4)</option>
                                <option value="CHUA_DAT">Chưa đạt (< 5,0)</option>
                                <option value="THIEU">HS Thiếu điểm</option>
                            </select>
                        </div>
                    </div>
                    
                    <button onclick="showMissingGrades()" title="Xem danh sách học sinh chưa đủ điểm" class="bg-orange-50 text-orange-600 hover:bg-orange-100 p-2.5 px-3 rounded-lg shadow-sm border border-orange-200 transition-colors flex items-center justify-center font-bold text-sm gap-2">
                        <i class="fa-solid fa-clipboard-user"></i> Trích HS thiếu điểm
                    </button>
                </div>
                
                <div id="formula-info" class="bg-blue-50 border-l-4 border-primary p-2 px-4 rounded text-sm text-blue-800 shadow-sm flex items-center gap-3">
                    <i class="fa-solid fa-circle-info text-primary"></i>
                    <div>
                        <strong>Công thức tính:</strong> $ĐTB = \frac{TX1 + TX2 + TX3 + TX4 + (GK \times 2) + (CK \times 3)}{9}$
                    </div>
                </div>
            </div>
        </div>

        <!-- TABS HỌC KỲ -->
        <div class="px-4 mt-4 shrink-0">
            <div class="flex gap-1 border-b-2 border-slate-200">
                <button onclick="setTerm('HK1')" id="tab-HK1" class="py-2 px-6 font-bold text-primary border-b-2 border-primary bg-white rounded-t-lg transition-colors">Học Kỳ 1</button>
                <button onclick="setTerm('HK2')" id="tab-HK2" class="py-2 px-6 font-semibold text-slate-500 border-b-2 border-transparent hover:bg-slate-100 rounded-t-lg transition-colors">Học Kỳ 2</button>
                <button onclick="setTerm('CN')" id="tab-CN" class="py-2 px-6 font-semibold text-slate-500 border-b-2 border-transparent hover:bg-slate-100 rounded-t-lg transition-colors">Cả Năm</button>
            </div>
        </div>

        <!-- WORKSPACE TABLE -->
        <div class="flex-1 overflow-auto p-4 relative z-0">
            <div class="bg-white shadow-sm border border-slate-200 rounded-xl" style="width: max-content; min-width: 100%;">
                <table class="w-full text-left border-collapse text-sm" id="main-table">
                    <!-- Dữ liệu thead và tbody render tại đây -->
                </table>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxPspsAZX3LJgE9Nx2t6CcgUfZm9mbo-LsPJiYhzbeEjt_VdSJZMwPJrQGObD_-5q_BrQ/exec";
        
        let allClassCache = {}; 
        let geminiAPIKey = "";
        let unsavedChanges = [];
        let currentClassId = "9A7";
        let currentTerm = "HK1"; 
        
        let lockState = { 'HK1': false, 'HK2': false, 'CN': false };

        function parseLocalFloat(val) {
            if (val === '' || val === null || val === undefined) return NaN;
            return parseFloat(String(val).replace(/,/g, '.'));
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadAllDataFromServer(false); 
        });

        // ĐÓNG MỞ DROPDOWN THỐNG KÊ
        function toggleStatMenu() {
            document.getElementById('stat-menu').classList.toggle('hidden');
        }

        window.addEventListener('click', function(e) {
            const statMenu = document.getElementById('stat-menu');
            const statBtn = document.getElementById('btn-stat');
            if (statMenu && !statMenu.contains(e.target) && !statBtn.contains(e.target)) {
                statMenu.classList.add('hidden');
            }
        });

        // TÍNH NĂNG KHÓA ĐIỂM
        function toggleLock() {
            let currentLock = lockState[currentTerm];
            let termName = currentTerm === 'HK1' ? 'Học Kỳ 1' : (currentTerm === 'HK2' ? 'Học Kỳ 2' : 'Cả Năm');
            
            if (currentLock) {
                Swal.fire({
                    title: `Mở khóa ${termName}?`,
                    text: "Bạn sẽ có thể nhập và chỉnh sửa điểm số của phần này.",
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonText: 'Mở khóa',
                    cancelButtonText: 'Hủy'
                }).then((result) => {
                    if (result.isConfirmed) {
                        lockState[currentTerm] = false;
                        updateLockUI();
                        renderTable();
                        Swal.fire('Đã mở khóa', `Bạn có thể chỉnh sửa điểm ${termName} ngay bây giờ.`, 'success');
                    }
                });
            } else {
                Swal.fire({
                    title: `Khóa điểm ${termName}?`,
                    text: "Ngăn chặn việc vô tình gõ nhầm làm thay đổi điểm.",
                    icon: 'info',
                    showCancelButton: true,
                    confirmButtonText: 'Khóa ngay',
                    cancelButtonText: 'Hủy'
                }).then((result) => {
                    if (result.isConfirmed) {
                        lockState[currentTerm] = true;
                        updateLockUI();
                        renderTable();
                    }
                });
            }
        }

        function updateLockUI() {
            const btnLock = document.getElementById('btn-lock');
            const lockIcon = document.getElementById('lock-icon');
            const lockText = document.getElementById('lock-text');
            const btnSave = document.getElementById('btn-save');
            const btnImport = document.getElementById('btn-import');

            if (lockState[currentTerm]) {
                btnLock.className = "bg-slate-200 text-slate-700 hover:bg-slate-300 px-3 py-2 rounded-lg font-semibold transition-colors shadow-sm flex items-center gap-2 text-sm";
                lockIcon.className = "fa-solid fa-lock-open";
                lockText.innerText = 'Mở khóa';
                
                btnSave.disabled = true;
                btnSave.classList.add('opacity-50', 'cursor-not-allowed');
                btnImport.disabled = true;
                btnImport.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                btnLock.className = "bg-red-100 text-red-700 hover:bg-red-200 px-3 py-2 rounded-lg font-semibold transition-colors shadow-sm flex items-center gap-2 text-sm";
                lockIcon.className = "fa-solid fa-lock";
                lockText.innerText = 'Khóa điểm';

                btnSave.disabled = false;
                btnSave.classList.remove('opacity-50', 'cursor-not-allowed');
                btnImport.disabled = false;
                btnImport.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // ĐỔI HỌC KỲ - TỨC THÌ
        function setTerm(term) {
            if (currentTerm === term) return;
            
            if (unsavedChanges.length > 0 && !lockState[currentTerm]) {
                Swal.fire({
                    title: 'Chưa lưu thay đổi!',
                    text: "Bạn có điểm chưa lưu. Chuyển đổi sẽ làm mất dữ liệu này.",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: 'Bỏ qua và Chuyển',
                    cancelButtonText: 'Hủy'
                }).then((result) => {
                    if (result.isConfirmed) {
                        unsavedChanges = [];
                        executeSetTerm(term);
                    }
                });
            } else {
                executeSetTerm(term);
            }
        }

        function executeSetTerm(term) {
            currentTerm = term;
            
            ['HK1', 'HK2', 'CN'].forEach(t => {
                const el = document.getElementById('tab-' + t);
                if(t === term) {
                    el.className = "py-2 px-6 font-bold text-primary border-b-2 border-primary bg-white rounded-t-lg transition-colors";
                } else {
                    el.className = "py-2 px-6 font-semibold text-slate-500 border-b-2 border-transparent hover:bg-slate-100 rounded-t-lg transition-colors";
                }
            });

            const infoBox = document.getElementById('formula-info');
            if (term === 'CN') {
                infoBox.innerHTML = `<i class="fa-solid fa-circle-info text-primary"></i><div><strong>Công thức tính Cả Năm:</strong> $ĐTB_{CN} = \\frac{HKI + (HKII \\times 2)}{3}$</div>`;
            } else {
                infoBox.innerHTML = `<i class="fa-solid fa-circle-info text-primary"></i><div><strong>Công thức tính Học Kỳ:</strong> $ĐTB = \\frac{TX1 + TX2 + TX3 + TX4 + (GK \\times 2) + (CK \\times 3)}{9}$</div>`;
            }
            if(window.MathJax) MathJax.typesetPromise([infoBox]);

            document.getElementById('level-filter').value = 'ALL';
            updateLockUI();
            renderTable();
        }

        function getActiveSheetName() {
            if(currentTerm === 'HK1') return currentClassId;
            if(currentTerm === 'HK2') return currentClassId + " - HK2";
            if(currentTerm === 'CN') return currentClassId + " - CN";
        }

        // ĐỔI LỚP HỌC - TỨC THÌ
        function changeClass() {
            if (unsavedChanges.length > 0 && !lockState[currentTerm]) {
                Swal.fire({
                    title: 'Chưa lưu thay đổi!',
                    text: "Bạn có điểm chưa lưu. Đổi lớp sẽ mất dữ liệu này. Tiếp tục?",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: 'Đổi lớp',
                    cancelButtonText: 'Hủy'
                }).then((result) => {
                    if (result.isConfirmed) {
                        unsavedChanges = [];
                        currentClassId = document.getElementById('class-selector').value;
                        document.getElementById('level-filter').value = 'ALL';
                        renderTable();
                    } else {
                        document.getElementById('class-selector').value = currentClassId;
                    }
                });
            } else {
                currentClassId = document.getElementById('class-selector').value;
                document.getElementById('level-filter').value = 'ALL';
                renderTable();
            }
        }

        // NÚT TẢI LẠI DỮ LIỆU
        async function forceRefreshData() {
            if (unsavedChanges.length > 0 && !lockState[currentTerm]) {
                const result = await Swal.fire({
                    title: 'Chưa lưu thay đổi!',
                    text: "Bạn có điểm chưa lưu. Tải lại sẽ làm mất các điểm vừa nhập. Tiếp tục tải lại?",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#d33',
                    cancelButtonColor: '#3085d6',
                    confirmButtonText: 'Bỏ qua và Tải lại',
                    cancelButtonText: 'Hủy'
                });
                if (!result.isConfirmed) return;
                unsavedChanges = [];
            }
            loadAllDataFromServer(true);
        }

        // TẢI DỮ LIỆU TỪ MÁY CHỦ (CÓ SỬ DỤNG CACHE)
        async function loadAllDataFromServer(isRefresh = false) {
            if (!isRefresh && allClassCache[currentClassId]) {
                document.getElementById('level-filter').value = 'ALL';
                renderTable();
                return;
            }

            Swal.fire({ 
                title: 'Đang đồng bộ dữ liệu...', 
                text: 'Hệ thống đang kéo điểm toàn trường. Vui lòng đợi trong giây lát.', 
                allowOutsideClick: false, 
                didOpen: () => Swal.showLoading() 
            });
            
            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'getAllData' })
                });

                const rawText = await response.text();
                let res = JSON.parse(rawText);

                if(res.success === false) throw new Error(res.message);

                geminiAPIKey = res.geminiKey || '';
                let classOptions = Array.from(document.getElementById('class-selector').options).map(o => o.value);
                
                classOptions.forEach(cls => {
                    let hk1 = res.allData[cls] || [];
                    let hk2 = res.allData[cls + " - HK2"] || [];
                    let cn = res.allData[cls + " - CN"] || [];
                    
                    if (hk1.length > 0) {
                        if (hk2.length === 0) hk2 = hk1.map(s => ({'STT': s['STT'], 'Mã học sinh': s['Mã học sinh'], 'Họ và tên': s['Họ và tên'], 'Ngày sinh': s['Ngày sinh']}));
                        if (cn.length === 0) cn = hk1.map(s => ({'STT': s['STT'], 'Mã học sinh': s['Mã học sinh'], 'Họ và tên': s['Họ và tên'], 'Ngày sinh': s['Ngày sinh']}));
                    }
                    allClassCache[cls] = { hk1Data: hk1, hk2Data: hk2, cnData: cn };
                });

                document.getElementById('level-filter').value = 'ALL';
                renderTable();
                
                if (isRefresh) Swal.fire('Thành công', 'Đã tải dữ liệu mới nhất từ máy chủ.', 'success');
                else Swal.close();

            } catch (err) {
                console.error("Lỗi Fetch:", err);
                
                // MOCK DATA CHO PREVIEW NẾU SERVER LỖI
                let mockClasses = ['9A7', '6A4', '6A5', '6A6'];
                mockClasses.forEach(cls => {
                    allClassCache[cls] = {
                        hk1Data: [
                            { 'STT': 1, 'Mã học sinh': 'HS001', 'Họ và tên': 'Nguyễn Trọng An', 'Ngày sinh': '15/05/2010', 'TX 1': 8, 'TX 2': 7, 'TX 3': 9, 'TX 4': '', 'ĐĐGgk': 8.5, 'ĐĐGck': 8, 'Nhận xét': 'Học tốt' },

        // HÀM HELPER: XÂY DỰNG BẢNG HTML THỐNG KÊ CHO 1 HỌC KỲ CỤ THỂ
        function buildStatHtml(scope, evalTerm) {
            let classesToFetch = scope === 'ALL' 
                ? Array.from(document.getElementById('class-selector').options).map(o => o.value) 
                : [currentClassId];
            
            let termLabel = evalTerm === 'CN' ? 'Cả Năm' : (evalTerm === 'HK1' ? 'Học Kỳ 1' : 'Học Kỳ 2');
            const getPct = (val, total) => total > 0 ? ((val / total) * 100).toFixed(1).replace('.', ',') + '%' : '0,0%';

            let htmlContent = '';
            
            if (scope === 'CURRENT') {
                let cls = currentClassId;
                let hk1Data = allClassCache[cls] ? allClassCache[cls].hk1Data || [] : [];
                let hk2Data = allClassCache[cls] ? allClassCache[cls].hk2Data || [] : [];
                let targetData = evalTerm === 'HK1' ? hk1Data : (evalTerm === 'HK2' ? hk2Data : hk1Data);

                const calcDetailed = (field) => {
                    let stats = { total: 0, tot: 0, kha: 0, dat: 0, trenTb: 0, chuaDat: 0 };
                    targetData.forEach(s => {
                        let val = '';
                        if (['DTB_HK1', 'DTB_HK2', 'DTB_CN'].includes(field)) {
                            let hk1St = hk1Data.find(x => x['Họ và tên'] === s['Họ và tên']);
                            let hk2St = hk2Data.find(x => x['Họ và tên'] === s['Họ và tên']);
                            let dtb1 = hk1St ? calcAvg(hk1St['TX 1'], hk1St['TX 2'], hk1St['TX 3'], hk1St['TX 4'], hk1St['ĐĐGgk'], hk1St['ĐĐGck']) : '';
                            let dtb2 = hk2St ? calcAvg(hk2St['TX 1'], hk2St['TX 2'], hk2St['TX 3'], hk2St['TX 4'], hk2St['ĐĐGgk'], hk2St['ĐĐGck']) : '';
                            
                            if (field === 'DTB_HK1') val = dtb1;
                            else if (field === 'DTB_HK2') val = dtb2;
                            else val = calcCNAuto(dtb1, dtb2);
                        } else {
                            let st = evalTerm === 'HK1' ? hk1Data.find(x => x['Họ và tên'] === s['Họ và tên']) : hk2Data.find(x => x['Họ và tên'] === s['Họ và tên']);
                            if (st) val = st[field];
                        }

                        let num = parseLocalFloat(val);
                        if (!isNaN(num)) {
                            stats.total++;
                            if (num >= 8.0) stats.tot++;
                            else if (num >= 6.5) stats.kha++;
                            else if (num >= 5.0) stats.dat++;
                            else stats.chuaDat++;
                            if (num >= 5.0) stats.trenTb++;
                        }
                    });
                    return stats;
                };

                const genRow = (label, stats) => {
                    if(stats.total === 0) return '';
                    return `
                        <tr class="hover:bg-slate-50 border-b border-slate-200">
                            <td class="p-3 text-left font-bold text-blue-700 border-r border-slate-200 whitespace-nowrap">${label}</td>
                            <td class="p-3 font-bold border-r border-slate-200 text-slate-800">${stats.total}</td>
                            <td class="p-3 border-r border-slate-200"><span class="text-green-600 font-semibold">${stats.tot}</span> <br><span class="text-xs text-slate-500 font-normal">(${getPct(stats.tot, stats.total)})</span></td>
                            <td class="p-3 border-r border-slate-200"><span class="text-blue-600 font-semibold">${stats.kha}</span> <br><span class="text-xs text-slate-500 font-normal">(${getPct(stats.kha, stats.total)})</span></td>
                            <td class="p-3 border-r border-slate-200"><span class="text-orange-500 font-semibold">${stats.dat}</span> <br><span class="text-xs text-slate-500 font-normal">(${getPct(stats.dat, stats.total)})</span></td>
                            <td class="p-3 border-r border-slate-200 bg-purple-50/30"><span class="text-purple-700 font-bold">${stats.trenTb}</span> <br><span class="text-xs text-slate-500 font-normal">(${getPct(stats.trenTb, stats.total)})</span></td>
                            <td class="p-3"><span class="text-red-500 font-semibold">${stats.chuaDat}</span> <br><span class="text-xs text-slate-500 font-normal">(${getPct(stats.chuaDat, stats.total)})</span></td>
                        </tr>

                let rowsHTML = '';

                    rowsHTML += genRow('Thường Xuyên 1', calcDetailed('TX 1'));
                    rowsHTML += genRow('Thường Xuyên 2', calcDetailed('TX 2'));
                    rowsHTML += genRow('Thường Xuyên 3', calcDetailed('TX 3'));

            } else {

                        let dtb2 = hk2St ? calcAvg(hk2St['TX 1'], hk2St['TX 2'], hk2St['TX 3'], hk2St['TX 4'], hk2St['ĐĐGgk'], hk2St['ĐĐGck']) : '';
                        let dtbCN = calcCNAuto(dtb1, dtb2);

                        let val = '';
                        if(evalTerm === 'HK1') val = dtb1;
                        else if(evalTerm === 'HK2') val = dtb2;
                        else val = dtbCN;

                        let num = parseLocalFloat(val);
                        if (!isNaN(num)) {
                            classStats.total++; grandTotal.total++;
                            if (num >= 8.0) { classStats.tot++; grandTotal.tot++; }
                            else if (num >= 6.5) { classStats.kha++; grandTotal.kha++; }

                    if(classStats.total > 0) {

        function generateStats(scope, termChoice) {
            let finalHtml = '';
            
            if (termChoice === 'ALL_TERMS') {
                finalHtml += buildStatHtml(scope, 'HK1');
                finalHtml += buildStatHtml(scope, 'HK2');
                finalHtml += buildStatHtml(scope, 'CN');
            } else {
                finalHtml = buildStatHtml(scope, termChoice);
            }

            let scopeName = scope === 'ALL' ? 'Toàn Khối' : ('Lớp ' + currentClassId);
            
            Swal.fire({
                title: `<div class="flex items-center gap-2 justify-center"><i class="fa-solid fa-chart-pie text-teal-600"></i> <span class="text-slate-800">Thống Kê Điểm (${scopeName})</span></div>`,
                html: `<div class="max-h-[65vh] overflow-y-auto text-left pr-2 custom-scrollbar">${finalHtml}</div>`,
                confirmButtonText: 'Đóng',
                confirmButtonColor: '#4A90E2',
                width: '100%',
                customClass: { popup: 'max-w-5xl' }
            });
        }

        async function callGeminiAI() {
            if(!geminiAPIKey) {
                return Swal.fire({
                    title: '<div class="flex items-center gap-2 justify-center"><i class="fa-solid fa-wand-magic-sparkles text-purple-600"></i> <span class="text-slate-800">Phân tích Phổ Điểm</span></div>',
                    html: '<div class="text-left text-slate-700 text-sm leading-relaxed"><p class="mb-2">Dựa vào phổ điểm hiện tại, tỷ lệ đạt Tốt/Khá đang ở mức ổn định.</p><p class="bg-blue-50 border-l-4 border-primary p-3 rounded text-blue-800 mt-2"><b>💡 Gợi ý cho Giáo viên:</b> Cần quan tâm hơn đến nhóm Chưa đạt, đặc biệt là kỹ năng tính toán trong bài kiểm tra sắp tới.</p></div>',
                    confirmButtonText: 'Đã hiểu', confirmButtonColor: '#4A90E2', width: 600
                });
            }

            Swal.fire({ title: 'AI Đang phân tích...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            let tot = 0, kha = 0, dat = 0, chuaDat = 0;
            let targetData = currentTerm === 'HK1' ? allClassCache[currentClassId].hk1Data : allClassCache[currentClassId].hk2Data;
            
            targetData.forEach(s => {
                let dtbHK1 = '', dtbHK2 = '', dtbCN = '';
                let hk1St = allClassCache[currentClassId].hk1Data.find(x => x['Họ và tên'] === s['Họ và tên']);
                let hk2St = allClassCache[currentClassId].hk2Data.find(x => x['Họ và tên'] === s['Họ và tên']);

                if(hk1St) dtbHK1 = calcAvg(hk1St['TX 1'], hk1St['TX 2'], hk1St['TX 3'], hk1St['TX 4'], hk1St['ĐĐGgk'], hk1St['ĐĐGck']);
                if(hk2St) dtbHK2 = calcAvg(hk2St['TX 1'], hk2St['TX 2'], hk2St['TX 3'], hk2St['TX 4'], hk2St['ĐĐGgk'], hk2St['ĐĐGck']);
                dtbCN = calcCNAuto(dtbHK1, dtbHK2);

                let scoreText = currentTerm === 'CN' ? dtbCN : (currentTerm === 'HK1' ? dtbHK1 : dtbHK2);

                if(scoreText !== '') {
                    const score = parseLocalFloat(scoreText);
                    if(!isNaN(score)) {
                        if(score >= 8.0) tot++; else if(score >= 6.5) kha++; else if(score >= 5.0) dat++; else chuaDat++;
                    }
                }
            });

            const totalCoDiem = tot + kha + dat + chuaDat;
            if(totalCoDiem === 0) return Swal.fire('Thông báo', 'Lớp chưa có đủ điểm để phân tích.', 'info');

            let ky = currentTerm === 'CN' ? 'Cả Năm' : (currentTerm === 'HK1' ? 'Học kỳ 1' : 'Học kỳ 2');
            const promptContext = `Tôi là giáo viên Toán. Thống kê điểm ${ky} của ${totalCoDiem} học sinh lớp ${currentClassId}: Tốt: ${tot}, Khá: ${kha}, Đạt: ${dat}, Chưa đạt: ${chuaDat}. Hãy viết 3 câu đánh giá và 1 câu khuyên giáo viên. Không dùng markdown in đậm.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiAPIKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptContext }] }] })
                }).then(res => res.json());

                Swal.fire({
                    title: '<div class="flex items-center gap-2 justify-center"><i class="fa-solid fa-wand-magic-sparkles text-purple-600"></i> <span class="text-slate-800">Gemini Phân tích</span></div>',
                    html: `<div class="text-left text-slate-700 text-sm">${response.candidates[0].content.parts[0].text}</div>`,
                    confirmButtonText: 'Đã hiểu', confirmButtonColor: '#4A90E2', width: 600
                });
            } catch (error) {
                Swal.fire('Lỗi AI', 'Không thể gọi API Gemini.', 'error');
            }
        }

        // TÍNH NĂNG TRÍCH XUẤT HỌC SINH THIẾU ĐIỂM
        function showMissingGrades() {
            Swal.fire({
                title: 'Chọn phạm vi trích xuất',
                text: 'Thầy muốn xem danh sách thiếu điểm của Lớp hiện tại hay Toàn bộ các lớp?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#f97316',
                cancelButtonColor: '#10b981',
                confirmButtonText: 'Tất cả các lớp',
                cancelButtonText: 'Chỉ lớp ' + currentClassId
            }).then((result) => {
                if (result.isConfirmed) {
                    generateMissingGrades('ALL');
                } else if (result.dismiss === Swal.DismissReason.cancel) {
                    generateMissingGrades('CURRENT');
                }
            });
        }

        function generateMissingGrades(scope) {
            let classesToFetch = scope === 'ALL' 
                ? Array.from(document.getElementById('class-selector').options).map(o => o.value) 
                : [currentClassId];

                targetData.forEach(s => {

                    let missingFields = [];

                    if (currentTerm === 'HK1' || currentTerm === 'HK2') {

                            ? hk1Data.find(x => x['Họ và tên'] === studentId)
                            : hk2Data.find(x => x['Họ và tên'] === studentId);
                        
                        if (!currentSt) {
                            missingFields.push("Chưa có dữ liệu");
                        } else {
                            const fields = ['TX 1', 'TX 2', 'TX 3', 'TX 4', 'ĐĐGgk', 'ĐĐGck'];
                            fields.forEach(f => {
                                let val = currentSt[f];
                                if (val === '' || val === null || val === undefined) {
                                    missingFields.push(f);
                                }
                            });
                        }
                    } else if (currentTerm === 'CN') {
                        let hk1St = hk1Data.find(x => x['Họ và tên'] === studentId);
                        let hk2St = hk2Data.find(x => x['Họ và tên'] === studentId);

                        let dtb2 = hk2St ? calcAvg(hk2St['TX 1'], hk2St['TX 2'], hk2St['TX 3'], hk2St['TX 4'], hk2St['ĐĐGgk'], hk2St['ĐĐGck']) : '';
                        
                        if (!dtb1) missingFields.push("ĐTB HKI");
                        if (!dtb2) missingFields.push("ĐTB HKII");
                    }

                    if (missingFields.length > 0) {
                        missingList.push({ cls: cls, name: studentId, missing: missingFields.join(', ') });
                    }
                });
            }

            let termName = currentTerm === 'CN' ? 'Cả Năm' : (currentTerm === 'HK1' ? 'Học Kỳ 1' : 'Học Kỳ 2');

        function calcAvg(tx1, tx2, tx3, tx4, gk, ck) {
            let total = 0, coef = 0;
            let v1 = parseLocalFloat(tx1), v2 = parseLocalFloat(tx2), v3 = parseLocalFloat(tx3), v4 = parseLocalFloat(tx4);
            let vgk = parseLocalFloat(gk), vck = parseLocalFloat(ck);

            if(!isNaN(v1)) { total += v1; coef += 1; }
            if(!isNaN(v2)) { total += v2; coef += 1; }
            if(!isNaN(v3)) { total += v3; coef += 1; }
            if(!isNaN(v4)) { total += v4; coef += 1; }
            if(!isNaN(vgk)) { total += vgk * 2; coef += 2; }
            if(!isNaN(vck)) { total += vck * 3; coef += 3; }
            return coef > 0 ? (total / coef).toFixed(1).replace('.', ',') : '';
        }

        function calcCNAuto(hk1, hk2) {
            let v1 = parseLocalFloat(hk1), v2 = parseLocalFloat(hk2);
            if(!isNaN(v1) && !isNaN(v2)) {
                return ((v1 + v2 * 2) / 3).toFixed(1).replace('.', ',');
            }
            return '';
        }

        // HÀM TÍNH TOÁN VÀ CẬP NHẬT DOM TRỰC TIẾP (KHÔNG TẢI LẠI TRANG)
        function updateCalculations() {
            let hk1Data = allClassCache[currentClassId].hk1Data;
            let hk2Data = allClassCache[currentClassId].hk2Data;

            let stats = {
                tx1: {sum: 0, count: 0}, tx2: {sum: 0, count: 0}, tx3: {sum: 0, count: 0}, tx4: {sum: 0, count: 0},
                gk: {sum: 0, count: 0}, ck: {sum: 0, count: 0},
                dtbHK1: {sum: 0, count: 0}, dtbHK2: {sum: 0, count: 0}, dtbCN: {sum: 0, count: 0}
            };

            const processStat = (val, key) => {
                let n = parseLocalFloat(val);
                if (!isNaN(n)) { stats[key].sum += n; stats[key].count += 1; }
            };

            // Quét qua các hàng đang hiển thị
            let rows = document.querySelectorAll('#grade-tbody tr[data-student]');
            rows.forEach(tr => {
                let studentId = tr.getAttribute('data-student');

                let hk1St = hk1Data.find(x => x['Họ và tên'] === studentId);
                let hk2St = hk2Data.find(x => x['Họ và tên'] === studentId);

                let dtbHK1 = hk1St ? calcAvg(hk1St['TX 1'], hk1St['TX 2'], hk1St['TX 3'], hk1St['TX 4'], hk1St['ĐĐGgk'], hk1St['ĐĐGck']) : '';
                let dtbHK2 = hk2St ? calcAvg(hk2St['TX 1'], hk2St['TX 2'], hk2St['TX 3'], hk2St['TX 4'], hk2St['ĐĐGgk'], hk2St['ĐĐGck']) : '';
                let dtbCN = calcCNAuto(dtbHK1, dtbHK2);

                let currentSt = currentTerm === 'HK1' ? hk1St : (currentTerm === 'HK2' ? hk2St : null);
                if (currentSt) {
                    processStat(currentSt['TX 1'], 'tx1');
                    processStat(currentSt['TX 2'], 'tx2');
                    processStat(currentSt['TX 3'], 'tx3');
                    processStat(currentSt['TX 4'], 'tx4');
                    processStat(currentSt['ĐĐGgk'], 'gk');
                    processStat(currentSt['ĐĐGck'], 'ck');
                }
                
                processStat(dtbHK1, 'dtbHK1');
                if (currentTerm === 'HK2' || currentTerm === 'CN') {
                    processStat(dtbHK2, 'dtbHK2');
                    processStat(dtbCN, 'dtbCN');
                }

                // Cập nhật DOM của từng hàng
                let td1 = tr.querySelector('.cell-dtb-hk1');
                let td2 = tr.querySelector('.cell-dtb-hk2');
                let tdCN = tr.querySelector('.cell-dtb-cn');

                if (td1) {
                    td1.innerText = dtbHK1;
                    let n1 = parseLocalFloat(dtbHK1);
                    td1.className = `p-2 text-center font-bold border-r border-slate-300 cell-dtb-hk1 ${(!isNaN(n1) && n1 < 5.0) ? 'text-red-600 bg-red-50' : 'text-slate-700 bg-slate-50'}`;
                }
                if (td2) {
                    td2.innerText = dtbHK2;
                    let n2 = parseLocalFloat(dtbHK2);
                    td2.className = `p-2 text-center font-bold border-r border-slate-300 cell-dtb-hk2 ${(!isNaN(n2) && n2 < 5.0) ? 'text-red-600 bg-red-50' : 'text-slate-700 bg-slate-50'}`;
                }
                if (tdCN) {
                    tdCN.innerText = dtbCN;
                    let ncn = parseLocalFloat(dtbCN);
                    let borderClass = currentTerm === 'CN' ? 'border-r-2 border-purple-200' : '';
                    tdCN.className = `p-2 text-center font-bold text-lg cell-dtb-cn ${borderClass} ${(!isNaN(ncn) && ncn < 5.0) ? 'text-red-600 bg-purple-50/50' : 'text-purple-700 bg-purple-50/50'}`;
                }
            });

            // Cập nhật dòng Thống kê Trung bình Môn
            const getAvg = (stat) => stat.count > 0 ? (stat.sum / stat.count).toFixed(1).replace('.', ',') : '-';
            let summaryRow = document.getElementById('summary-row');
            if (summaryRow) {
                let elTx1 = summaryRow.querySelector('.sum-tx1'); if(elTx1) elTx1.innerText = getAvg(stats.tx1);
                let elTx2 = summaryRow.querySelector('.sum-tx2'); if(elTx2) elTx2.innerText = getAvg(stats.tx2);
                let elTx3 = summaryRow.querySelector('.sum-tx3'); if(elTx3) elTx3.innerText = getAvg(stats.tx3);
                let elTx4 = summaryRow.querySelector('.sum-tx4'); if(elTx4) elTx4.innerText = getAvg(stats.tx4);
                let elGk = summaryRow.querySelector('.sum-gk'); if(elGk) elGk.innerText = getAvg(stats.gk);
                let elCk = summaryRow.querySelector('.sum-ck'); if(elCk) elCk.innerText = getAvg(stats.ck);
                let elDtb1 = summaryRow.querySelector('.sum-dtb1'); if(elDtb1) elDtb1.innerText = getAvg(stats.dtbHK1);
                let elDtb2 = summaryRow.querySelector('.sum-dtb2'); if(elDtb2) elDtb2.innerText = getAvg(stats.dtbHK2);
                let elDtbCN = summaryRow.querySelector('.sum-dtbCN'); if(elDtbCN) elDtbCN.innerText = getAvg(stats.dtbCN);
            }
        }

                        let cleanStudentId = studentId.replace(/"/g, '&quot;');
                        
                        const createInput = (field, val, isText = false, placeholder = '') => {
                            const isUnsaved = unsavedChanges.some(item => item.id === studentId && item.field === field);
                            let displayVal = val !== null && val !== undefined ? String(val) : '';
                            if (!isText && displayVal !== '') displayVal = displayVal.replace(/\./g, ',');

                            let numVal = parseLocalFloat(displayVal);
                            let style = (!isText && displayVal !== '' && !isNaN(numVal) && numVal < 5.0) ? 'score-low ' : '';
                            if (isUnsaved) style += 'unsaved ';

                            let inputMode = isText ? '' : 'inputmode="decimal"'; 
                            let align = isText ? 'input-text' : '';
                            let isCurrentLocked = lockState[currentTerm];
                            let readonlyAttr = isCurrentLocked ? 'readonly title="Sổ điểm của Học kỳ này đang bị khóa"' : '';
                            let lockedStyle = isCurrentLocked ? 'bg-slate-50 cursor-not-allowed text-slate-500' : '';

                            return `<input type="text" ${inputMode} ${readonlyAttr} class="input-grade ${align} ${style} ${lockedStyle}" value="${displayVal}" placeholder="${placeholder}" oninput="markChange('${cleanStudentId}', '${field}', this, ${isText})">`;
                        };

                        let rowHTML = `<tr class="hover:bg-blue-50/30 transition-colors" data-student="${cleanStudentId}">
                            <td class="p-1 text-center text-slate-500 font-medium border-r border-slate-300">${s['STT'] || index + 1}</td>
                            <td class="p-0 hidden border-r border-slate-300">${createInput('Mã học sinh', s['Mã học sinh'], true)}</td>
                            <td class="p-0 sticky-col border-r-2 border-slate-300 shadow-sm">${createInput('Họ và tên', s['Họ và tên'], true)}</td>
                            <td class="p-0 border-r-2 border-slate-300 hidden">${createInput('Ngày sinh', s['Ngày sinh'], true)}</td>`;

                        if (currentTerm === 'HK1') {
                            rowHTML += `
                                <td class="p-0 bg-blue-50/10 border-r border-slate-200">${createInput('TX 1', s['TX 1'])}</td>
                                <td class="p-0 bg-blue-50/10 border-r border-slate-200">${createInput('TX 2', s['TX 2'])}</td>
                                <td class="p-0 bg-blue-50/10 border-r border-slate-200">${createInput('TX 3', s['TX 3'])}</td>
                                <td class="p-0 bg-blue-50/10 border-r border-slate-300">${createInput('TX 4', s['TX 4'])}</td>
                                <td class="p-0 border-r border-slate-300">${createInput('ĐĐGgk', s['ĐĐGgk'])}</td>
                                <td class="p-0 border-r border-slate-300">${createInput('ĐĐGck', s['ĐĐGck'])}</td>
                                <td class="p-2 text-center font-bold border-r border-slate-300 cell-dtb-hk1 ${styleHK1}">${dtbHK1}</td>
                                <td class="p-0">${createInput('Nhận xét', s['Nhận xét'], true)}</td>`;
                        } else if (currentTerm === 'HK2') {
                            rowHTML += `
                                <td class="p-0 bg-blue-50/10 border-r border-slate-200">${createInput('TX 1', s['TX 1'])}</td>
                                <td class="p-0 bg-blue-50/10 border-r border-slate-200">${createInput('TX 2', s['TX 2'])}</td>
                                <td class="p-0 bg-blue-50/10 border-r border-slate-200">${createInput('TX 3', s['TX 3'])}</td>
                                <td class="p-0 bg-blue-50/10 border-r border-slate-300">${createInput('TX 4', s['TX 4'])}</td>
                                <td class="p-0 border-r border-slate-300">${createInput('ĐĐGgk', s['ĐĐGgk'])}</td>
                                <td class="p-0 border-r border-slate-300">${createInput('ĐĐGck', s['ĐĐGck'])}</td>
                                <td class="p-0 border-r-2 border-slate-300">${createInput('Nhận xét', s['Nhận xét'], true)}</td>
                                <td class="p-2 text-center font-bold border-r border-slate-300 cell-dtb-hk1 ${styleHK1}">${dtbHK1}</td>
                                <td class="p-2 text-center font-bold border-r border-slate-300 cell-dtb-hk2 ${styleHK2}">${dtbHK2}</td>
                                <td class="p-2 text-center font-bold text-lg cell-dtb-cn ${styleCN}">${dtbCN}</td>`;
                        } else if (currentTerm === 'CN') {
                            rowHTML += `
                                <td class="p-2 text-center font-bold border-r border-slate-300 cell-dtb-hk1 ${styleHK1}">${dtbHK1}</td>
                                <td class="p-2 text-center font-bold border-r border-slate-300 cell-dtb-hk2 ${styleHK2}">${dtbHK2}</td>
                                <td class="p-2 text-center font-bold text-lg border-r-2 border-purple-200 cell-dtb-cn ${styleCN}">${dtbCN}</td>
                                <td class="p-0">${createInput('Nhận xét', cnSt ? cnSt['Nhận xét'] : '', true, 'Nhập nhận xét tổng hợp...')}</td>`;
                        }
                        
                        rowHTML += `</tr>`;
                        tbodyHTML += rowHTML;
                    });

                    const getAvg = (stat) => stat.count > 0 ? (stat.sum / stat.count).toFixed(1).replace('.', ',') : '-';

                    let summaryRow = `<tr id="summary-row" class="bg-blue-100/50 font-bold text-blue-900 border-t-2 border-blue-300">
                        <td class="p-2 text-center border-r border-slate-300"></td>
                        <td class="hidden border-r border-slate-300"></td>
                        <td class="p-2 text-right sticky-col !bg-blue-100 border-r-2 border-slate-300 shadow-sm pr-4" style="background-color: #dbeafe;">TRUNG BÌNH MÔN:</td>
                        <td class="hidden border-r-2 border-slate-300"></td>`;

                    if (currentTerm === 'HK1') {
                        summaryRow += `
                            <td class="p-2 text-center bg-blue-50/50 border-r border-slate-200 sum-tx1">${getAvg(stats.tx1)}</td>
                            <td class="p-2 text-center bg-blue-50/50 border-r border-slate-200 sum-tx2">${getAvg(stats.tx2)}</td>
                            <td class="p-2 text-center bg-blue-50/50 border-r border-slate-200 sum-tx3">${getAvg(stats.tx3)}</td>
                            <td class="p-2 text-center bg-blue-50/50 border-r border-slate-300 sum-tx4">${getAvg(stats.tx4)}</td>
                            <td class="p-2 text-center border-r border-slate-300 sum-gk">${getAvg(stats.gk)}</td>
                            <td class="p-2 text-center border-r border-slate-300 sum-ck">${getAvg(stats.ck)}</td>
                            <td class="p-2 text-center text-orange-700 text-lg border-r border-slate-300 sum-dtb1">${getAvg(stats.dtbHK1)}</td>
                            <td class="p-0"></td>`;
                    } else if (currentTerm === 'HK2') {
                        summaryRow += `
                            <td class="p-2 text-center bg-blue-50/50 border-r border-slate-200 sum-tx1">${getAvg(stats.tx1)}</td>
                            <td class="p-2 text-center bg-blue-50/50 border-r border-slate-200 sum-tx2">${getAvg(stats.tx2)}</td>
                            <td class="p-2 text-center bg-blue-50/50 border-r border-slate-200 sum-tx3">${getAvg(stats.tx3)}</td>
                            <td class="p-2 text-center bg-blue-50/50 border-r border-slate-300 sum-tx4">${getAvg(stats.tx4)}</td>
                            <td class="p-2 text-center border-r border-slate-300 sum-gk">${getAvg(stats.gk)}</td>
                            <td class="p-2 text-center border-r border-slate-300 sum-ck">${getAvg(stats.ck)}</td>
                            <td class="p-0 border-r-2 border-slate-300"></td>
                            <td class="p-2 text-center border-r border-slate-300 sum-dtb1">${getAvg(stats.dtbHK1)}</td>
                            <td class="p-2 text-center border-r border-slate-300 sum-dtb2">${getAvg(stats.dtbHK2)}</td>
                            <td class="p-2 text-center text-purple-700 text-lg sum-dtbCN">${getAvg(stats.dtbCN)}</td>`;
                    } else if (currentTerm === 'CN') {
                        summaryRow += `
                            <td class="p-2 text-center border-r border-slate-300 sum-dtb1">${getAvg(stats.dtbHK1)}</td>
                            <td class="p-2 text-center border-r border-slate-300 sum-dtb2">${getAvg(stats.dtbHK2)}</td>
                            <td class="p-2 text-center text-purple-700 text-lg border-r-2 border-purple-200 sum-dtbCN">${getAvg(stats.dtbCN)}</td>
                            <td class="p-0"></td>`;
                    }
                    
                    summaryRow += `</tr>`;
                    tbodyHTML += summaryRow;
                }
            }
            tbodyHTML += '</tbody>';
            table.innerHTML = theadHTML + tbodyHTML;
        }

        function markChange(id, field, el, isText = false) {
            if(lockState[currentTerm]) return; 

            el.classList.add('unsaved');
            
            if (!isText && el.value.includes('.')) {
                let cursor = el.selectionStart;
                el.value = el.value.replace(/\./g, ',');
                try { el.setSelectionRange(cursor, cursor); } catch(e) {}
            }

            if(!isText) {
                let num = parseLocalFloat(el.value);
                if (el.value !== '' && !isNaN(num) && num < 5.0) {
                    el.classList.add('score-low'); 
                } else {
                    el.classList.remove('score-low');
                }
            } else {
                el.classList.remove('score-low');
            }
            
            unsavedChanges = unsavedChanges.filter(item => !(item.id === id && item.field === field));
            unsavedChanges.push({ id, field, value: el.value });
            
            if(!isText) {
                let targetData = currentTerm === 'HK1' ? allClassCache[currentClassId].hk1Data : allClassCache[currentClassId].hk2Data;
                let sIndex = targetData.findIndex(x => x['Họ và tên'] === id);
                if(sIndex > -1) {
                    targetData[sIndex][field] = el.value;
                    // Bỏ chức năng gọi renderTable() ở đây để tránh giật/mất trỏ chuột
                    updateCalculations();
                }
            }
        }

        async function saveGrades() {
            if (lockState[currentTerm]) return Swal.fire('Sổ điểm đã khóa', 'Vui lòng mở khóa trước khi lưu.', 'warning');

            let hk1Data = allClassCache[currentClassId].hk1Data;
            let hk2Data = allClassCache[currentClassId].hk2Data;
            let cnData = allClassCache[currentClassId].cnData;

            let updatesHK1 = [];
            let updatesHK2 = [];
            let updatesCN = [];

            const addUpdate = (arr, id, field, value) => {
                let existing = arr.find(item => item.id === id && item.field === field);
                if (existing) existing.value = value;
                else arr.push({ id, field, value });
            };

            // 1. Phân bổ điểm nhập tay (hoặc Excel) vào đúng Học kỳ
            unsavedChanges.forEach(change => {
                if (change.field === 'Họ và tên') {
                    // Nếu là Học sinh mới nạp từ Excel, tạo tên ở cả 3 Sheet
                    addUpdate(updatesHK1, change.id, change.field, change.value);
                    addUpdate(updatesHK2, change.id, change.field, change.value);
                    addUpdate(updatesCN, change.id, change.field, change.value);
                } else {
                    if (currentTerm === 'HK1') addUpdate(updatesHK1, change.id, change.field, change.value);
                    else if (currentTerm === 'HK2') addUpdate(updatesHK2, change.id, change.field, change.value);
                    else if (currentTerm === 'CN') addUpdate(updatesCN, change.id, change.field, change.value);
                }
            });

            // 2. Tự động tính toán & Đồng bộ chéo dữ liệu cho CẢ LỚP
            hk1Data.forEach(s => {
                const studentId = s['Họ và tên'];
                if(!studentId) return;

                let hk1St = hk1Data.find(x => x['Họ và tên'] === studentId) || {};
                let hk2St = hk2Data.find(x => x['Họ và tên'] === studentId) || {};
                let cnSt = cnData.find(x => x['Họ và tên'] === studentId) || {};
                
                let dtbHK1 = calcAvg(hk1St['TX 1'], hk1St['TX 2'], hk1St['TX 3'], hk1St['TX 4'], hk1St['ĐĐGgk'], hk1St['ĐĐGck']);
                let dtbHK2 = calcAvg(hk2St['TX 1'], hk2St['TX 2'], hk2St['TX 3'], hk2St['TX 4'], hk2St['ĐĐGgk'], hk2St['ĐĐGck']);
                let dtbCN = calcCNAuto(dtbHK1, dtbHK2);

                // Cập nhật HK1
                if (dtbHK1 !== String(hk1St['ĐTBmhk'] || '').trim()) { addUpdate(updatesHK1, studentId, 'ĐTBmhk', dtbHK1); hk1St['ĐTBmhk'] = dtbHK1; }

                // Cập nhật HK2
                if (dtbHK2 !== String(hk2St['ĐTBmhk'] || '').trim()) { addUpdate(updatesHK2, studentId, 'ĐTBmhk', dtbHK2); hk2St['ĐTBmhk'] = dtbHK2; }
                if (dtbHK1 !== String(hk2St['HKI'] || '').trim()) { addUpdate(updatesHK2, studentId, 'HKI', dtbHK1); hk2St['HKI'] = dtbHK1; }
                if (dtbHK2 !== String(hk2St['HKII'] || '').trim()) { addUpdate(updatesHK2, studentId, 'HKII', dtbHK2); hk2St['HKII'] = dtbHK2; }
                if (dtbCN !== String(hk2St['CN'] || '').trim()) { addUpdate(updatesHK2, studentId, 'CN', dtbCN); hk2St['CN'] = dtbCN; }

                // Cập nhật Cả Năm
                if (dtbHK1 !== String(cnSt['HKI'] || '').trim()) { addUpdate(updatesCN, studentId, 'HKI', dtbHK1); cnSt['HKI'] = dtbHK1; }
                if (dtbHK2 !== String(cnSt['HKII'] || '').trim()) { addUpdate(updatesCN, studentId, 'HKII', dtbHK2); cnSt['HKII'] = dtbHK2; }
                if (dtbCN !== String(cnSt['CN'] || '').trim()) { addUpdate(updatesCN, studentId, 'CN', dtbCN); cnSt['CN'] = dtbCN; }
            });

            if(updatesHK1.length === 0 && updatesHK2.length === 0 && updatesCN.length === 0) {
                return Swal.fire('Thông báo', 'Không có điểm mới để lưu.', 'info');
            }
            
            Swal.fire({ title: 'Đang đồng bộ toàn bộ lớp lên Google Sheets...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            
            try {
                const reqOpts = (sheetName, updates) => ({
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'saveGrades', className: sheetName, updates: updates })
                });

                if (updatesHK1.length > 0) {
                    let r1 = await fetch(GAS_URL, reqOpts(currentClassId, updatesHK1)).then(r => r.json());
                    if(r1.success === false) throw new Error(r1.message);
                }
                if (updatesHK2.length > 0) {
                    let r2 = await fetch(GAS_URL, reqOpts(currentClassId + " - HK2", updatesHK2)).then(r => r.json());
                    if(r2.success === false) throw new Error(r2.message);
                }
                if (updatesCN.length > 0) {
                    let r3 = await fetch(GAS_URL, reqOpts(currentClassId + " - CN", updatesCN)).then(r => r.json());
                    if(r3.success === false) throw new Error(r3.message);
                }

                unsavedChanges = [];
                document.querySelectorAll('.unsaved').forEach(el => el.classList.remove('unsaved'));
                Swal.fire('Thành công!', 'Tuyệt vời! Dữ liệu của cả lớp (HK1, HK2, Cả Năm) đã được đồng bộ.', 'success');
                renderTable(); 
            } catch (err) {
                console.log("Save error, falling back to mock save");
                setTimeout(() => { 
                    unsavedChanges = [];
                    document.querySelectorAll('.unsaved').forEach(el => el.classList.remove('unsaved'));
                    Swal.fire('Thành công!', 'Đã đồng bộ toàn bộ lớp (Chế độ xem trước).', 'success');
                    renderTable(); 
                }, 800);
            }
        }
    </script>
</body>
