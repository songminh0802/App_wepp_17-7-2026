    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Cấu hình Firebase FireStore của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyC-8kCyIv8n7jB-GiKXGeWllpXtoBNPKzA",
            authDomain: "cuongcsdl.firebaseapp.com",
            databaseURL: "https://cuongcsdl-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "cuongcsdl",
            storageBucket: "cuongcsdl.firebasestorage.app",
            messagingSenderId: "510371041821",
            appId: "1:510371041821:web:b37e8534f4f1132df62cf4"
        };

        // Khởi tạo app và kết nối CSDL
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Hàm gọi dữ liệu từ collection 'baiviet'
        window.fetchPosts = async function(targetView = 'home', targetParams = null) {
            try {
                const querySnapshot = await getDocs(collection(db, "baiviet"));
                const posts = [];
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    posts.push({
                        id: doc.id, // Sử dụng ID trực tiếp của Document trên FireStore
                        title: data.title || "Chưa có tiêu đề",
                        excerpt: data.excerpt || "Chưa có mô tả",
                        thumbnail: data.thumbnail || "https://placehold.co/600x400/e0f2fe/0369a1?text=KienThucBlog",
                        date: data.date || new Date().toLocaleDateString('vi-VN'),
                        category: data.category || "Chưa phân loại",
                        tags: data.tags || [],
                        content: data.content || "<p>Nội dung đang được cập nhật...</p>"
                    });
                });
                
                // Lưu vào biến toàn cục và render giao diện
                window.postsData = posts;
                if (window.initializeBlog) {
                    window.initializeBlog(targetView, targetParams);
                }
            } catch (error) {
                console.error("Lỗi khi tải dữ liệu từ Firestore:", error);
                document.getElementById('app').innerHTML = `
                    <div class="text-center py-20 text-red-500 font-medium">
                        Không thể kết nối đến cơ sở dữ liệu. Vui lòng kiểm tra lại quyền truy cập (Firestore Rules).
                    </div>`;
            }
        }

        // Hàm thêm bài viết mới vào Firebase
        window.addNewPostToDb = async function(postData) {
            try {
                const docRef = await addDoc(collection(db, "baiviet"), postData);
                return true;
            } catch (e) {
                console.error("Lỗi khi thêm bài viết: ", e);
                return false;
            }
        };

        // Hàm cập nhật bài viết hiện có
        window.updatePostInDb = async function(postId, postData) {
            try {
                const postRef = doc(db, "baiviet", postId);
                await updateDoc(postRef, postData);
                return true;
            } catch (e) {
                console.error("Lỗi khi cập nhật bài viết: ", e);
                return false;
            }
        };

        // Kích hoạt việc tải dữ liệu
        window.fetchPosts();
    </script>

    <script>
        // Khai báo biến toàn cục (Thay thế cho JSON tĩnh cũ)
        var postsData = [];
        var categories = [];
        var tags = [];

        // Hàm hiển thị thông báo thay thế alert()
        function showMessageBox(message, isError = false) {
            const box = document.createElement('div');
            box.className = `fixed top-20 right-4 px-6 py-3 rounded-lg shadow-lg text-white font-medium z-50 fade-in ${isError ? 'bg-red-500' : 'bg-green-500'}`;
            box.innerText = message;
            document.body.appendChild(box);
            setTimeout(() => {
                box.style.opacity = '0';
                box.style.transition = 'opacity 0.3s ease';
                setTimeout(() => box.remove(), 300);
            }, 3000);
        }

        // Hàm tải ảnh/file lên Cloudinary (Sử dụng auto/upload để hỗ trợ cả ảnh và PDF)
        async function uploadToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', 'blogcanhan'); // Preset mới của bạn
            
            try {
                // Cloud name: dw4qgckzf - Endpoint dùng "auto/upload" thay vì "image/upload"
                const response = await fetch('https://api.cloudinary.com/v1_1/dw4qgckzf/auto/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                if (data.secure_url) {
                    return data.secure_url;
                } else {
                    console.error("Lỗi tải file Cloudinary:", data);
                    return null;
                }
            } catch (error) {
                console.error('Lỗi khi kết nối Cloudinary:', error);
                return null;
            }
        }

        // ================= XỬ LÝ CHÈN ẢNH =================
        function triggerImageUpload() {
            document.getElementById('imageUploadInput').click();
        }

        async function handleImageUploadSelect(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                await processAndInsertImage(file);
                input.value = ''; // Reset
            }
        }

        async function processAndInsertImage(file) {
            const editor = document.getElementById('editorContent');
            editor.focus();
            
            showMessageBox("Đang tải ảnh lên Cloudinary...", false);
            editor.style.cursor = 'wait';

            const imageUrl = await uploadToCloudinary(file);
            
            editor.style.cursor = 'text';

            if (imageUrl) {
                document.execCommand('insertImage', false, imageUrl);
                showMessageBox("Tải ảnh thành công!");
            } else {
                showMessageBox("Lỗi: Không thể tải ảnh lên.", true);
            }
        }

        // ================= XỬ LÝ CHÈN FILE PDF =================
        function triggerFileUpload() {
            document.getElementById('fileUploadInput').click();
        }

        async function handleFileUploadSelect(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                if (file.type === 'application/pdf') {
                    await processAndInsertPDF(file);
                } else {
                    showMessageBox("Vui lòng chỉ chọn file PDF!", true);
                }
                input.value = ''; // Reset
            }
        }

        async function processAndInsertPDF(file) {
            const editor = document.getElementById('editorContent');
            editor.focus();
            
            showMessageBox("Đang tải file PDF lên Cloudinary...", false);
            editor.style.cursor = 'wait';

            const fileUrl = await uploadToCloudinary(file);
            
            editor.style.cursor = 'text';

            if (fileUrl) {
                // Chèn file dưới dạng một thẻ Link nút bấm bo góc đẹp mắt (an toàn hơn Iframe cho Editor)
                const pdfHtml = `
                    <br>
                    <a href="${fileUrl}" target="_blank" contenteditable="false" style="display: inline-flex; align-items: center; gap: 8px; padding: 12px 16px; background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; color: #2563eb; font-weight: 600; text-decoration: none; margin: 10px 0; font-family: sans-serif; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
                        <svg style="width: 24px; height: 24px; color: #ef4444;" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg> 
                        Xem / Tải File PDF: ${file.name}
                    </a>
                    <br>&nbsp;
                `;
                document.execCommand('insertHTML', false, pdfHtml);
                showMessageBox("Tải file PDF thành công!");
            } else {
                showMessageBox("Lỗi: Không thể tải file PDF lên.", true);
            }
        }

        // ================= XỬ LÝ PASTE ẢNH / PDF TỪ CLIPBOARD =================
        async function handleEditorPaste(e) {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file') {
                    if (item.type.startsWith('image/')) {
                        e.preventDefault(); 
                        const file = item.getAsFile();
                        await processAndInsertImage(file);
                        return;
                    } else if (item.type === 'application/pdf') {
                        e.preventDefault();
                        const file = item.getAsFile();
                        await processAndInsertPDF(file);
                        return; 
                    }
                }
            }
        }

        function setupEditorPasteHandler() {
            const editor = document.getElementById('editorContent');
            if (editor) {
                editor.removeEventListener('paste', handleEditorPaste);
                editor.addEventListener('paste', handleEditorPaste);
            }
        }

        // Hàm xử lý tự động xuống dòng cho nội dung văn bản
        function formatContent(text) {
            if (!text) return '';
            // Nếu nội dung đã chứa các thẻ HTML cấu trúc (p, br, h1-h6, div, ul, li, a) thì ưu tiên giữ nguyên
            if (/<(p|br|h[1-6]|div|ul|li|a)[^>]*>/i.test(text)) {
                return text; 
            }
            return text.split(/\n\n+/).map(paragraph => {
                return `<p>${paragraph.replace(/\n/g, '<br>')}</p>`;
            }).join('');
        }

        // Hàm helper cho Editor (Rich Text)
        function formatText(command, value = null) {
            document.execCommand(command, false, value);
            document.getElementById('editorContent').focus();
        }

        // HTML của thanh công cụ Editor
        const editorToolbarHtml = `

                <button type="button" onclick="formatText('italic')" class="p-1.5 text-slate-700 hover:bg-slate-200 rounded italic" title="In nghiêng (Ctrl+I)">I</button>

                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M3 21h18v-2H3v2zm0-4h12v-2H3v2zm0-4h18v-2H3v2zm0-4h12V7H3v2zm0-6v2h18V3H3z"/></svg>
                </button>
                <button type="button" onclick="formatText('justifyCenter')" class="p-1.5 text-slate-700 hover:bg-slate-200 rounded" title="Căn giữa">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M3 21h18v-2H3v2zm4-4h10v-2H7v2zm-4-4h18v-2H3v2zm4-4h10V7H7v2zm-4-6v2h18V3H3z"/></svg>
                </button>
                <button type="button" onclick="formatText('justifyRight')" class="p-1.5 text-slate-700 hover:bg-slate-200 rounded" title="Căn phải">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M3 21h18v-2H3v2zm6-4h12v-2H9v2zm-6-4h18v-2H3v2zm6-4h12V7H9v2zm-6-6v2h18V3H3z"/></svg>
                </button>
                
                <div class="w-px h-5 bg-slate-300 mx-1"></div>
                
                <!-- Nút chèn ảnh -->
                <button type="button" onclick="triggerImageUpload()" class="p-1.5 text-slate-700 hover:bg-slate-200 rounded" title="Tải ảnh lên và chèn">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                </button>
                <input type="file" id="imageUploadInput" accept="image/*" class="hidden" onchange="handleImageUploadSelect(this)">

                <!-- Nút chèn file PDF -->
                <button type="button" onclick="triggerFileUpload()" class="p-1.5 text-slate-700 hover:bg-slate-200 rounded" title="Tải file PDF lên">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                </button>
                <input type="file" id="fileUploadInput" accept=".pdf" class="hidden" onchange="handleFileUploadSelect(this)">

                <button type="button" onclick="formatText('removeFormat')" class="p-1.5 text-slate-700 hover:bg-slate-200 rounded text-sm ml-auto" title="Xóa định dạng">Xóa Fmt</button>
            </div>
        `;

        // Hàm render form tạo bài viết mới
        function renderCreatePost() {

        // Hàm xử lý sự kiện submit form
        async function handleCreatePost(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white mr-2"></div> Đang xử lý...';
            submitBtn.disabled = true;

            const tagsInput = document.getElementById('postTags').value;
            const tagsArray = tagsInput.split(',').map(tag => tag.trim()).filter(tag => tag !== "");

            // Lấy nội dung HTML từ Editor
            const rawContent = document.getElementById('editorContent').innerHTML;
            if(!rawContent.trim()) {
                showMessageBox("Nội dung không được để trống!", true);
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
                return;
            }

            const postData = {
                title: document.getElementById('postTitle').value,
                excerpt: document.getElementById('postExcerpt').value,
                thumbnail: document.getElementById('postThumbnail').value || "https://placehold.co/800x500/eff6ff/1e40af?text=" + encodeURIComponent(document.getElementById('postTitle').value.substring(0, 15)),
                category: document.getElementById('postCategory').value,
                tags: tagsArray,
                content: rawContent,
                date: new Date().toLocaleDateString('vi-VN')
            };

            const success = await window.addNewPostToDb(postData);

            if (success) {
                showMessageBox("Đăng bài viết thành công!");
                // Hiển thị trạng thái đang tải
                appElement.innerHTML = `
                    <div class="flex justify-center items-center py-32 flex-col">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-brand-600 mb-4"></div>
                        <span class="text-slate-600 font-medium">Đang cập nhật dữ liệu...</span>
                    </div>
                `;
                // Tải lại dữ liệu từ Firebase
                window.fetchPosts('home'); 
            } else {
                showMessageBox("Lỗi: Không thể lưu bài viết. Hãy kiểm tra rules của Firestore.", true);
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        }

        // Hàm render form chỉnh sửa bài viết
        function renderEditPost(postId) {
            const post = postsData.find(p => p.id === postId);
            if (!post) {
                return `<div class="text-center py-20 text-slate-600">Lỗi: Không tìm thấy bài viết để sửa.</div>`;
            }

            const safeTitle = (post.title || '').replace(/"/g, '&quot;');
            const safeThumb = (post.thumbnail || '').replace(/"/g, '&quot;');
            const safeCat = (post.category || '').replace(/"/g, '&quot;');
            const safeTags = ((post.tags || []).join(', ')).replace(/"/g, '&quot;');

            return `
                <div class="max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-200 fade-in mb-10">
                    <div class="flex items-center justify-between mb-8 pb-4 border-b border-slate-100">
                        <h2 class="text-2xl font-bold text-slate-800">✏️ Chỉnh Sửa Bài Viết</h2>
                        <a href="#" onclick="navigate('post', '${postId}'); return false;" class="text-sm text-slate-500 hover:text-brand-600">Quay lại</a>
                    </div>
                    
                    <form id="editPostForm" onsubmit="handleEditPost(event, '${postId}')" class="space-y-6">
                        <!-- Tiêu đề -->
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Tiêu đề <span class="text-red-500">*</span></label>
                            <input type="text" id="editPostTitle" required value="${safeTitle}" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                        </div>
                        
                        <!-- Mô tả -->
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Mô tả ngắn (Excerpt) <span class="text-red-500">*</span></label>
                            <textarea id="editPostExcerpt" required rows="2" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">${post.excerpt}</textarea>
                        </div>
                        
                        <!-- Ảnh Thumbnail -->
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Link Ảnh Thumbnail</label>
                            <input type="url" id="editPostThumbnail" value="${safeThumb}" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                        </div>
                        
                        <!-- Danh mục & Tags -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-1">Danh mục <span class="text-red-500">*</span></label>
                                <input type="text" id="editPostCategory" required value="${safeCat}" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-1">Tags (Cách nhau bởi dấu phẩy)</label>
                                <input type="text" id="editPostTags" value="${safeTags}" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                            </div>
                        </div>
                        
                        <!-- Nội dung -->
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Nội dung <span class="text-red-500">*</span></label>
                            ${editorToolbarHtml}
                            <div id="editorContent" contenteditable="true" class="w-full min-h-[300px] px-4 py-3 border border-slate-300 rounded-b-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all text-sm leading-relaxed bg-white overflow-y-auto post-content">${post.content}</div>
                            <p class="text-xs text-slate-500 mt-2">Gợi ý: Dùng nút chèn ảnh/PDF hoặc copy & paste trực tiếp (Ctrl+V) file vào đây.</p>
                        </div>
                        
                        <div class="flex justify-end gap-4 pt-4">
                            <button type="button" onclick="navigate('post', '${postId}')" class="px-6 py-2.5 text-slate-600 font-medium hover:bg-slate-100 rounded-lg transition-colors">Hủy bỏ</button>
                            <button type="submit" id="submitEditBtn" class="px-8 py-2.5 bg-brand-600 text-white font-bold rounded-lg hover:bg-brand-700 transition-colors shadow-sm flex items-center justify-center min-w-[140px]">
                                Lưu Thay Đổi
                            </button>
                        </div>
                    </form>
                </div>
            `;
        }

        // Hàm xử lý sự kiện submit form sửa bài
        async function handleEditPost(event, postId) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submitEditBtn');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white mr-2"></div> Đang lưu...';
            submitBtn.disabled = true;

            const tagsInput = document.getElementById('editPostTags').value;
            const tagsArray = tagsInput.split(',').map(tag => tag.trim()).filter(tag => tag !== "");

            // Lấy lại ngày đăng cũ để không bị ghi đè thành ngày hiện tại
            const existingPost = postsData.find(p => p.id === postId);

            // Lấy nội dung HTML từ Editor
            const rawContent = document.getElementById('editorContent').innerHTML;

            const postData = {
                title: document.getElementById('editPostTitle').value,
                excerpt: document.getElementById('editPostExcerpt').value,
                thumbnail: document.getElementById('editPostThumbnail').value || "https://placehold.co/800x500/eff6ff/1e40af?text=" + encodeURIComponent(document.getElementById('editPostTitle').value.substring(0, 15)),
                category: document.getElementById('editPostCategory').value,
                tags: tagsArray,
                content: rawContent,
                date: existingPost ? existingPost.date : new Date().toLocaleDateString('vi-VN')
            };

            const success = await window.updatePostInDb(postId, postData);

            if (success) {
                showMessageBox("Cập nhật bài viết thành công!");
                appElement.innerHTML = `
                    <div class="flex justify-center items-center py-32 flex-col">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-brand-600 mb-4"></div>
                        <span class="text-slate-600 font-medium">Đang tải lại dữ liệu...</span>
                    </div>
                `;
                // Tải lại dữ liệu và tự động điều hướng về lại bài viết vừa sửa
                window.fetchPosts('post', postId); 
            } else {
                showMessageBox("Lỗi: Không thể cập nhật bài viết. Kiểm tra rules của Firestore.", true);
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        }

        // Hàm render giao diện Sidebar
        function renderSidebar() {
            let catHtml = categories.map(cat => `
                <li>
                    <a href="#" onclick="navigate('category', '${cat}'); return false;" class="text-slate-600 hover:text-brand-600 transition-colors text-sm flex items-center justify-between">
                        ${cat}
                        <span class="bg-slate-100 text-slate-500 text-xs px-2 py-0.5 rounded-full">${postsData.filter(p => p.category === cat).length}</span>
                    </a>
                </li>
            `).join('');

            let tagHtml = tags.map(tag => `
                <a href="#" onclick="navigate('tag', '${tag}'); return false;" class="text-xs text-slate-600 bg-slate-100 hover:bg-brand-100 hover:text-brand-700 px-3 py-1.5 rounded-full transition-colors inline-block mb-2 mr-1">
                    #${tag}
                </a>
            `).join('');

            return `
                <aside class="w-full lg:w-1/4 space-y-8 mt-8 lg:mt-0 shrink-0">
                    <!-- Khối Giới thiệu -->
                    <div id="about-section" class="bg-slate-50 p-6 rounded-2xl border border-slate-200">
                        <div class="flex items-center gap-4 mb-4">
                            <div class="w-12 h-12 bg-brand-100 text-brand-600 rounded-full flex items-center justify-center text-xl font-bold">
                                T
                            </div>
                            <div>
                                <h3 class="text-base font-bold text-slate-800">Về tác giả</h3>
                                <p class="text-xs text-slate-500">Người viết blog</p>
                            </div>
                        </div>
                        <p class="text-slate-600 text-sm leading-relaxed">
                            Chào bạn! Đây là không gian nhỏ nơi tôi chia sẻ những kiến thức tích lũy được về công nghệ, toán học và phương pháp học tập hiệu quả.
                        </p>
                    </div>

                    <!-- Khối Danh mục -->
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <h3 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                            <svg class="w-5 h-5 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                            Danh mục
                        </h3>
                        <ul class="space-y-3">
                            ${catHtml}
                        </ul>
                    </div>

                    <!-- Khối Tags -->
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <h3 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                            <svg class="w-5 h-5 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
                            Từ khóa nổi bật
                        </h3>
                        <div>
                            ${tagHtml}
                        </div>
                    </div>
                </aside>
            `;
        }

        // Hàm render một thẻ bài viết tóm tắt
        function renderPostCard(post) {
            return `
                <article class="bg-white flex flex-col h-full hover:bg-slate-50 transition-colors p-2 rounded-xl">
                    <a href="#" onclick="navigate('post', '${post.id}'); return false;" class="block mb-2 group">
                        <h3 class="text-[1.35rem] font-bold text-red-600 group-hover:text-red-700 transition-colors line-clamp-3 leading-tight uppercase">
                            ${post.title}
                        </h3>
                    </a>
                    <p class="text-slate-400 text-sm mb-4">nguyenvancuong - ${post.date}</p>
                    <p class="text-slate-600 text-[15px] mb-6 line-clamp-4 flex-grow">${post.excerpt}</p>
                    <div class="mt-auto">
                        <a href="#" onclick="navigate('post', '${post.id}'); return false;" class="text-red-600 font-bold text-sm hover:underline uppercase">
                            XEM CHI TIẾT
                        </a>
                    </div>
                </article>
            `;
        }

        // Render thanh Ticker Bài Đăng Mới
        function renderNewsTicker() {
            // Lấy 3 bài viết mới nhất (Giả sử danh sách đã được sắp xếp, nếu chưa có thể sort theo date)
            // Trong thực tế nếu date là string, bạn nên dùng timestamp để sort chính xác hơn
            const latestPosts = [...postsData].slice(0, 3);
            
            if (latestPosts.length === 0) return '';

            const tickerItemsHtml = latestPosts.map(post => `
                <a href="#" onclick="navigate('post', '${post.id}'); return false;" class="flex items-center gap-3 mx-8 group cursor-pointer hover:opacity-80 transition-opacity">
                    <div class="w-[45px] h-[45px] shrink-0 rounded overflow-hidden shadow-sm">
                        <img src="${post.thumbnail}" alt="${post.title}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100/f8fafc/334155?text=Anh'">
                    </div>
                    <span class="text-[17px] font-bold text-[#333] group-hover:text-brand-600 transition-colors">${post.title}</span>
                </a>
            `).join('');

            return `
                <div class="flex items-stretch w-full">
                    <!-- Nhãn tĩnh bên trái -->
                    <div class="bg-[#ff0000] text-white font-bold text-[18px] uppercase px-6 py-4 flex items-center shrink-0 z-10 shadow-[2px_0_5px_rgba(0,0,0,0.1)]">
                        <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd"></path></svg>
                        BÀI ĐĂNG MỚI
                    </div>
                    
                    <!-- Phần chữ chạy bên phải -->
                    <div class="marquee-container flex-grow bg-white items-center h-full">
                        <div class="marquee-content h-full">
                            ${tickerItemsHtml}
                            <!-- Lặp lại nội dung để tạo cảm giác chạy liên tục mượt mà hơn (tùy chọn) -->
                            ${tickerItemsHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        // Render trang chi tiết bài viết
        function renderPostDetail(postId) {
            const post = postsData.find(p => p.id === postId);
            if (!post) {
                return `<div class="text-center py-20 text-slate-600">Không tìm thấy bài viết.</div>`;
            }

            let tagsHtml = (post.tags || []).map(tag => `
                <a href="#" onclick="navigate('tag', '${tag}'); return false;" class="text-sm bg-slate-100 hover:bg-brand-100 hover:text-brand-700 transition-colors px-3 py-1 rounded-full text-slate-600">#${tag}</a>
            `).join('');

            return `
                <div class="max-w-4xl mx-auto bg-white p-6 md:p-10 rounded-2xl shadow-sm border border-slate-200 fade-in relative">
                    <div class="flex justify-between items-center mb-6">
                        <a href="#" onclick="navigate('home'); return false;" class="text-brand-600 font-medium hover:underline flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                            Quay lại
                        </a>
                        <a href="#" onclick="navigate('edit', '${post.id}'); return false;" class="text-slate-500 hover:text-brand-600 flex items-center gap-1 text-sm bg-slate-50 px-3 py-1.5 rounded-lg transition-colors border border-slate-200">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                            Sửa bài
                        </a>
                    </div>
                    
                    <article>
                        <header class="mb-8 border-b border-slate-100 pb-8 text-center">
                            <a href="#" onclick="navigate('category', '${post.category}'); return false;" class="text-brand-600 bg-brand-50 hover:bg-brand-100 px-3 py-1 rounded-full text-sm font-medium mb-5 inline-block transition-colors">
                                ${post.category}
                            </a>
                            <h1 class="text-3xl md:text-4xl font-extrabold text-slate-800 mb-4 leading-tight">
                                ${post.title}
                            </h1>
                            <p class="text-slate-500 text-sm">Đăng ngày: ${post.date}</p>
                        </header>

                        <img src="${post.thumbnail}" alt="${post.title}" class="w-full h-auto rounded-2xl mb-10 object-cover max-h-[400px]" onerror="this.src='https://placehold.co/600x400/f8fafc/334155?text=Loi+Anh'">

                        <div class="post-content text-lg">
                            ${formatContent(post.content)}
                        </div>

                        <footer class="mt-12 pt-8 border-t border-slate-200">
                            <p class="text-sm text-slate-500 mb-3 font-medium">Gắn thẻ bài viết:</p>
                            <div class="flex flex-wrap gap-2">
                                ${tagsHtml}
                            </div>
                        </footer>
                    </article>
                </div>
            `;
        }

        // Hàm render trang chủ và bộ lọc (Đã được khôi phục)
        function renderHome(filterType = null, filterValue = null) {
            let filteredPosts = postsData;
            let title = '-Bài đăng gần đây-';

            if (filterType === 'category') {
                filteredPosts = postsData.filter(p => p.category === filterValue);
                title = `-Danh mục: ${filterValue}-`;
            } else if (filterType === 'tag') {
                filteredPosts = postsData.filter(p => (p.tags || []).includes(filterValue));
                title = `-Từ khóa: #${filterValue}-`;
            }

            let postsHtml = '<div class="col-span-full text-center py-10 text-slate-500">Chưa có bài viết nào.</div>';
            if (filteredPosts.length > 0) {
                postsHtml = filteredPosts.map(post => renderPostCard(post)).join('');
            }

            return `
                <div class="flex flex-col lg:flex-row gap-10 w-full fade-in pb-12">
                    <div class="flex-grow w-full lg:w-3/4">
                        <h2 class="text-[2rem] font-bold mb-10 text-[#000080] text-center tracking-tight">${title}</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-12">
                            ${postsHtml}
                        </div>
                    </div>
                    ${renderSidebar()}
                </div>
            `;
        }

        const appElement = document.getElementById('app');

        // Hàm xử lý chuyển trang
        function navigate(view, params = null) {
            // Cuộn lên đầu trang mỗi khi chuyển nội dung
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // Xóa nội dung cũ để kích hoạt lại animation
            appElement.innerHTML = ''; 

            setTimeout(() => {
                if (view === 'home') {
                    appElement.innerHTML = renderHome();
                } else if (view === 'category') {
                    appElement.innerHTML = renderHome('category', params);
                } else if (view === 'tag') {
                    appElement.innerHTML = renderHome('tag', params);
                } else if (view === 'post') {
                    appElement.innerHTML = renderPostDetail(params);
                } else if (view === 'create') {
                    appElement.innerHTML = renderCreatePost();
                    setupEditorPasteHandler(); // Bật tính năng Paste Ảnh và PDF
                } else if (view === 'edit') {
                    appElement.innerHTML = renderEditPost(params);
                    setupEditorPasteHandler(); // Bật tính năng Paste Ảnh và PDF
                }
            }, 50); // Timeout nhỏ để đảm bảo DOM được làm sạch trước khi render lại
        }

        // Hàm cuộn tới phần giới thiệu
        function scrollToAbout() {
            // Đảm bảo đang ở màn hình có sidebar (trang chủ)
            if(!document.getElementById('about-section')) {
                navigate('home');
                setTimeout(() => {
                    document.getElementById('about-section').scrollIntoView({ behavior: 'smooth' });
                }, 100);
            } else {
                document.getElementById('about-section').scrollIntoView({ behavior: 'smooth' });
            }
        }

        // Hàm khởi tạo Blog sau khi Firebase tải xong dữ liệu
        window.initializeBlog = function(targetView = 'home', targetParams = null) {
            // Tạo danh sách tag và category mới từ dữ liệu Firebase
            categories = [...new Set(postsData.map(post => post.category))];
            tags = [...new Set(postsData.flatMap(post => post.tags || []))];
            
            // Render News Ticker
            const tickerElement = document.getElementById('new-posts-ticker');
            if (tickerElement) {
                tickerElement.innerHTML = renderNewsTicker();
            }

            // Xóa Loading và Hiển thị trang được yêu cầu
            navigate(targetView, targetParams);
        };

        // Khởi tạo trang web lần đầu (Hiển thị màn hình Loading)
        document.addEventListener('DOMContentLoaded', () => {
            appElement.innerHTML = `
                <div class="flex justify-center items-center py-32 fade-in flex-col">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-brand-600 mb-4"></div>
                    <span class="text-slate-600 font-medium">Đang kết nối Firebase và tải bài viết...</span>
                </div>
            `;
        });

    </script>
</body>
</html>
