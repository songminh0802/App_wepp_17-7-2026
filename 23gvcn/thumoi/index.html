<!DOCTYPE html>

    <!-- Vùng chứa ứng dụng React -->

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- COMPONENT RENDER ICON ---
        const Icon = ({ name, className = "" }) => <i className={`fa-solid fa-${name} ${className}`}></i>;

        // --- THIẾT LẬP FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyC-8kCyIv8n7jB-GiKXGeWllpXtoBNPKzA",
            authDomain: "cuongcsdl.firebaseapp.com",
            databaseURL: "https://cuongcsdl-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "cuongcsdl",
            storageBucket: "cuongcsdl.firebasestorage.app",
            messagingSenderId: "510371041821",
            appId: "1:510371041821:web:b37e8534f4f1132df62cf4"
        };
        
        // Khởi tạo Firebase nếu chưa có
        if (!window.firebase.apps.length) {
            window.firebase.initializeApp(firebaseConfig);
        }
        const db = window.firebase.firestore();

        // --- MOCK DATA & CONSTANTS ---
        const THEMES = [
            { id: 'navy', name: 'Navy - Gold Luxury', bg: 'bg-slate-900', text: 'text-amber-50', border: 'border-amber-400', accent: 'text-amber-400', pattern: `url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23f59e0b' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"), linear-gradient(135deg, #0f172a 0%, #1e293b 100%)` },
            { id: 'white', name: 'White Elegant', bg: 'bg-white', text: 'text-slate-800', border: 'border-slate-300', accent: 'text-amber-600', pattern: `url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%2394a3b8' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E"), linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%)` },
            { id: 'burgundy', name: 'Burgundy Ceremony', bg: 'bg-red-950', text: 'text-amber-50', border: 'border-amber-400', accent: 'text-amber-400', pattern: `url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 20.5V18H0v-2h20v-2.5L22.5 16 25 13.5V0h2v13.5L29.5 16 32 18.5V20h8v2h-8v1.5L29.5 26 27 28.5V40h-2V28.5L22.5 26 20 23.5V22H0v-2h20v.5z' fill='%23fcd34d' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E"), radial-gradient(circle at 50% 0%, #7f1d1d 0%, #450a0a 100%)` },
            { id: 'pastel', name: 'Pastel Modern', bg: 'bg-blue-50', text: 'text-slate-800', border: 'border-blue-300', accent: 'text-blue-600', pattern: `url("data:image/svg+xml,%3Csvg width='52' height='26' viewBox='0 0 52 26' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%233b82f6' fill-opacity='0.05'%3E%3Cpath d='M10 10c0-2.21-1.79-4-4-4-3.314 0-6-2.686-6-6h2c0 2.21 1.79 4 4 4 3.314 0 6 2.686 6 6 0 2.21 1.79 4 4 4v2c-3.314 0-6-2.686-6-6 0-2.21-1.79-4-4-4-3.314 0-6-2.686-6-6zm25.464-1.95l8.486 8.486-1.414 1.414-8.486-8.486 1.414-1.414z' /%3E%3C/g%3E%3C/g%3E%3C/svg%3E"), linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%)` }
        ];

        const INITIAL_STUDENTS = [
            { id: 1, name: 'Nguyễn Văn A', class: '10A1', parent: 'Nguyễn Văn B', phone: '0901234567', status: 'sent', confirmed: true, photo: null },
            { id: 2, name: 'Trần Thị C', class: '10A1', parent: 'Trần Văn D', phone: '0987654321', status: 'sent', confirmed: false, photo: null },
            { id: 3, name: 'Lê Hoàng E', class: '10A1', parent: 'Lê Văn F', phone: '0912345678', status: 'pending', confirmed: false, photo: null },
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('school');
            
            const [schoolInfo, setSchoolInfo] = useState({
                name: 'TRƯỜNG THCS Tân Bình',
                address: 'Khu phố Cổng Xanh, phường Vĩnh Tân, TP Hồ Chí Minh',
                year: '2025 - 2026',
                className: '10A1',
                teacher: 'Nguyễn Văn Cường',
                phone: '0788 095 095',
                logo: null
            });

            const [students, setStudents] = useState(INITIAL_STUDENTS);
            const [meetingInfo, setMeetingInfo] = useState({
                date: '2025-09-15',
                time: '08:00',
                location: 'Phòng học lớp 10A1, Tòa nhà A',
                type: 'Họp đầu năm học',
                notes: 'Quý phụ huynh vui lòng mang theo giấy bút để ghi chép các thông tin quan trọng về phương pháp học tập mới.'
            });

            const [design, setDesign] = useState({ theme: 'navy', size: 'A5', showPhoto: true });
            const [signature, setSignature] = useState(null);
            
            const [selectedToPrint, setSelectedToPrint] = useState([]);
            const [isDownloading, setIsDownloading] = useState(false);
            const [isProcessingExcel, setIsProcessingExcel] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);
            const [previewFullscreenId, setPreviewFullscreenId] = useState(null);

            const [toast, setToast] = useState({ show: false, message: '', type: 'info' });

            const showToast = (message, type = 'info') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'info' }), 4000);
            };

            // Tải dữ liệu từ Firestore khi mở trang web
            useEffect(() => {
                const loadData = async () => {
                    try {
                        const docRef = db.collection('thumoiph').doc('dulieu_chung');
                        const doc = await docRef.get();
                        if (doc.exists) {
                            const data = doc.data();
                            if (data.schoolInfo) setSchoolInfo(data.schoolInfo);
                            if (data.students) setStudents(data.students);
                            if (data.meetingInfo) setMeetingInfo(data.meetingInfo);
                            if (data.design) setDesign(data.design);
                            if (data.signature) setSignature(data.signature);
                            showToast("Đã đồng bộ dữ liệu từ Đám mây!", "success");
                        }
                    } catch (error) {
                        console.error("Lỗi tải Cloud:", error);
                        showToast("Có lỗi khi kết nối tới Đám mây.", "error");
                    }
                };
                loadData();
            }, []);

            // Lưu toàn bộ dữ liệu lên Firestore
            const saveToCloud = async () => {
                setIsSyncing(true);
                try {
                    await db.collection('thumoiph').doc('dulieu_chung').set({
                        schoolInfo,
                        students,
                        meetingInfo,
                        design,
                        signature
                    });
                    showToast("Đã lưu dữ liệu thành công lên Cloud!", "success");
                } catch (error) {
                    console.error("Lỗi lưu Cloud:", error);
                    showToast("Không thể lưu dữ liệu (Kiểm tra quyền Firebase).", "error");
                }
                setIsSyncing(false);
            };

            useEffect(() => {
                setSelectedToPrint(students.map(s => s.id));
            }, [students.length]); 

            const downloadExcelTemplate = () => {
                try {
                    const wsData = [
                        { "STT": 1, "Họ và tên HS": "Nguyễn Văn A", "Lớp": "10A1", "Họ và tên Phụ huynh": "Nguyễn Văn B", "Số điện thoại": "0901234567" },
                        { "STT": 2, "Họ và tên HS": "Trần Thị C", "Lớp": "10A1", "Họ và tên Phụ huynh": "Trần Văn D", "Số điện thoại": "0987654321" }
                    ];
                    const ws = XLSX.utils.json_to_sheet(wsData);
                    const wscols = [{wch:5}, {wch:25}, {wch:10}, {wch:25}, {wch:15}];
                    ws['!cols'] = wscols;

                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Danh_Sach_Phu_Huynh");
                    XLSX.writeFile(wb, "Mau_Danh_Sach_Phu_Huynh.xlsx");
                } catch (error) {
                    showToast("Lỗi khi tải file mẫu. Vui lòng kiểm tra lại.", "error");
                }
            };

            const exportToExcel = () => {
                try {
                    const wsData = students.map((s, i) => ({
                        "STT": i + 1,
                        "Họ và tên HS": s.name,
                        "Lớp": s.class,
                        "Họ và tên Phụ huynh": s.parent,
                        "Số điện thoại": s.phone,
                        "Xác nhận tham gia": s.confirmed ? "Đã xác nhận" : "Chưa"
                    }));
                    
                    const ws = XLSX.utils.json_to_sheet(wsData);
                    const wscols = [{wch:5}, {wch:25}, {wch:10}, {wch:25}, {wch:15}, {wch:20}];
                    ws['!cols'] = wscols;

                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Danh_Sach_Hoc_Sinh");
                    XLSX.writeFile(wb, "Danh_Sach_Hoc_Sinh_Export.xlsx");
                } catch (error) {
                    showToast("Lỗi khi xuất file Excel.", "error");
                }
            };

            const handleExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                setIsProcessingExcel(true);
                try {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        try {
                            const data = new Uint8Array(evt.target.result);
                            const wb = XLSX.read(data, { type: 'array' });
                            const wsname = wb.SheetNames[0];
                            const ws = wb.Sheets[wsname];
                            const rawData = XLSX.utils.sheet_to_json(ws, { defval: '' });
                            
                            if (rawData.length === 0) {
                                showToast("File trống hoặc không đúng định dạng.", "error");
                                setIsProcessingExcel(false); return;
                            }

                            const jsonData = rawData.map(row => {
                                const cleanRow = {};
                                for(let key in row) cleanRow[key.replace(/^\uFEFF/, '').trim()] = row[key];
                                return cleanRow;
                            });

                            const newStudents = jsonData.map((row, index) => {
                                const getVal = (keys) => {
                                    for (let k of keys) if (row[k] !== undefined && row[k] !== '') return String(row[k]).trim();
                                    return '';
                                };
                                return {
                                    id: Date.now() + index,
                                    name: getVal(["Họ và tên HS", "Họ Tên HS", "Học sinh", "Họ và tên", "Name"]),
                                    class: getVal(["Lớp", "Class"]) || schoolInfo.className || '',
                                    parent: getVal(["Họ và tên Phụ huynh", "Phụ huynh", "Họ tên phụ huynh", "Parent"]),
                                    phone: getVal(["Số điện thoại", "SĐT", "Điện thoại", "Phone"]),
                                    status: 'pending', confirmed: false, photo: null
                                };
                            }).filter(s => s.name);

                            if (newStudents.length === 0) {
                                showToast("Không tìm thấy dữ liệu hợp lệ.", "error");
                                setIsProcessingExcel(false); return;
                            }

                            setStudents(newStudents);
                            showToast(`Đã tải lên thành công danh sách ${newStudents.length} học sinh!`, "success");
                        } catch (err) {
                            showToast("Lỗi xử lý dữ liệu.", "error");
                        }
                        setIsProcessingExcel(false);
                    };
                    reader.readAsArrayBuffer(file);
                } catch (error) {
                    showToast("Đã có lỗi khi đọc file.", "error");
                    setIsProcessingExcel(false);
                }
                e.target.value = null; 
            };

            const handleBulkPhotoUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                
                const normalizeString = (str) => str ? str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, '') : "";

                let newStudents = [...students];
                let matchCount = 0;

                for (let file of files) {
                    const rawFileName = file.name.substring(0, file.name.lastIndexOf('.'));
                    const normalizedFileName = normalizeString(rawFileName);

                    const studentIndex = newStudents.findIndex(s => {
                        const normalizedStudentName = normalizeString(s.name);
                        return normalizedFileName === normalizedStudentName || normalizedFileName.includes(normalizedStudentName) || normalizedStudentName.includes(normalizedFileName);
                    });

                    if (studentIndex !== -1) {
                        const base64 = await new Promise(resolve => {
                            const reader = new FileReader();
                            reader.onload = ev => resolve(ev.target.result);
                            reader.readAsDataURL(file);
                        });
                        newStudents[studentIndex] = { ...newStudents[studentIndex], photo: base64 };
                        matchCount++;
                    }
                }
                setStudents(newStudents);
                showToast(`Đã tự động ghép thành công ${matchCount} ảnh.`, "success");
                e.target.value = null;
            };

            const handleStudentPhotoUpload = (e, id) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setStudents(students.map(s => s.id === id ? { ...s, photo: reader.result } : s));
                    reader.readAsDataURL(file);
                }
            };

            const downloadSingleImage = async (studentId, studentName, elementIdPrefix = 'invitation-') => {
                try {
                    const element = document.getElementById(`${elementIdPrefix}${studentId}`);
                    if (!element) return;

                    const canvas = await html2canvas(element, { scale: 2, useCORS: true, backgroundColor: null });
                    const image = canvas.toDataURL("image/png");
                    const link = document.createElement('a');
                    link.href = image;
                    link.download = `GiayMoi_${studentName.replace(/\s+/g, '_')}.png`;
                    link.click();
                } catch (error) {
                    console.error("Lỗi khi tạo ảnh:", error);
                }
            };

            const downloadAsImage = async (studentId, studentName) => {
                setIsDownloading(true);
                try { await downloadSingleImage(studentId, studentName); } 
                catch (e) { showToast("Đã có lỗi xảy ra khi tạo ảnh.", "error"); } 
                finally { setIsDownloading(false); }
            };

            const downloadSelectedImages = async () => {
                if (selectedToPrint.length === 0) return showToast("Vui lòng chọn ít nhất 1 thư mời để tải!", "error");
                setIsDownloading(true);
                try {
                    for (const id of selectedToPrint) {
                        const student = students.find(s => s.id === id);
                        if (student) {
                            await downloadSingleImage(id, student.name);
                            await new Promise(r => setTimeout(r, 400));
                        }
                    }
                } catch (error) {
                    showToast("Đã có lỗi xảy ra khi tải ảnh hàng loạt.", "error");
                } finally {
                    setIsDownloading(false);
                }
            };

            const processSignatureImage = (dataUrl) => {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = img.width; canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);

                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const data = imageData.data;

                        for (let i = 0; i < data.length; i += 4) {
                            const r = data[i], g = data[i + 1], b = data[i + 2];
                            const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                            data[i] = 0; data[i + 1] = 0; data[i + 2] = 0;
                            let alpha = 255 - luma;
                            if (alpha < 40) alpha = 0; 
                            else alpha = Math.min(255, alpha * 1.5);
                            data[i + 3] = alpha;
                        }
                        ctx.putImageData(imageData, 0, 0);
                        resolve(canvas.toDataURL('image/png'));
                    };
                    img.src = dataUrl;
                });
            };

            const handleSignatureUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = async () => {
                        const processedSignature = await processSignatureImage(reader.result);
                        setSignature(processedSignature);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleImageUpload = (e, setter) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setter(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const printInvitations = () => {
                if (selectedToPrint.length === 0) return showToast("Vui lòng chọn ít nhất 1 thư mời để in!", "error");
                window.print();
            };

            const renderSidebarItem = (id, iconName, label) => (
                <button
                    onClick={() => setActiveTab(id)}
                    className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg transition-all duration-200 ${
                        activeTab === id ? 'bg-amber-500 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                    }`}
                >
                    <Icon name={iconName} className="text-lg w-5 text-center" />
                    <span className="font-medium text-sm">{label}</span>
                </button>
            );

            const theme = THEMES.find(t => t.id === design.theme) || THEMES[0];

            const renderInvitationCard = (student, idx, isModal = false) => {
                const isDarkTheme = theme.id === 'navy' || theme.id === 'burgundy';
                const isA4 = design.size === 'A4';

                                            </div>
                                            <div className="bg-slate-100 p-6 rounded-2xl border flex items-center justify-center">
                                                <div className={`relative shadow-2xl transition-all ${theme.bg} ${theme.border} border-4 ${design.size === 'A4' ? 'w-[70%] aspect-[1/1.414]' : 'w-full aspect-[1.414/1]'} p-6 rounded-sm flex flex-col justify-center items-center`}>
                                                    <div className={`text-2xl font-bold uppercase ${theme.accent}`}>BẢN XEM TRƯỚC</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'signature' && (
                                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 animate-fadeIn max-w-2xl mx-auto text-center">
                                        <h3 className="text-2xl font-bold mb-6">Chữ ký Điện tử</h3>
                                        <div className="border-2 border-dashed border-slate-300 rounded-2xl p-10 relative cursor-pointer hover:bg-slate-50">
                                            <input type="file" accept="image/*" onChange={handleSignatureUpload} className="absolute inset-0 w-full h-full opacity-0 z-10" />
                                            {signature ? <img src={signature} className="h-32 mx-auto drop-shadow-md" /> : <div><Icon name="upload" className="text-4xl text-amber-500 mb-4"/><p>Tải ảnh chữ ký (AI sẽ tự lọc nền trắng)</p></div>}
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'preview' && (
                                    <div className="animate-fadeIn">
                                        <div className="mb-6 flex justify-between items-center bg-white p-5 rounded-2xl shadow-sm border border-slate-200 print:hidden">
                                            <div>
                                                <h3 className="text-xl font-bold">Xem trước & Xuất bản</h3>
                                                <div className="mt-4 flex items-center">
                                                    <input type="checkbox" checked={selectedToPrint.length === students.length && students.length > 0} onChange={(e) => setSelectedToPrint(e.target.checked ? students.map(s => s.id) : [])} className="w-5 h-5 mr-2" /> Chọn tất cả ({selectedToPrint.length}/{students.length})
                                                </div>
                                            </div>
                                            <div className="flex gap-3">
                                                <button onClick={downloadSelectedImages} disabled={selectedToPrint.length === 0 || isDownloading} className="px-6 py-3 bg-slate-800 text-white rounded-xl text-sm font-bold disabled:opacity-50"><Icon name="download" className="mr-2"/> {isDownloading ? "Đang xử lý..." : "Tải ảnh"}</button>
                                                <button onClick={printInvitations} disabled={selectedToPrint.length === 0} className="px-6 py-3 bg-amber-500 text-white rounded-xl text-sm font-bold disabled:opacity-50"><Icon name="print" className="mr-2"/> In bản cứng</button>
                                            </div>
                                        </div>

                                        <div className="bg-slate-200 p-8 rounded-2xl print:p-0 print:bg-transparent flex flex-col items-center space-y-16">
                                            {students.map((student, idx) => {
                                                const isSelected = selectedToPrint.includes(student.id);
                                                return (
                                                    <div key={student.id} className={`relative group transition-all duration-300 ${isSelected ? '' : 'opacity-40 grayscale-[0.5] print:hidden'}`}>
                                                        <div className={`absolute top-4 left-4 z-20 cursor-pointer print:hidden flex items-center justify-center w-8 h-8 rounded-lg border-2 ${isSelected ? 'bg-amber-500 border-amber-500 text-white' : 'bg-white border-slate-300'}`} onClick={() => setSelectedToPrint(prev => prev.includes(student.id) ? prev.filter(id => id !== student.id) : [...prev, student.id])}>
                                                            {isSelected && <Icon name="check" />}
                                                        </div>
                                                        {renderInvitationCard(student, idx)}
                                                        <div className="absolute inset-0 bg-slate-900/60 opacity-0 group-hover:opacity-100 transition-all duration-300 flex items-center justify-center print:hidden z-10 pointer-events-none">
                                                            <div className="flex space-x-4 pointer-events-auto">
                                                                <button onClick={(e) => { e.stopPropagation(); setPreviewFullscreenId(student.id); }} className="px-6 py-3 bg-white text-slate-900 rounded-xl font-bold"><Icon name="expand" className="mr-2"/> Xem Lớn</button>
                                                                <button onClick={(e) => { e.stopPropagation(); downloadAsImage(student.id, student.name); }} className="px-6 py-3 bg-amber-500 text-white rounded-xl font-bold" disabled={isDownloading}><Icon name="download" className="mr-2"/> Tải Ảnh</button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </main>

                        {previewFullscreenId && (() => {
                            const student = students.find(s => s.id === previewFullscreenId);
                            if (!student) return null;
                            return (
                                <div className="fixed inset-0 z-[100] bg-slate-900/95 flex flex-col print:hidden animate-fadeIn">
                                    <div className="h-20 px-10 flex items-center justify-between border-b border-white/10 shadow-lg">
                                        <h3 className="text-white font-bold text-xl"><Icon name="expand" className="mr-3 text-amber-500"/> Phụ huynh: {student.parent}</h3>
                                        <div className="flex space-x-5">
                                            <button onClick={() => downloadAsImage(student.id, student.name)} className="px-4 py-2 bg-amber-500 text-white rounded-lg font-bold"><Icon name="download" className="mr-2"/> Tải ảnh</button>
                                            <button onClick={() => setPreviewFullscreenId(null)} className="p-2 text-white hover:text-red-500"><Icon name="xmark" className="text-2xl" /></button>
                                        </div>
                                    </div>
                                    <div className="flex-1 overflow-auto custom-scrollbar flex items-start justify-center p-12">
                                        <div className="transform origin-top hover:scale-[1.02] transition-transform">{renderInvitationCard(student, 0, true)}</div>
                                    </div>
                                </div>
                            );
                        })()}

                        {toast.show && (
                            <div className={`fixed bottom-8 right-8 z-[200] px-6 py-4 rounded-xl shadow-2xl flex items-center text-white animate-fadeIn ${toast.type === 'error' ? 'bg-red-500' : 'bg-green-600'}`}>
                                <Icon name={toast.type === 'error' ? 'circle-xmark' : 'circle-check'} className="text-xl mr-3" />
                                <span className="font-semibold text-sm">{toast.message}</span>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Khởi chạy App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
